function buildSnake(w){
  const DIFF={
    calm:{name:'Calm',step:700,speedUp:0.55,label:'for thinking'},
    normal:{name:'Normal',step:550,speedUp:1,label:'the intended experience'},
    brutal:{name:'Brutal',step:400,speedUp:1.7,label:'good luck'}
  };
  const diff=LS.get('snakeDiff','normal');
  w.body.innerHTML=`<div class="gm">
    <canvas class="gmCanvas"></canvas>
    <div class="gmHud">
      <div class="s"><span>SCORE</span><b data-score>0</b></div>
      <div class="s"><span>BEST</span><b data-best>0</b></div>
      <div class="s"><span>LENGTH</span><b data-len>3</b></div>
      <div class="s"><span>LEVEL</span><b data-lvl>1</b></div>
      <div class="s" style="margin-left:auto;text-align:right"><span>DIFFICULTY</span>
        <b data-diff style="font-size:13px">${DIFF[diff].name}</b></div>
    </div>
    <div class="gmKeys">
      ARROWS / WASD — steer &nbsp;·&nbsp; SPACE — pause &nbsp;·&nbsp; R — restart &nbsp;·&nbsp; ESC — exit
    </div>
    <div class="gmOverlay" data-ov>
      <h2>NEON SNAKE</h2>
      <p>Steer with the arrow keys or WASD. Each pellet adds length and raises the step rate.
         Running into yourself or a wall ends the run.</p>
      <div class="diffbar">
        ${Object.entries(DIFF).map(([k,v])=>`<button class="btn${k===diff?' pri':''}" data-d="${k}">${v.name}<span style="opacity:.6;font-size:10px"> · ${v.label}</span></button>`).join('')}
      </div>
      <button class="btn pri" data-play style="padding:11px 34px;font-size:14px">▶ START RUN</button>
    </div>
  </div>`;
  const cv=w.body.querySelector('canvas'),ctx=cv.getContext('2d');
  const ov=w.body.querySelector('[data-ov]');
  const hud={score:w.body.querySelector('[data-score]'),best:w.body.querySelector('[data-best]'),
    len:w.body.querySelector('[data-len]'),lvl:w.body.querySelector('[data-lvl]')};
  const N=22;
  const st={snake:[],dir:{x:1,y:0},next:{x:1,y:0},food:{x:5,y:5},score:0,level:1,
    step:DIFF[diff].step,acc:0,last:0,state:'menu',shake:0,diff,particles:[],trail:[],flash:0,raf:0};
  hud.best.textContent=GAMES.snake.best();

  function fit(){
    const r=cv.getBoundingClientRect();
    const d=Math.min(devicePixelRatio||1,2);
    cv.width=Math.max(300,r.width*d);cv.height=Math.max(300,r.height*d);
    ctx.setTransform(d,0,0,d,0,0);
    st.cell=Math.floor(Math.min(cv.width,cv.height)/N);
    st.ox=(cv.width-st.cell*N)/2; st.oy=(cv.height-st.cell*N)/2;
  }
  function reset(){
    const c=Math.floor(N/2);
    st.snake=[{x:c,y:c},{x:c-1,y:c},{x:c-2,y:c}];
    st.dir={x:1,y:0};st.next={x:1,y:0};
    st.score=0;st.level=1;st.step=DIFF[st.diff].step;st.acc=0;st.shake=0;st.particles=[];
    placeFood();syncHUD();
  }
  function placeFood(){
    const free=[];
    for(let y=0;y<N;y++)for(let x=0;x<N;x++)
      if(!st.snake.some(s=>s.x===x&&s.y===y))free.push({x,y});
    st.food=free.length?free[(Math.random()*free.length)|0]:null;
  }
  function syncHUD(){
    hud.score.textContent=st.score;hud.len.textContent=st.snake.length;
    hud.lvl.textContent=st.level;
    hud.best.textContent=Math.max(GAMES.snake.best(),st.score);
  }
  function turn(x,y){
    if(st.dir.x===-x&&st.dir.y===-y)return;
    st.next={x,y};
  }
  function step(){
    st.dir=st.next;
    const h=st.snake[0];
    const nx=h.x+st.dir.x, ny=h.y+st.dir.y;
    if(nx<0||ny<0||nx>=N||ny>=N)return die('wall');
    if(st.snake.some(s=>s.x===nx&&s.y===ny))return die('self');
    st.snake.unshift({x:nx,y:ny});
    if(st.food&&nx===st.food.x&&ny===st.food.y){
      st.score+=10*st.level;
      st.level=1+Math.floor(st.score/50);
      st.step=Math.max(330,DIFF[st.diff].step-(st.level-1)*3*DIFF[st.diff].speedUp);
      st.shake=7;st.flash=1;
      Audio2.init();
      Audio2.tone(560+st.level*40,.07,'square',.07,900+st.level*90,undefined,'game');
      Audio2.tone(1200+st.level*60,.05,'sine',.04,1600,.05,'game');
      burst(nx,ny);
      placeFood();
      if(st.score>GAMES.snake.best())LS.set('snakeBest',st.score);
      if(st.score>=50)Achievements.grant('HIGH_SCORE');
      syncHUD();
    }else st.snake.pop();
    st.trail.push({x:nx,y:ny,a:1});
    if(st.trail.length>14)st.trail.shift();
  }
  function burst(gx,gy){
    for(let i=0;i<18;i++)st.particles.push({
      x:st.ox+gx*st.cell+st.cell/2, y:st.oy+gy*st.cell+st.cell/2,
      vx:(Math.random()-.5)*4.4, vy:(Math.random()-.5)*4.4, a:1,
      c:Math.random()<.5?S.accent:S.accent3||'#ff4d9d'});
  }
  function die(cause){
    st.state='over';
    Audio2.init();
    Audio2.tone(300,.5,'sawtooth',.12,60,undefined,'game');
    Audio2.noise(.3,.1,undefined,'game');
    const best=GAMES.snake.best();
    const isBest=st.score>best;
    if(isBest)LS.set('snakeBest',st.score);
    if(st.score>=50)Achievements.grant('HIGH_SCORE');
    ov.classList.remove('hide');
    ov.innerHTML=`
      <h2>${isBest?'NEW RECORD':'RUN OVER'}</h2>
      <p style="font-size:15px;color:#fff">${st.score} points · length ${st.snake.length} · level ${st.level}</p>
      <p>${isBest?'That is a personal best. It has been written to your browser.':'You hit the '+cause+'. Best so far: '+GAMES.snake.best()+'.'}</p>
      <button class="btn pri" data-play style="padding:11px 32px">↻ RUN AGAIN <span style="opacity:.6;font-size:11px">(R)</span></button>
      <button class="btn" data-exit>Back to Arcade</button>`;
    ov.querySelector('[data-play]').onclick=start;
    ov.querySelector('[data-exit]').onclick=exit;
    Notify.send(isBest?'New high score!':'Snake run ended',
      `${st.score} points on ${DIFF[st.diff].name} · best ${GAMES.snake.best()}`,
      {icon:ICONS.games,app:'arcade'});
  }
  function start(){
    reset();st.state='play';ov.classList.add('hide');st.last=performance.now();
    Audio2.resume();
    w.el.focus&&w.el.focus();
  }
  function pause(){
    if(st.state!=='play')return;
    st.state='pause';
    ov.classList.remove('hide');
    ov.innerHTML=`<h2>PAUSED</h2><p>Score ${st.score} · length ${st.snake.length}</p>
      <button class="btn pri" data-play>▶ RESUME <span style="opacity:.6;font-size:11px">(Space)</span></button>
      <button class="btn" data-quit>End run</button>`;
    ov.querySelector('[data-play]').onclick=resume;
    ov.querySelector('[data-quit]').onclick=exit;
  }
  function resume(){st.state='play';ov.classList.add('hide');st.last=performance.now()}
  function exit(){
    w._gameCleanup&&w._gameCleanup();
    WM.get(w.id)&&WM.close(w.id);
    API.open('arcade',{single:false});
  }
  w.body.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{
    st.diff=b.dataset.d;LS.set('snakeDiff',st.diff);
    w.body.querySelector('[data-diff]').textContent=DIFF[st.diff].name;
    w.body.querySelectorAll('[data-d]').forEach(x=>x.classList.toggle('pri',x===b));
    Audio2.click();reset();
  });
  ov.querySelector('[data-play]').onclick=start;

  const onKey=e=>{
    const k=e.key;
    if(k==='ArrowUp'||k==='w'||k==='W'){turn(0,-1);e.preventDefault()}
    else if(k==='ArrowDown'||k==='s'||k==='S'){turn(0,1);e.preventDefault()}
    else if(k==='ArrowLeft'||k==='a'||k==='A'){turn(-1,0);e.preventDefault()}
    else if(k==='ArrowRight'||k==='d'||k==='D'){turn(1,0);e.preventDefault()}
    else if(k===' '){
      e.preventDefault();
      st.state==='play'?pause():st.state==='pause'?resume():start();
    }
    else if(k==='r'||k==='R')start();
    else if(k==='Escape')exit();
  };
  w.el.addEventListener('keydown',onKey);
  w.el.tabIndex=0;
  const onTouch=(x,y)=>{
    if(st.state!=='play')return;
    st.tdx=x;st.tdy=y;
  };
  let tdx=0,tdy=0;
  cv.addEventListener('pointerdown',e=>{
    const r=cv.getBoundingClientRect();
    tdx=(e.clientX-r.left)/r.width-.5; tdy=(e.clientY-r.top)/r.height-.5;
  });
  w.el.addEventListener('touchstart',e=>{
    const t=e.touches[0];
    st.touch={x:t.clientX,y:t.clientY};
  },{passive:true});
  w.el.addEventListener('touchmove',e=>{
    if(!st.touch)return;
    e.preventDefault();
    const t=e.touches[0],dx=t.clientX-st.touch.x,dy=t.clientY-st.touch.y;
    if(Math.abs(dx)>22||Math.abs(dy)>22){
      if(Math.abs(dx)>Math.abs(dy))turn(Math.sign(dx),0);else turn(0,Math.sign(dy));
      st.touch={x:t.clientX,y:t.clientY};
    }
  },{passive:false});

  function draw(ts){
    st.raf=requestAnimationFrame(draw);
    const W=cv.width,H=cv.height,C=st.cell;
    fitIfNeeded();
    const dt=Math.min(50,ts-st.last);
    if(st.state==='play'){
      st.acc+=dt*(S.animations?1:0.5);
      while(st.acc>=st.step){st.acc-=st.step;step();if(st.state!=='play')break}
    }
    if(st.tdx||st.tdy){
      if(Math.abs(st.tdx)>.18&&Math.abs(st.tdx)>Math.abs(st.tdy)){turn(Math.sign(st.tdx),0)}
      else if(Math.abs(st.tdy)>.18){turn(0,Math.sign(st.tdy))}
      st.tdx=0;st.tdy=0;
    }
    ctx.save();
    if(st.shake>0){
      st.shake*=.86;
      ctx.translate((Math.random()-.5)*st.shake,(Math.random()-.5)*st.shake);
    }
    ctx.fillStyle='#050810';ctx.fillRect(-20,-20,W+40,H+40);
    // grid
    ctx.strokeStyle='rgba(55,224,255,.07)';ctx.lineWidth=1;
    ctx.beginPath();
    for(let i=0;i<=N;i++){
      ctx.moveTo(st.ox+i*C,st.oy);ctx.lineTo(st.ox+i*C,st.oy+N*C);
      ctx.moveTo(st.ox,st.oy+i*C);ctx.lineTo(st.ox+N*C,st.oy+i*C);
    }
    ctx.stroke();
    ctx.strokeStyle=hexA(S.accent,.32);ctx.lineWidth=2;
    ctx.strokeRect(st.ox-1,st.oy-1,N*C+2,N*C+2);
    // trail
    st.trail.forEach((t,i)=>{
      ctx.globalAlpha=(i/st.trail.length)*.12;
      ctx.fillStyle=S.accent;
      ctx.fillRect(st.ox+t.x*C,st.oy+t.y*C,C,C);
    });
    ctx.globalAlpha=1;
    // snake
    st.snake.forEach((s,i)=>{
      const t=i/Math.max(1,st.snake.length-1);
      const pad=i===0?0:C*0.09;
      const hue=i===0?S.accent:(i<6?S.accent:hexA(S.accent,clamp(1-t*1.3,0.18,1)));
      ctx.fillStyle=i===0?S.accent:(i<7?hexA(S.accent,clamp(1-t*.9,.3,1)):hexA('#3ddc84',clamp(1-t*.6,.2,1)));
      ctx.shadowColor=S.accent;ctx.shadowBlur=i===0?18:8;
      const r=i===0?C*.28:C*.3;
      roundRect(ctx,st.ox+s.x*C+pad,st.oy+s.y*C+pad,C-pad*2,C-pad*2,r);
      ctx.fill();
      ctx.shadowBlur=0;
    });
    // head eyes
    const h=st.snake[0];
    if(h){
      ctx.fillStyle='#04121a';
      const ex=st.ox+h.x*C+C/2+st.dir.x*C*.16, ey=st.oy+h.y*C+C/2+st.dir.y*C*.16;
      const px=st.dir.y*C*.17, py=st.dir.x*C*.17;
      ctx.beginPath();ctx.arc(ex-px,ey-py,C*.09,0,7);ctx.fill();
      ctx.beginPath();ctx.arc(ex+px,ey+py,C*.09,0,7);ctx.fill();
    }
    // food
    if(st.food){
      const fx=st.ox+st.food.x*C+C/2, fy=st.oy+st.food.y*C+C/2;
      const pulse=1+Math.sin(ts/160)*.14;
      ctx.save();
      ctx.shadowColor='#ff4d9d';ctx.shadowBlur=22;
      ctx.fillStyle='#ff4d9d';
      ctx.beginPath();ctx.arc(fx,fy,C*.3*pulse,0,7);ctx.fill();
      ctx.shadowBlur=8;ctx.strokeStyle='rgba(255,77,157,.65)';ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(fx,fy,C*.48*pulse,0,7);ctx.stroke();
      ctx.restore();
    }
    // particles
    st.particles.forEach((p,i)=>{
      p.x+=p.vx;p.y+=p.vy;p.vy*=.94;p.vx*=.94;p.a-=.045;
      ctx.globalAlpha=Math.max(0,p.a);ctx.fillStyle=p.c;
      ctx.fillRect(p.x-2,p.y-2,4,4);
    });
    st.particles=st.particles.filter(p=>p.a>0);
    ctx.globalAlpha=1;
    if(st.flash>0){
      st.flash*=.9;
      ctx.fillStyle=hexA(S.accent,st.flash*.10);
      ctx.fillRect(0,0,W,H);
    }
    if(st.state==='pause'){ctx.fillStyle='rgba(5,8,16,.4)';ctx.fillRect(0,0,W,H)}
    ctx.restore();
  }
  let lastW=0,lastH=0;
  function fitIfNeeded(){
    const r=cv.getBoundingClientRect();
    if(Math.abs(r.width-lastW)<1&&Math.abs(r.height-lastH)<1)return;
    lastW=r.width;lastH=r.height;fit();
  }
  function roundRect(c,x,y,w,h,r){
    c.beginPath();
    c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);
    c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);
    c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);
    c.closePath();
  }
  fit();reset();
  w._game=st;
  st.raf=requestAnimationFrame(draw);
  w._gameCleanup=()=>{
    cancelAnimationFrame(st.raf);
    w.el.removeEventListener('keydown',onKey);
    w._gameCleanup=null;
  };
  setTimeout(()=>{w.el.focus()},60);
}

/* ==================================================================
   GAME-RACER
   src/kernel/24-game-racer.js
   ================================================================== */

function buildRacer(w){
  /* Circuit length is CFG.segments*SEG_LEN. It is deliberately short: at the
     speeds below a lap works out at roughly a minute, which is a race you can
     actually finish. The earlier 220-segment loop took 200s a lap. */
  const CFG={
    segments:120, maxSpeed:400, accel:300, brake:480,
    laps:3, ai:5
  };
  /* Geometry, in "camera units". CAM_BACK is how far behind the player the
     camera sits; it is deliberately larger than camH*camD, because with the
     player exactly one camera-height away the projection puts its baseline at
     the very bottom of the canvas and the car is drawn half off-screen. */
  const SEG_LEN=200;
  const camH=1000, camD=.84;
  const CAM_BACK=1300;
  const ROAD_HALF=620;   // road half-width
  const CAR_W=200;       // car width
  const DRAW_RANGE=70;   // segments in front of the camera
  const AI_COLORS=['#ff4d9d','#ffc857','#3ddc84','#b06bff','#ff6b35'];
  w.body.innerHTML=`<div class="gm">
    <canvas class="gmCanvas"></canvas>
    <div class="gmHud">
      <div class="s"><span>SPEED</span><b data-spd>0</b></div>
      <div class="s"><span>LAP</span><b data-lap>1/3</b></div>
      <div class="s"><span>TIME</span><b data-time>0:00.000</b></div>
      <div class="s"><span>POS</span><b data-pos>1/6</b></div>
      <div class="s"><span>SCORE</span><b data-score>0</b></div>
      <div class="s" style="margin-left:auto;text-align:right"><span>BEST LAP</span>
        <b data-best style="font-size:12px">${GAMES.racer.best()}</b></div>
    </div>
    <div class="gmKeys">
      ↑ / W accelerate &nbsp;·&nbsp; ↓ / S brake &nbsp;·&nbsp; ← → steer &nbsp;·&nbsp; SPACE handbrake &nbsp;·&nbsp; R restart
    </div>
    <div class="gmOverlay" data-ov>
      <h2>CYBER RACER</h2>
      <p>Three laps of the NEXUS night circuit against five AI rivals. Pass through all three
         checkpoints each lap. Collisions cost speed and time.</p>
      <button class="btn pri" data-go style="padding:12px 36px;font-size:14px">START RACE</button>
      <button class="btn" data-exit>Back to Arcade</button>
    </div>
  </div>`;
  const cv=w.body.querySelector('canvas'),ctx=cv.getContext('2d');
  const ov=w.body.querySelector('[data-ov]');
  const hud={spd:w.body.querySelector('[data-spd]'),lap:w.body.querySelector('[data-lap]'),
    time:w.body.querySelector('[data-time]'),pos:w.body.querySelector('[data-pos]'),
    score:w.body.querySelector('[data-score]')};

  // build track segments
  const segs=[];
  let curY=0,curCurve=0;
  for(let i=0;i<CFG.segments;i++){
    const progress=i/CFG.segments;
    let curve;
    if(progress<.14)curve=0;
    else if(progress<.30)curve=2.4;
    else if(progress<.44)curve=-2.0;
    else if(progress<.58)curve=0;
    else if(progress<.72)curve=3.2;
    else if(progress<.86)curve=-2.8;
    else curve=0;
    const y1=curY, y2=curY+SEG_LEN;
    segs.push({index:i,y1,y2,curve,p1:{world:{y:curY,camY:0}},p2:{world:{y:y2,camY:0}},
      cars:[],color:Math.floor(i/3)%2,check:i>0&&i%Math.floor(CFG.segments/12)===0});
    curY=y2;
  }
  const trackLen=curY;
  const st={
    pos:0,speed:0,steer:0,lap:1,time:0,score:0,state:'menu',countdown:3,
    keys:{},raf:0,shake:0,camH:1000,engine:null,best:LS.get('racerBest',null),
    offRoad:0,lapStart:0,cp:[false,false,false],finished:false
  };
  // player
  const player={x:0,offset:0,speed:0,steer:0,z:0,w:1.6,color:'#37e0ff',isPlayer:true};
  const ai=[];
  // starting grid: two wide, three rows deep, all ahead of the player
  const GRID=CFG.ai>4
    ? [[-.30,34],[.38,42],[-.36,86],[.42,94],[0,138]]
    : [[-.32,34],[.32,42],[-.32,88],[.32,96],[0,140]];
  for(let i=0;i<CFG.ai;i++)ai.push({x:GRID[i][0],offset:0,z:GRID[i][1],
    maxSpeed:230+Math.random()*90,skill:.72+Math.random()*.25,color:AI_COLORS[i],isPlayer:false,wait:0});
  let all=[player,...ai];
  function segAt(z){
    if(!isFinite(z))z=0;
    const i=clamp(Math.floor(z/SEG_LEN),0,segs.length-1);
    return segs[i]||segs[0];
  }
  /* The engine is a continuous oscillator, so it cannot go through Audio2.tone.
   It feeds Audio2's shared bus like every other source; going straight to
   the destination is what left the system volume slider with no effect. */
  function setupEngine(){
    if(st.engine)return;
    try{
      Audio2.init();
      const c=Audio2.ctx;
      const o=c.createOscillator(),g=c.createGain(),f=c.createBiquadFilter();
      o.type='sawtooth';o.frequency.value=60;
      f.type='lowpass';f.frequency.value=700;
      g.gain.value=0;
      o.connect(f);f.connect(g);g.connect(Audio2.bus);o.start();
      st.engine={ctx:c,osc:o,gain:g,filt:f};
    }catch(e){st.engine=null}
  }
  function engineSound(){
    if(!st.engine)return;
    const rpm=60+st.speed*1.5;
    st.engine.osc.frequency.setTargetAtTime(rpm,st.engine.ctx.currentTime,.08);
    st.engine.gain.gain.setTargetAtTime(st.state==='play'&&Audio2.on('game')?.035:0,st.engine.ctx.currentTime,.15);
    st.engine.filt.frequency.setTargetAtTime(300+st.speed*5,st.engine.ctx.currentTime,.1);
  }
  function reset(){
    st.pos=0;st.speed=0;st.lap=1;st.time=0;st.score=0;st.finished=false;
    st.cp=[false,false,false];st.lapStart=0;st.shake=0;
    player.x=0;player.z=0;player.speed=0;player.steer=0;
    /* Staggered two-wide grid ahead of the player. An evenly packed row piles
       every car on the same few pixels of road, which reads as a smear rather
       than a race start. */
    ai.forEach((c,i)=>{
      const col=(i%2)?1:-1, row=Math.floor(i/2);
      c.x=col*(.30+row*.06);
      c.z=34+row*52+(i%2?8:0);
      c.speed=0;c.wait=0;
    });
    all=[player,...ai];
  }
  function startCountdown(){
    st.state='count';
    st.countdown=3.6;
    ov.classList.add('hide');
    setupEngine();
    Audio2.resume();
  }
  function start(){reset();startCountdown()}
  function exit(){w._gameCleanup&&w._gameCleanup();WM.close(w.id);API.open('arcade',{single:false})}

  function update(dt){
    if(st.state==='count'){
      st.countdown-=dt;
      const n=Math.ceil(st.countdown);
      if(st.countdown<=0){st.state='play';st.lapStart=st.time;Audio2.tone(880,.25,'square',.09,undefined,undefined,'game')}
      return n;
    }
    if(st.state!=='play')return;
    st.time+=dt;
    const K=st.keys;
    // player input
    const acc=(K.ArrowUp||K.w)?1:0, brk=(K.ArrowDown||K.s)?1:0;
    const hb=K[' '];
    if(acc)st.speed+=CFG.accel*dt*(hb?.4:1);
    else if(brk)st.speed-=CFG.brake*dt;
    else st.speed-=60*dt;
    if(hb)st.speed-=240*dt;
    st.speed=clamp(st.speed,0,CFG.maxSpeed*(hb?.55:1));
    const turnRate=(1.9+st.speed/300)*dt*(hb?1.5:1);
    if(K.ArrowLeft||K.a){player.steer=clamp(player.steer-turnRate,-1,1)}
    else if(K.ArrowRight||K.d){player.steer=clamp(player.steer+turnRate,-1,1)}
    else player.steer*=Math.pow(.02,dt);
    player.speed=st.speed;
    // road curve pushes player
    const seg=segAt(player.z+st.speed*dt);
    const drift=seg.curve/20000*st.speed*dt*60;
    player.x+=player.steer*dt*3.2*(0.35+st.speed/300);
    player.x-=drift*.06;
    // centrifugal
    player.x-=seg.curve*.000020*st.speed*dt*100;
    const maxX=1.02;
    if(Math.abs(player.x)>maxX){
      // off-road: heavy drag and a shake, but never a dead stop — a car pinned
      // at 0 km/h with the throttle open is unrecoverable
      st.speed=Math.max(CFG.maxSpeed*.32,st.speed-460*dt);
      st.offRoad+=dt;
      if(st.offRoad>.4)st.shake=4;
    }else st.offRoad=0;
    player.x=clamp(player.x,-1.35,1.35);
    player.z+=st.speed*dt;
    // AI
    ai.forEach(c=>{
      const ahead=segAt(c.z+30);
      let target=c.maxSpeed*c.skill;
      // avoid player
      const dz=c.z-player.z;
      if(Math.abs(dz)<26&&Math.abs(c.x-player.x)<.16){target*=.72;c.x+=Math.sign(c.x-player.x||1)*dt*.5}
      c.speed+=(target-c.speed)*dt*1.6;
      c.z+=c.speed*dt;
      c.x-=ahead.curve*.000045*c.speed*dt*100;
      c.x=clamp(c.x,-1.2,1.2);
      c.x+=(Math.sin((st.time+c.z*.01)*1.4)*.02)*dt;
    });
    // collisions
    for(let i=0;i<all.length;i++)for(let j=i+1;j<all.length;j++){
      const a=all[i],b=all[j];
      if(Math.abs(a.z-b.z)<4.4&&Math.abs(a.x-b.x)<.19){
        const push=(a.isPlayer?-1:1);
        a.x+=push*.06;b.x-=push*.06;
        if(a.isPlayer||b.isPlayer){
          st.speed*=.62;st.shake=11;Audio2.crash();
          Audio2.tone(90,.25,'square',.09,50,undefined,'game');
        }
      }
    }
    // laps: track player.z wrap
    const segCount=segs.length*SEG_LEN;
    if(player.z>=segCount){
      player.z-=segCount;ai.forEach(c=>c.z-=segCount);
      st.lap++;
      if(st.lap>CFG.laps){finish();return}
      const lapTime=st.time-st.lapStart;
      st.lapStart=st.time;st.cp=[false,false,false];
      Achievements.grant('RACER');
      if(!st.best||lapTime<st.best){st.best=lapTime;LS.set('racerBest',lapTime);
        Notify.send('New best lap','Cyber Racer — '+formatLap(lapTime),{icon:ICONS.media,app:'arcade'})}
      w.body.querySelector('[data-best]').textContent=formatLap(st.best);
      st.score+=Math.max(60,Math.round(900-lapTime*10));
      Audio2.win();
    }
    // checkpoints
    const prog=(player.z%segCount)/segCount;
    const cpIdx=Math.floor(prog*3);
    if(cpIdx>=0&&cpIdx<3&&!st.cp[cpIdx]){
      st.cp[cpIdx]=true;
      Audio2.tone(700+cpIdx*180,.1,'sine',.07,undefined,undefined,'game');
    }
    engineSound();
    hud.spd.textContent=Math.round(st.speed*0.62);
    hud.lap.textContent=st.lap+'/'+CFG.laps;
    hud.time.textContent=fmtTime(st.time);
    hud.score.textContent=st.score;
    const rank=1+ai.filter(c=>c.z>player.z).length;
    hud.pos.textContent=rank+'/'+all.length;
  }
  function finish(){
    st.state='over';st.finished=true;
    st.score+=Math.round(st.time*20);
    const won=1+ai.filter(c=>c.z>player.z).length===1;
    if(won)st.score+=1500;
    Audio2.tone(300,.5,'sawtooth',.1,80,undefined,'game');
    ov.classList.remove('hide');
    ov.innerHTML=`
      <h2>${won?'RACE WON':'RACE COMPLETE'}</h2>
      <p style="font-size:15px;color:#fff">${formatLap(st.time)} total · best lap ${formatLap(st.best||st.time)}</p>
      <p>Score <b>${st.score}</b> · ${won?'You took the win.':'You finished behind the pack.'}
         Session best lap: ${GAMES.racer.best()}.</p>
      <button class="btn pri" data-go style="padding:11px 30px">↻ RACE AGAIN <span style="opacity:.6;font-size:11px">(R)</span></button>
      <button class="btn" data-exit>Back to Arcade</button>`;
    ov.querySelector('[data-go]').onclick=start;
    ov.querySelector('[data-exit]').onclick=exit;
    Notify.send(won?'Race won':'Race finished',`Score ${st.score} · best lap ${formatLap(st.best||st.time)}`,
      {icon:ICONS.media,app:'arcade'});
  }
  function fmtTime(s){
    const m=(s/60)|0,sec=(s%60);
    return m+':'+(sec<10?'0':'')+sec.toFixed(3);
  }
  ov.querySelector('[data-go]').onclick=start;
  ov.querySelector('[data-exit]').onclick=exit;

  const onKey=e=>{
    const k=e.key.length===1?e.key.toLowerCase():e.key;
    if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)){
      st.keys[e.key]=true;
      if(st.state==='play'||st.state==='count')e.preventDefault();
    }
    if(k==='r'||k==='R'){if(st.state!=='menu')start()}
    if(k==='Escape')exit();
    if(k==='Enter'&&st.state==='menu')start();
  };
  const onKeyUp=e=>{st.keys[e.key.length===1?e.key.toLowerCase():e.key]=false};
  w.el.addEventListener('keydown',onKey);
  window.addEventListener('keyup',onKeyUp);
  w.el.tabIndex=0;

  /* ---- perspective projection ------------------------------------------
     A point dz units in front of the camera has scale camD/dz, so it shrinks
     with distance and the road converges on the horizon. Road curvature is
     applied by accumulating each segment's `curve` into a lateral offset as we
     walk forward from the camera.

     This used a constant scale, which made every segment the same width, so the
     track rendered as a vertical band across the sky instead of a road. */
  function projX(dz){return camD/Math.max(40,dz)}
  function draw(ts){
    st.raf=requestAnimationFrame(draw);
    const d=Math.min(devicePixelRatio||1,2);
    const r=cv.getBoundingClientRect();
    if(cv.width!==Math.round(r.width*d)){cv.width=Math.round(r.width*d);cv.height=Math.round(r.height*d)}
    ctx.setTransform(d,0,0,d,0,0);
    const W=cv.width/d,H=cv.height/d;
    /* Clamped on both ends: a clock jump (tab restore, sleep) can hand us a
       negative delta, which would run the simulation backwards and poison
       every position with NaN. */
    const dt=clamp((ts-(st._t||ts))/1000,0,.05);st._t=ts;
    const cd=update(dt);
    if(st.state==='count')drawCountdown(cd,W,H);
    drawScene(W,H,player.z,player.x,ts);
    if(st.shake>0){st.shake*=.9}
  }
  /* W/H are CSS pixels: ctx already carries the devicePixelRatio transform, so
     using cv.width/cv.height here would draw the veil at 2x size on HiDPI and
     place the digits outside the canvas. */
  function drawCountdown(n,W,H){
    ctx.save();
    ctx.fillStyle='rgba(4,6,12,.55)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.font='700 110px '+getComputedStyle(document.body).fontFamily;
    if(n>0){
      ctx.fillStyle=S.accent;ctx.shadowColor=S.accent;ctx.shadowBlur=40;
      ctx.fillText(String(n),W/2,H/2);
    }else{
      ctx.fillStyle='#3ddc84';ctx.shadowColor='#3ddc84';ctx.shadowBlur=40;
      ctx.font='700 68px '+getComputedStyle(document.body).fontFamily;
      ctx.fillText('GO',W/2,H/2);
    }
    ctx.restore();
  }
  function drawScene(W,H,playerZ,playerX,ts){
    const HZ=H*.5;                 // the horizon is where the road converges
    ctx.fillStyle='#05040e';ctx.fillRect(0,0,W,H);
    // sky gradient + sun
    const sky=ctx.createLinearGradient(0,0,0,HZ);
    sky.addColorStop(0,'#0b0320');sky.addColorStop(.55,'#2a0b3d');sky.addColorStop(1,'#5b1046');
    ctx.fillStyle=sky;ctx.fillRect(0,0,W,HZ);
    ctx.save();
    ctx.beginPath();ctx.arc(W/2,HZ-Math.min(W,H)*.2,Math.min(W,H)*.19,0,7);ctx.clip();
    const sg=ctx.createLinearGradient(0,HZ-Math.min(W,H)*.42,0,HZ+Math.min(W,H)*.02);
    sg.addColorStop(0,'#ffd76b');sg.addColorStop(.5,'#ff5fa2');sg.addColorStop(1,'#8b2be2');
    ctx.fillStyle=sg;ctx.fillRect(0,0,W,H);
    ctx.fillStyle='rgba(8,3,20,.9)';
    for(let i=0;i<9;i++){const y=HZ-Math.min(W,H)*.36+i*Math.min(W,H)*.034;ctx.fillRect(0,y,W,2+i*.7)}
    ctx.restore();
    // stars
    ctx.fillStyle='rgba(255,255,255,.5)';
    for(let i=0;i<40;i++){
      const x=(i*97.3)%W, y=((i*53.7)%(HZ*.8));
      ctx.fillRect(x,y,1.4,1.4);
    }
    // ground
    const base=ctx.createLinearGradient(0,HZ,0,H);
    base.addColorStop(0,'#0a0618');base.addColorStop(1,'#150a24');
    ctx.fillStyle=base;ctx.fillRect(0,HZ,W,H-HZ);

    /* Walk the track forward from the camera, accumulating curvature, then
       paint far -> near so nearer segments overlap correctly.

       The walk starts at NEAR_DIST, not at the camera itself: a segment sitting
       exactly on the camera has zero depth, so its projected width is
       effectively infinite and it floods the whole screen with road. */
    const camZ=playerZ-CAM_BACK;
    const camLat=playerX*ROAD_HALF*.9;
    const NEAR_DIST=Math.max(60,CAM_BACK*.09);
    const baseI=clamp(Math.floor(camZ/SEG_LEN),0,segs.length-1);
    const basePct=(camZ-baseI*SEG_LEN)/SEG_LEN;
    let curveX=-(segs[baseI]?segs[baseI].curve*basePct:0);
    let dCurve=segs[baseI]?segs[baseI].curve:0;

    // near -> far
    const pts=[];
    for(let n=0;n<=DRAW_RANGE;n++){
      const i=baseI+n;
      const s=segs[((i%segs.length)+segs.length)%segs.length];
      const dzN=NEAR_DIST+n*SEG_LEN, dzF=dzN+SEG_LEN;
      curveX=curveX+dCurve;
      const scN=projX(dzN), scF=projX(dzF);
      pts.push({s,curveX,
        cxN:W/2+scN*(curveX-camLat)*W/2, cxF:W/2+scF*(curveX-camLat)*W/2,
        yN:H/2+scN*camH*H*.5,    yF:H/2+scF*camH*H*.5,
        hwN:scN*ROAD_HALF*W/2,   hwF:scF*ROAD_HALF*W/2});
      dCurve=s.curve;
    }
    // far -> near
    const segPts=pts.slice().reverse();

    // grass bands
    segPts.forEach(({s,yN,yF})=>{
      ctx.fillStyle=s.color?'#100a20':'#0d0819';
      ctx.fillRect(0,Math.min(yN,yF),W,Math.abs(yF-yN)+1.5);
    });
    // road surface
    segPts.forEach(({s,cxN,cxF,yN,yF,hwN,hwF})=>{
      if(hwN<.4)return;
      ctx.fillStyle='#1b1b28';
      ctx.beginPath();
      ctx.moveTo(cxN-hwN,yN);ctx.lineTo(cxN+hwN,yN);
      ctx.lineTo(cxF+hwF,yF);ctx.lineTo(cxF-hwF,yF);
      ctx.closePath();ctx.fill();
      // rumble
      const rc=s.color?'#ff2e63':'#37e0ff';
      ctx.fillStyle=rc;
      ctx.fillRect(cxN-hwN-3,yN,3,Math.abs(yF-yN)+1.5);
      ctx.fillRect(cxN+hwN,yN,3,Math.abs(yF-yN)+1.5);
      // lane markers
      if(!s.color){
        ctx.fillStyle='rgba(255,255,255,.28)';
        for(let l=-1;l<2;l++){
          const o=l*.33;
          ctx.fillRect(cxN-hwN*o-1,yN,2,Math.abs(yF-yN)+1.5);
        }
      }
      // checkpoints
      if(s.check){
        ctx.fillStyle='rgba(61,220,132,.22)';
        ctx.fillRect(cxN-hwN,yN,hwN*2,Math.abs(yF-yN)+1.5);
        ctx.fillStyle='#3ddc84';
        ctx.fillRect(cxN-hwN,yN,4,Math.abs(yF-yN)+1.5);
        ctx.fillRect(cxN+hwN-4,yN,4,Math.abs(yF-yN)+1.5);
      }
    });
    // side neon posts
    segPts.filter((_,i)=>i%6===0).forEach(({cxN,hwN,yN})=>{
      const hgt=Math.max(6,hwN*.5);
      ctx.fillStyle='rgba(176,107,255,.7)';
      ctx.fillRect(cxN-hwN-10,yN-hgt,3,hgt);
      ctx.fillRect(cxN+hwN+7,yN-hgt,3,hgt);
    });
    /* Cars: each one is projected against the same accumulated curve, sampled
       at its own distance. A car is only meaningful if it is ahead of the
       camera, so anything at or behind it is skipped. */
    const cars=all.map(c=>{
      const dz=c.z-camZ;
      if(dz<=0)return null;
      // lateral offset at that distance: re-walk the accumulated curve
      const i0=clamp(Math.floor((dz-NEAR_DIST)/SEG_LEN),0,pts.length-1);
      const p=pts[i0];
      if(!p)return null;
      const sc=projX(dz);
      const ox=c.x*ROAD_HALF;
      return {c,x:W/2+sc*(p.curveX+ox-camLat)*W/2,
              y:H/2+sc*camH*H*.5,cw:Math.max(3,sc*CAR_W*W/2)};
    }).filter(Boolean).sort((a,b)=>b.cw-a.cw);
    cars.forEach(({c,x,y,cw})=>{
      if(y>H+80||y<-40)return;
      const ch=cw*1.5;
      if(c.isPlayer)ctx.shadowColor=S.accent;
      else ctx.shadowColor=c.color;
      ctx.shadowBlur=c.isPlayer?22:12;
      ctx.fillStyle=c.color;
      ctx.beginPath();
      const bw=cw*.5,bh=ch*.34;
      ctx.moveTo(x-bw,y);ctx.lineTo(x+bw,y);
      ctx.lineTo(x+bw*.9,y-bh);ctx.lineTo(x-bw*.9,y-bh);ctx.closePath();ctx.fill();
      // cabin
      ctx.fillStyle='rgba(6,8,20,.92)';
      const tw=cw*.34,th=ch*.28;
      ctx.beginPath();
      ctx.moveTo(x-tw,y-bh*1.06);ctx.lineTo(x+tw,y-bh*1.06);
      ctx.lineTo(x+tw*.8,y-bh*1.06-th);ctx.lineTo(x-tw*.8,y-bh*1.06-th);
      ctx.closePath();ctx.fill();
      // tail lights
      ctx.fillStyle='#ff2e63';ctx.shadowBlur=6;
      ctx.fillRect(x-bw*.8,y-3,cw*.18,3);
      ctx.fillRect(x+bw*.62,y-3,cw*.18,3);
      ctx.shadowBlur=0;
      // wheels
      ctx.fillStyle='#0a0a12';
      ctx.fillRect(x-bw-2,y-bh*.5,3,ch*.12);
      ctx.fillRect(x+bw-1,y-bh*.5,3,ch*.12);
      // steering indicator under the nose
      if(c.isPlayer&&Math.abs(player.steer)>.3){
        ctx.fillStyle='rgba(255,46,99,.5)';
        ctx.fillRect(x-player.steer*cw*.3-bw*.4,y-ch*.2,cw*.8,3);
      }
    });
    // fog, anchored to the horizon so the far track dissolves into the sky
    const fog=ctx.createLinearGradient(0,HZ-H*.04,0,HZ+H*.18);
    fog.addColorStop(0,'rgba(8,3,24,.95)');fog.addColorStop(1,'rgba(8,3,24,0)');
    ctx.fillStyle=fog;ctx.fillRect(0,HZ-H*.04,W,H*.22);
    // speed lines
    if(st.speed>CFG.maxSpeed*.7){
      ctx.strokeStyle='rgba(55,224,255,'+(.06+(st.speed/CFG.maxSpeed-.7)*.2).toFixed(3)+')';
      ctx.lineWidth=2;
      for(let i=0;i<14;i++){
        const y=((ts*.02*(st.speed/60)+i*67)%(H+80))-40;
        const x=((i*137)%W);
        ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y+50);ctx.stroke();
      }
    }
    // damage vignette
    if(Math.abs(player.x)>1){
      const v=ctx.createLinearGradient(0,0,0,H);
      v.addColorStop(0,'rgba(255,46,99,'+(Math.abs(player.x)-1)*.5+')');
      v.addColorStop(.4,'rgba(255,46,99,0)');
      ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
    }
    // minimap — plot the real track shape, not a straight line
    const mw=Math.min(150,W*.22),mh=mw/3,mx=W-mw-14,my=H-mh-14;
    ctx.fillStyle='rgba(6,4,18,.7)';roundRectPath(ctx,mx,my,mw,mh,7);ctx.fill();
    ctx.strokeStyle='rgba(55,224,255,.3)';ctx.lineWidth=1;roundRectPath(ctx,mx,my,mw,mh,7);ctx.stroke();
    const segCount=segs.length*SEG_LEN;
    // lay the circuit out on the minimap by accumulating curve into lateral offset
    const mapPts=[];let mxAcc=0;
    segs.forEach((s,i)=>{
      if(i)mxAcc+=segs[i-1].curve*8;
      mapPts.push({x:mx+mxAcc,y:my+mh*(s.y1/segCount)});
    });
    let minX=Infinity,maxX=-Infinity;
    mapPts.forEach(p=>{if(p.x<minX)minX=p.x;if(p.x>maxX)maxX=p.x});
    const span=Math.max(1,maxX-minX),cxm=(minX+maxX)/2;
    mapPts.forEach(p=>{p.x=mx+mw*.1+(p.x-cxm)*mw*.8/span;p.y=my+mh*.08+(p.y-my-mh*.5)*mh*.84+mh*.42});
    ctx.strokeStyle='rgba(255,255,255,.28)';
    ctx.beginPath();
    mapPts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));
    ctx.closePath();ctx.stroke();
    const onMap=z=>{
      if(!isFinite(z))return mapPts[0];
      return mapPts[clamp(Math.floor(((z%segCount+segCount)%segCount)/SEG_LEN),0,mapPts.length-1)]||mapPts[0];
    };
    all.forEach(c=>{
      const p=onMap(c.z);
      ctx.fillStyle=c.color;
      ctx.beginPath();ctx.arc(p.x,p.y,c.isPlayer?3.4:2.4,0,7);ctx.fill();
    });
  }
  function roundRectPath(c,x,y,w,h,r){
    c.beginPath();
    c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);
    c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);
    c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath();
  }
  draw(performance.now());
  w._game=st;
  w._gameCleanup=()=>{
    cancelAnimationFrame(st.raf);
    w.el.removeEventListener('keydown',onKey);
    window.removeEventListener('keyup',onKeyUp);
    if(st.engine){try{st.engine.osc.stop();st.engine.ctx.close()}catch(e){}}
    st.engine=null;
    w._gameCleanup=null;
  };
  setTimeout(()=>w.el.focus(),60);
}

    }
    if(has('window')&&has('close all','minimize all','tile','cascade'))
      return ['Adjusting the window layout.',()=>{

   SYNTH
   src/kernel/28-synth.js
   ================================================================== */

/* ============================================================
   MUSIC SYNTHESIS — note scheduler
   ============================================================
   A song is data, not audio. Each part is a string of steps:

     '.'  rest          'C4'  trigger note C4          '='  hold previous

   Steps are 16th notes, so stepDur = 60 / bpm / 4. A scheduler wakes every
   TICK ms and queues any event falling inside the next LOOKAHEAD seconds
   straight onto the AudioContext clock, which is the only clock that is
   sample-accurate — setInterval drifts, and a drifting clock on a sequencer
   accumulates jitter you can hear by the second bar.

   Seeking is a binary search over the compiled event list, not a restart from
   zero, so jumping into the middle of a track is instant.

   Everything routes into Audio2's bus, so the system volume and the
   "Media sounds" toggle apply. When the category is muted the transport keeps
   running and no nodes are built at all; unmuting mid-track resumes sound
   from where the transport happens to be. */
const SYNTH_STEP={look:0.14,tick:25};

const Synth={
  track:null, events:[], cursor:0, playing:false,
  offset:0, startedAt:0, timer:0, live:new Set(), noiseBuf:null, onend:null,

  /* ---------- pattern compilation ---------- */
  noteHz(m){return 440*Math.pow(2,(m-69)/12)},
  parse(name){
    const m=/^([A-Ga-g])([#b]?)(-?\d)$/.exec(name);
    if(!m)return null;
    const base={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1].toUpperCase()];
    const acc=m[2]==='#'?1:m[2]==='b'?-1:0;
    return base+acc+(+m[3]+1)*12;
  },
  /* Classify a pattern string once, so the compiler and the authoring guard in
     tools/test-songs.js can never disagree about what a token means. A bar
     marker may sit tight against its neighbour (".|"), so strip it first
     rather than demanding whitespace either side. */
  tokenize(text){
    const out=[];
    for(const raw of String(text).split(/\s+/)){
      const tok=raw.trim().replace(/\|+$/,'');
      if(!tok)continue;
      if(tok==='='){out.push({k:'hold',m:0});continue}
      if(tok==='.'){out.push({k:'rest',m:0});continue}
      const m=this.parse(tok);
      if(m===null)out.push({k:'bad',m:0,t:tok});
      else out.push({k:'note',m});
    }
    return out;
  },
  /* parts: {lead:'...', bass:'...', drum:'...'} -> flat, time-sorted events
     spec.r repeats the pattern, so a track is written as a handful of bars
     that loop rather than eighty bars spelled out step by step. */
  compile(song){
    const step=60/song.bpm/4, out=[];
    for(const part in song.parts){
      const spec=song.parts[part];
      const inst=spec.i||part;
      const text=new Array((spec.r||1)+1).join(spec.s);
      let held=null, n=0;
      for(const t of this.tokenize(text)){
        if(t.k==='hold'){n++;continue}
        if(held){out.push({t:held.t,d:step*n-held.t,m:held.m,i:inst});held=null}
        if(t.k==='note')held={t:step*n,m:t.m};
        n++;
      }
      if(held)out.push({t:held.t,d:step*n-held.t,m:held.m,i:inst});
    }
    out.sort((a,b)=>a.t-b.t);
    return out;
  },
  span(events){
    let d=0;
    for(let i=0;i<events.length;i++){const e=events[i];if(e.t+e.d>d)d=e.t+e.d}
    return d;
  },
  durationOf(song){
    if(song._dur==null)try{song._dur=this.span(this.compile(song))}catch(e){song._dur=0}
    return song._dur||0;
  },
  duration(){return this.track?this.durationOf(this.track):0},

  /* ---------- transport ---------- */
  load(song){
    this.stop();
    this.track=song;
    this.events=this.compile(song);
    this.offset=0;
    this.cursor=0;
    return this;
  },
  time(){
    if(!this.track)return 0;
    if(!this.playing)return this.offset;
    return Math.min(this.duration(),this.offset+(Audio2.ctx.currentTime-this.startedAt));
  },
  seek(sec){
    if(!this.track)return;
    const t=Math.max(0,Math.min(this.duration(),sec));
    this.halt();
    this.offset=t;
    let lo=0,hi=this.events.length;
    while(lo<hi){const m=(lo+hi)>>1;if(this.events[m].t<t)lo=m+1;else hi=m}
    this.cursor=lo;
    if(this.playing){this.startedAt=Audio2.ctx.currentTime;this.tick()}
  },
  play(){
    if(!this.track||this.playing)return;
    if(this.offset>=this.duration()-0.05)this.offset=0;
    Audio2.init();Audio2.resume();
    this.playing=true;
    this.startedAt=Audio2.ctx.currentTime;
    this.tick();
    this.timer=setInterval(()=>this.tick(),SYNTH_STEP.tick);
  },
  pause(){
    if(!this.playing)return;
    this.offset=this.time();
    this.playing=false;
    clearInterval(this.timer);this.timer=0;
    this.halt();
  },
  toggle(){this.playing?this.pause():this.play()},
  stop(){
    this.playing=false;
    clearInterval(this.timer);this.timer=0;
    this.halt();
    this.offset=0;this.cursor=0;
  },
  /* Silence everything already queued, so a pause or seek does not leave a
     140 ms tail of notes still ringing from the lookahead window. */
  halt(){
    for(const o of this.live){try{o.stop()}catch(e){}try{o.disconnect()}catch(e){}}
    this.live.clear();
  },

  /* ---------- scheduling ---------- */
  tick(){
    if(!this.playing||!this.track)return;
    const ctx=Audio2.ctx;
    if(!ctx)return;
    const pos=this.time(), until=pos+SYNTH_STEP.look;
    while(this.cursor<this.events.length&&this.events[this.cursor].t<until){
      const e=this.events[this.cursor++];
      this.voice(e,ctx.currentTime-this.startedAt+e.t);
    }
    if(pos>=this.duration()-0.01){
      this.pause();
      this.offset=this.duration();
      const cb=this.onend;this.onend=null;
      if(cb)cb();
    }
  },
  /* One note, scheduled at absolute ctx time `at`. */
  voice(e,at){
    if(!Audio2.on('media'))return;
    const ctx=Audio2.ctx;
    if(!ctx)return;
    const inst=INSTRUMENTS[e.i];
    if(!inst)return;
    const when=Math.max(ctx.currentTime+0.005,at);
    const dur=Math.max(0.04,e.d);
    const out=this.out();
    if(!out)return;
    inst(e,this.noteHz(e.m),when,dur,out,this);
  },
  out(){return Audio2.bus},
  /* Track every source so halt() can silence it. */
  keep(node){
    this.live.add(node);
    node.onended=()=>{this.live.delete(node);try{node.disconnect()}catch(e){}};
    return node;
  },
  /* One second of white noise, generated once and reused by every drum hit
     with different playback rates. Allocating a buffer per hit would churn
     megabytes a second at tempo. */
  noise(){
    if(this.noiseBuf)return this.noiseBuf;
    try{
      const ctx=Audio2.ctx,n=ctx.sampleRate;
      const b=ctx.createBuffer(1,n,ctx.sampleRate);
      const d=b.getChannelData(0);
      for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
      this.noiseBuf=b;
    }catch(e){this.noiseBuf=null}
    return this.noiseBuf;
  },
  /* Percussive envelope: silence -> peak -> silence, with no sustain. */
  hit(when,dur,peak,out,hp){
    const ctx=Audio2.ctx;
    const g=ctx.createGain();
    g.gain.setValueAtTime(0.0001,when);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002,peak),when+0.004);
    g.gain.exponentialRampToValueAtTime(0.0001,when+dur);
    if(hp){
      const f=ctx.createBiquadFilter();
      f.type='highpass';f.frequency.value=hp;
      g.connect(f);f.connect(out);
    }else g.connect(out);
    return g;
  },
  noiseHit(when,dur,peak,out,hp,rate){
    const ctx=Audio2.ctx,buf=this.noise();
    if(!buf)return;
    const s=ctx.createBufferSource();
    s.buffer=buf;s.playbackRate.value=rate||1;
    s.connect(this.hit(when,dur,peak,out,hp));
    this.keep(s);
    s.start(when);s.stop(when+dur+0.02);
  }
};


/* ==================================================================
   SONGS
   src/kernel/29-songs.js
   ================================================================== */

/* ============================================================
   INSTRUMENTS AND TRACKS
   ============================================================
   Every instrument is a factory: (event, hz, when, dur, out, synth) -> void.
   It schedules its own nodes and hands any source back to synth.keep(), so a
   pause or a seek can silence it immediately instead of letting a lookahead
   tail ring out.

   Pattern language, one token per 16th note:

     '.'  rest          'C4'  note, triggers here          '='  hold previous
     '|'  ignored, purely so the source reads like sheet music

   A part may set r to repeat its pattern, which is what keeps a multi-minute
   track from having to be written out bar by bar. */

const INSTRUMENTS={
  /* Two detuned saws through a lowpass. The classic synthwave lead: slightly
     detuned voices beat against each other and the filter opens over the
     note, so a held note still moves. */
  lead(e,hz,when,dur,out,synth){
    const ctx=Audio2.ctx;
    const g=ctx.createGain();
    const f=ctx.createBiquadFilter();
    f.type='lowpass';
    f.frequency.setValueAtTime(Math.min(9000,hz*7),when);
    f.frequency.linearRampToValueAtTime(Math.min(11000,hz*2+900),when+Math.min(.28,dur));
    f.Q.value=6;
    const peak=.13;
    g.gain.setValueAtTime(0.0001,when);
    g.gain.exponentialRampToValueAtTime(peak,when+.012);
    g.gain.setTargetAtTime(peak*.62,when+.012,dur*.4);
    g.gain.exponentialRampToValueAtTime(0.0001,when+dur);
    f.connect(g);g.connect(out);
    for(const cents of [-7,7]){
      const o=ctx.createOscillator();
      o.type='sawtooth';o.frequency.value=hz;o.detune.value=cents;
      o.connect(f);
      synth.keep(o);
      o.start(when);o.stop(when+dur+.02);
    }
  },
  /* Single pulse wave, short and dry. */
  pulse(e,hz,when,dur,out,synth){
    const ctx=Audio2.ctx;
    const o=ctx.createOscillator();
    o.type='square';o.frequency.value=hz;
    o.connect(synth.hit(when,dur,.10,out,0));
    synth.keep(o);
    o.start(when);o.stop(when+dur+.02);
  },
  /* Bass sits below the lowpass and gets a touch of the oscillators above. */
  bass(e,hz,when,dur,out,synth){
    const ctx=Audio2.ctx;
    const f=ctx.createBiquadFilter();

/* ============================================================
   SUBTITLES
   ============================================================
   One parser serves both sources: .srt files the user opens, and the subtitle
   track baked into the generated demo reel. Two parsers would be two places
   for an off-by-one in the timestamp handling to hide.

   Accepted input is the ordinary SubRip shape:

       1
       00:00:01,000 --> 00:00:04,000
       First line
       second line

   Parsing is tolerant on purpose — a real .srt exported by a phone or a
   download often has a BOM, CRLF line endings, a missing blank line before
   the first cue, or "." instead of "," for milliseconds. */
const Subs={
  parse(text){
    const cues=[];
    const clean=String(text||'').replace(/^\uFEFF/,'').replace(/\r/g,'');
    const stamp=/(\d+):(\d{2}):(\d{2})[,.](\d{1,3})/;
    const blocks=clean.split(/\n{2,}/);
    for(const block of blocks){
      const lines=block.split('\n').filter(l=>l.trim()!=='');
      if(!lines.length)continue;
      let ti=0;
      /* the index line is optional, so find the line with the arrow */
      while(ti<lines.length&&!lines[ti].includes('-->'))ti++;
      if(ti>=lines.length)continue;
      const m=stamp.exec(lines[ti]);
      if(!m)continue;
      const start=+m[1]*3600+ +m[2]*60+ +m[3]+ +m[4].padEnd(3,'0')/1000;
      const endRaw=lines[ti].split('-->')[1]||'';
      const m2=stamp.exec(endRaw);
      const end=m2
        ? +m2[1]*3600+ +m2[2]*60+ +m2[3]+ +m2[4].padEnd(3,'0')/1000
        : start+2;
      const body=lines.slice(ti+1).join('\n').trim();
      if(!body)continue;
      if(!(end>start))continue;
      cues.push({start,end,text:body});
    }
    cues.sort((a,b)=>a.start-b.start);
    return cues;
  },
  /* The cue covering `t`, or null. Linear scan is fine: a track is tens of
     cues, and this runs a few times a second. */
  active(cues,t){
    if(!cues)return null;
    for(let i=0;i<cues.length;i++){
      if(t>=cues[i].start&&t<cues[i].end)return cues[i];
      if(cues[i].start>t)break;
    }
    return null;
  },
  /* Render into a host element, sized in `size` px. Returns the cue text so
     the caller can skip work when nothing changed. */
  paint(host,cues,t,size){
    const cue=this.active(cues,t);
    const text=cue?cue.text:'';
    if(host._last===text)return text;
    host._last=text;
    host.textContent=text;
    host.style.display=text?'':'none';
    if(text)host.style.fontSize=size+'px';
    return text;
  },
  /* Shift every cue, for a reel whose scenes are assembled at runtime. */
  offset(cues,delta){
    return cues.map(c=>({start:c.start+delta,end:c.end+delta,text:c.text}));
  },
  /* Build a cue list from (seconds, text) pairs, one per line. */
  fromPairs(pairs){
    const out=[];
    for(let i=0;i<pairs.length;i++){
      const start=pairs[i][0];
      const end=i+1<pairs.length?pairs[i+1][0]:start+3;
      out.push({start,end,text:String(pairs[i][1])});
    }
    return out;
  }
};

/* ============================================================
   VIDEO PLAYER
   ------------------------------------------------------------
   An APP module. Reel arrives through ctx.use('reel') because reel is
   already a package; Subs is still a kernel name, so it comes off
   ctx.core. That asymmetry is temporary - see task 5b.
   ============================================================ */

  const { Reel } = ctx.use('reel');
  const { Achievements, APPS, Audio2, ICONS, LS, Subs, VFS,
    clamp, el, fmtDur, toast } = ctx.core;

  APPS.video={
    title:'Video',icon:ICONS.vid,desc:'ReelPlayer',w:980,h:620,
    build(w,opts){
      w.body.innerHTML=`<div class="vd">
        <div class="vdStage" data-stage>
          <video data-el playsinline style="display:none"></video>
          <canvas data-canvas style="display:none"></canvas>
          <div class="vdSubs" data-subs style="display:none"></div>
          <div class="vdEmpty" data-empty>
            <div style="width:56px;height:56px;opacity:.5">${ICONS.vid}</div>
            <b>Nothing loaded</b>
            <span>Play the generated reel, or open a video file from your computer.</span>
            <div style="display:flex;gap:8px;margin-top:12px">
              <button class="btn pri" data-a="reel">${ICONS.play} Play demo reel</button>
              <button class="btn" data-a="openfile">${ICONS.open} Open file…</button>
            </div>
          </div>
          <div class="vdBadge" data-badge></div>
          <div class="vdBig" data-bigplay>${ICONS.play}</div>
        </div>
        <div class="vdBar">
          <button class="mbtn" data-a="prev" title="Previous">${ICONS.prev}</button>
          <button class="mbtn play" data-a="play" title="Play / pause (space)">${ICONS.play}</button>
          <button class="mbtn" data-a="next" title="Next">${ICONS.next}</button>
          <span class="vdTime" data-time>0:00 / 0:00</span>
          <div class="mdSeek vdSeek" data-seek><i style="width:0"></i><b style="left:0"></b><u data-chaps></u></div>
          <span class="vdRate" data-rateBtn title="Playback speed">1.0x</span>
          <button class="mbtn" data-a="cc" title="Subtitles (C)">CC</button>
          <button class="mbtn" data-a="pip" title="Picture in picture (P)">${ICONS.pip}</button>
          <button class="mbtn" data-a="full" title="Full screen (F)">${ICONS.full}</button>
          <button class="mbtn" data-a="mute" title="Mute (M)" style="width:34px;height:34px">${ICONS.vol}</button>
          <input type="range" min="0" max="100" value="80" data-vol style="width:72px;accent-color:var(--accent)" title="Volume">
        </div>
        <div class="toolbar" style="border-radius:11px">
          <button class="btn" data-a="reel">${ICONS.vid} Demo reel</button>
          <button class="btn" data-a="openfile">${ICONS.open} Open video…</button>
          <button class="btn" data-a="srt">Load subtitles…</button>
          <span class="sp"></span>
          <span data-meta style="font-size:11px;color:#8ea0bd;font-family:var(--mono)"></span>
        </div>
        <div class="vdRecent" data-recent></div>
      </div>`;
      const stage=w.body.querySelector('[data-stage]'),
        video=w.body.querySelector('[data-el]'),
        canvas=w.body.querySelector('[data-canvas]'),
        subsEl=w.body.querySelector('[data-subs]'),
        emptyEl=w.body.querySelector('[data-empty]'),
        badgeEl=w.body.querySelector('[data-badge]'),
        bigEl=w.body.querySelector('[data-bigplay]'),
        seek=w.body.querySelector('[data-seek]'),
        chapsEl=w.body.querySelector('[data-chaps]'),
        timeEl=w.body.querySelector('[data-time]'),
        rateEl=w.body.querySelector('[data-rateBtn]'),
        metaEl=w.body.querySelector('[data-meta]'),
        recentEl=w.body.querySelector('[data-recent]'),
        volInp=w.body.querySelector('[data-vol]'),
        playBtn=w.body.querySelector('[data-a="play"]');
      const vc=canvas.getContext('2d');
      const st={src:null,kind:null,raf:0,last:0,time:0,rate:1,playing:false,
        cues:null,ccOn:true,recentAuto:true,recent:LS.get('videoRecent',[])};
      const RATES=[0.25,0.5,0.75,1,1.25,1.5,2,4];

      /* ---------- source layer ---------- */
      const isReel=()=>st.kind==='reel';
      const now=()=>isReel()?st.time:(isFinite(video.currentTime)?video.currentTime:0);
      const duration=()=>isReel()?Reel.duration:(isFinite(video.duration)?video.duration:0);
      const setNow=t=>{
        if(isReel())st.time=clamp(t,0,Reel.duration);
        else if(isFinite(video.duration))video.currentTime=clamp(t,0,video.duration);
        step();
      };
      const setRate=r=>{
        st.rate=r;
        if(!isReel())video.playbackRate=r;
        /* toFixed then trim: (1).toFixed(2) is "1.00", and a fixed 2 decimals
           reads as a setting rather than a speed control. */
        rateEl.textContent=(Math.round(r*100)/100)+'x';
        rateEl.classList.toggle('on',r!==1);
        rateEl.dataset.rate=String(r);
      };

      /* ---------- rendering ---------- */
      function sizeCanvas(){
        const r=stage.getBoundingClientRect();
        const d=Math.min(devicePixelRatio||1,2);
        const w=Math.round(r.width*d),h=Math.round(r.height*d);
        if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}
        vc.setTransform(d,0,0,d,0,0);
        return r;
      }
      function frame(ts){
        if(!st.playing)return;
        st.raf=requestAnimationFrame(frame);
        /* clamp both ends: a huge dt after a tab is backgrounded would skip the
           reel forward by however long the user was away */
        const dt=clamp((ts-st.last)/1000,0,.05);

        if(isReel()){
          st.time+=dt*st.rate;
          if(st.time>=Reel.duration){st.time=Reel.duration;pause();onEnd();return}
          const r=sizeCanvas();
          Reel.render(vc,r.width,r.height,st.time,st.rate,Audio2.analyser());
          paintSubs();
          paintBadge();
          step();
        }
      }
      function onEnd(){
        if(isReel()){
          if(!watched){watched=true;Achievements.grant('DIRECTOR')}
          setNow(0);
          play();
          return;
        }
        if(st.recentAuto)loadRecent(0);
      }
      function paintSubs(){
        if(!st.ccOn||!st.cues){subsEl.style.display='none';subsEl.textContent='';return}
        const cue=Subs.active(st.cues,now());
        if(!cue){subsEl.style.display='none';subsEl.textContent='';return}
        subsEl.style.display='';
        /* keep the same element and only touch textContent when it changes,
           otherwise the browser re-lays out the caption every frame */
        if(subsEl.textContent!==cue.text)subsEl.textContent=cue.text;
      }
      function paintBadge(){
        if(!isReel()){badgeEl.textContent='';return}
        const i=Reel.chapterAt(st.time);
        const ch=Reel.chapters[i];
        const local=st.time-ch.t;
        badgeEl.textContent=`CHAPTER ${i+1}/5 · ${ch.name.toUpperCase()} · ${fmtDur(local)}`;
      }
      function step(){
        const d=duration(),t=now();
        seek.querySelector('i').style.width=(d?t/d*100:0)+'%';
        seek.querySelector('b').style.left=(d?t/d*100:0)+'%';
        timeEl.textContent=fmtDur(t)+' / '+fmtDur(d);
        if(!isReel())paintSubs();
      }

      /* ---------- transport ---------- */
      function loadReel(){
        unload();
        st.kind='reel';st.src={name:'NEXUS Visual Systems — Reference Reel',reel:true};
        st.cues=Reel.subtitles();
        st.time=0;st.rate=1;
        watched=false;
        video.style.display='none';
        canvas.style.display='';
        emptyEl.style.display='none';
        rateEl.textContent='1x';rateEl.classList.remove('on');rateEl.dataset.rate='1';
        metaEl.textContent='generated at run time · no video file';
        w.el.querySelector('.ttl').textContent='Reference Reel — Video';
        drawChapters();
        play();
      }
      function loadFile(name,url,objUrl,fromVfs){
        unload();
        st.kind='file';st.src={name,url,objUrl:!!objUrl,fromVfs:!!fromVfs};
        st.cues=null;st.rate=1;
        canvas.style.display='none';
        video.style.display='';
        emptyEl.style.display='none';
        video.src=url;
        video.volume=+volInp.value/100;
        video.playbackRate=1;
        rateEl.textContent='1x';rateEl.classList.remove('on');rateEl.dataset.rate='1';
        metaEl.textContent=fromVfs?'virtual filesystem':'local file';
        w.el.querySelector('.ttl').textContent=name+' — Video';
        drawChapters();
        if(fromVfs)autoSubtitles(url);
        video.play().catch(()=>{syncPlay();bigEl.style.display=''});
        remember(name);
      }
      function unload(){
        if(st.playing)pause();
        video.pause();
        video.removeAttribute('src');
        video.load();
        st.kind=null;st.src=null;st.cues=null;st.time=0;
      }
      function play(){
        if(!st.kind)return;
        Audio2.init();Audio2.resume();
        st.playing=true;
        if(isReel()){
          st.last=performance.now();
          cancelAnimationFrame(st.raf);
          st.raf=requestAnimationFrame(frame);
        }else{
          video.play().catch(()=>{st.playing=false;syncPlay()});
        }
        bigEl.style.display='none';
        syncPlay();
      }
      function pause(){
        st.playing=false;
        cancelAnimationFrame(st.raf);st.raf=0;
        if(!isReel())video.pause();
        syncPlay();
      }
      function syncPlay(){
        playBtn.innerHTML=st.playing?ICONS.pause:ICONS.play;
        bigEl.style.display=st.playing?'none':'';
      }
      function toggle(){st.playing?pause():play()}
      function drawChapters(){
        chapsEl.innerHTML='';
        if(!isReel())return;
        Reel.chapters.forEach(c=>{
          const u=el('u','',chapsEl);
          u.style.left=(c.t/Reel.duration*100)+'%';
          u.title=c.name;
          u.dataset.t=c.t;
        });
      }
      function remember(name){
        st.recent=[name,...st.recent.filter(n=>n!==name)].slice(0,6);
        LS.set('videoRecent',st.recent);
        renderRecent();
      }
      /* Reopen a recent file by looking its name back up in the filesystem. */
      function loadRecent(i){
        const n=st.recent[i];
        const hit=n&&VFS.search(n)[0];
        const node=hit&&hit.node;
        const url=node&&(node.dataUrl||node.blobUrl);
        if(url)loadFile(node.name,url,false,true);
      }
      let watched=false;
      function renderRecent(){
        if(!st.recent.length){recentEl.innerHTML='';return}
        recentEl.innerHTML='<span style="font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:#8ea0bd">Recent</span>';
        st.recent.forEach(n=>{
          const b=el('button','vdChip',recentEl);
          b.textContent=n;
          b.onclick=()=>{
            /* The chip holds a display name, not a path. Look it back up rather
               than trusting the label, and do not assume the file is still
               there — the filesystem can be reset underneath us. */
            const hit=VFS.search(n)[0];
            const node=hit&&hit.node;
            const url=node&&(node.dataUrl||node.blobUrl);
            if(url)loadFile(node.name,url,false,true);
            else toast('That file is no longer in the filesystem');
          };
        });
      }
      /* If a file with the same base name and a .srt extension exists, use it
         without asking — subtitles that "just work" are the expected default. */
      function autoSubtitles(url){
        if(!url||url.startsWith('blob:'))return;
        const base=url.replace(/\.[^./]+$/,'');
        const hit=VFS.search(base+'.srt')[0];
        const node=hit&&hit.node;
        if(node&&node.text!=null){
          st.cues=Subs.parse(node.text);
          if(st.cues.length)metaEl.textContent='virtual filesystem · subtitles loaded';
        }
      }

      /* ---------- input ---------- */
      w.body.addEventListener('click',e=>{
        const b=e.target.closest('[data-a]');
        if(b){
          const a=b.dataset.a;
          if(a==='play')toggle();
          else if(a==='next'||a==='prev'){/* single source; rewind instead of change */setNow(0)}
          else if(a==='reel')loadReel();
          else if(a==='cc'){
            st.ccOn=!st.ccOn;
            b.classList.toggle('on',st.ccOn);
            paintSubs();
            toast(st.ccOn?'Subtitles on':'Subtitles off');
          }
          else if(a==='full')toggleFullscreen();
          else if(a==='pip')togglePip();
          else if(a==='mute'){
            video.muted=!video.muted;
            w.body.querySelector('[data-a="mute"]').innerHTML=video.muted?ICONS.mute:ICONS.vol;
            Audio2.init();
          }
          else if(a==='openfile'){
            const inp=el('input');inp.type='file';inp.accept='video/*';inp.multiple=false;
            inp.onchange=()=>{
              const f=inp.files[0];
              if(f)loadFile(f.name,URL.createObjectURL(f),true,false);
            };
            inp.click();
          }
          else if(a==='srt')loadSrt();
          return;
        }
        if(e.target.closest('[data-rateBtn]')){
          const i=RATES.indexOf(st.rate);
          setRate(RATES[(i+1)%RATES.length]);
          return;
        }
        /* clicking the picture toggles playback, the way every player does */
        if(e.target===stage||e.target===video||e.target===canvas){
          if(st.kind)toggle();
          else bigEl.click();
        }
      });
      volInp.oninput=()=>{
        video.volume=+volInp.value/100;
        video.muted=+volInp.value===0;
        w.body.querySelector('[data-a="mute"]').innerHTML=video.muted?ICONS.mute:ICONS.vol;
      };
      function loadSrt(){
        const inp=el('input');inp.type='file';inp.accept='.srt,text/plain';
        inp.onchange=()=>{
          const f=inp.files[0];
          if(!f)return;
          const r=new FileReader();
          r.onload=()=>{
            st.cues=Subs.parse(r.result);
            st.ccOn=true;
            w.body.querySelector('[data-a="cc"]').classList.add('on');
            paintSubs();
            toast(st.cues.length?st.cues.length+' subtitle cues loaded':'No cues found in that file');
          };
          r.readAsText(f);
        };
        inp.click();
      }
      const seekTo=e=>{
        const r=seek.getBoundingClientRect();
        setNow(clamp((e.clientX-r.left)/r.width,0,1)*duration());
      };
      seek.onpointerdown=e=>{
        seek.setPointerCapture(e.pointerId);seekTo(e);seek._d=true;
      };
      seek.onpointermove=e=>{if(seek._d)seekTo(e)};
      seek.onpointerup=()=>{seek._d=false};
      /* clicking a chapter marker jumps straight to it */
      chapsEl.onclick=e=>{
        const u=e.target.closest('u');
        if(u)setNow(+u.dataset.t);
      };
      function toggleFullscreen(){
        if(document.fullscreenElement)document.exitFullscreen();
        else if(stage.requestFullscreen)stage.requestFullscreen().catch(()=>toast('Full screen was refused'));
        else toast('Full screen is not available here');
      }
      function togglePip(){
        if(isReel()){toast('Picture-in-picture needs a real video file');return}
        if(!video.requestPictureInPicture){toast('Picture-in-picture is not supported in this browser');return}
        if(document.pictureInPictureElement)document.exitPictureInPicture();
        else video.requestPictureInPicture().catch(()=>toast('Picture-in-picture was refused'));
      }
      /* chapter keys on a real file jump by 10% of its length */
      w.el.addEventListener('keydown',e=>{
        if(!st.kind)return;
        if(e.target&&/INPUT|TEXTAREA/.test(e.target.tagName))return;
        const k=e.key.toLowerCase();
        if(k===' '||e.code==='Space'){e.preventDefault();toggle()}
        else if(k==='f'){e.preventDefault();toggleFullscreen()}
        else if(k==='p'){e.preventDefault();togglePip()}
        else if(k==='c'){e.preventDefault();w.body.querySelector('[data-a="cc"]').click()}
        else if(k==='m'){e.preventDefault();w.body.querySelector('[data-a="mute"]').click()}
        else if(k==='r'){e.preventDefault();setNow(0);play()}
        else if(k==='arrowright'){e.preventDefault();setNow(now()+10)}
        else if(k==='arrowleft'){e.preventDefault();setNow(now()-10)}
        else if(k==='arrowup'){e.preventDefault();volInp.value=clamp(+volInp.value+5,0,100);volInp.oninput()}
        else if(k==='arrowdown'){e.preventDefault();volInp.value=clamp(+volInp.value-5,0,100);volInp.oninput()}
      });
      video.addEventListener('play',()=>{if(!isReel()){st.playing=true;syncPlay();bigEl.style.display='none'}});
      video.addEventListener('pause',()=>{if(!isReel()){st.playing=false;syncPlay()}});
      video.addEventListener('ended',()=>{st.playing=false;syncPlay();onEnd()});
      video.addEventListener('loadedmetadata',()=>{
        if(isReel())return;
        const d=isFinite(video.duration)?video.duration:0;
        metaEl.textContent=`${video.videoWidth}×${video.videoHeight} · ${fmtDur(d)}`;
        if(!st.playing)bigEl.style.display='';
        step();
      });
      video.addEventListener('timeupdate',step);

      renderRecent();
      setRate(1);
      syncPlay();
      if(opts.path){
        const n=VFS.node(opts.path);
        if(n&&(n.dataUrl||n.blobUrl))loadFile(n.name,n.dataUrl||n.blobUrl,false,true);
      }else if(opts.reel)loadReel();

      return {destroy:()=>{unload();cancelAnimationFrame(st.raf)}};
    }
  };
