/* ---------- FILES ---------- */
APPS.files={
  title:'Files',icon:ICONS.files,desc:'Browse the filesystem',w:900,h:580,
  build(w,opts){
    const st={path:opts.path||'/Desktop',view:LS.get('fmView','grid'),sel:new Set(),
      sort:'name',asc:true,clip:Clipboard,hist:[],hi:-1,query:'',copied:false};
    w.body.innerHTML=`
      <div class="toolbar">
        <button class="btn" data-a="back" title="Back">${ICONS.back}</button>
        <button class="btn" data-a="up" title="Up one level">${ICONS.fwd}</button>
        <div class="inp" style="flex:1;min-width:100px;display:flex;align-items:center;gap:8px" data-searchbox>
          <span style="width:12px;height:12px;display:inline-grid;opacity:.6">${ICONS.files}</span>
          <input placeholder="Search all files…" style="flex:1;background:none;border:none;min-width:0" data-search>
        </div>
        <div class="seg" data-sortseg>
          <button data-sort="name">Name</button><button data-sort="size">Size</button><button data-sort="mtime">Date</button>
        </div>
        <div class="seg"><button data-a="grid">${ICONS.grid}</button><button data-a="list">${ICONS.list}</button></div>
        <span class="sp"></span>
        <button class="btn" data-a="newdir" title="New folder">${ICONS.folder}</button>
        <button class="btn" data-a="newfile" title="New file">${ICONS.txt}</button>
        <button class="btn" data-a="copy" title="Copy">${ICONS.copy}</button>
        <button class="btn" data-a="cut" title="Cut">${ICONS.cut}</button>
        <button class="btn" data-a="paste" title="Paste">${ICONS.paste}</button>
        <button class="btn dgr" data-a="del" title="Delete">${ICONS.trash}</button>
      </div>
      <div class="fm">
        <div class="fmSide"></div>
        <div class="fmMain">
          <div class="crumbs"></div>
          <div class="flist"></div>
        </div>
      </div>
      <div class="fmStatus"><span data-info>—</span><span class="sp" style="flex:1"></span><span data-sel></span></div>`;
    const list=w.body.querySelector('.flist'),
      side=w.body.querySelector('.fmSide'),
      crumbs=w.body.querySelector('.crumbs'),
      info=w.body.querySelector('[data-info]'),
      selInfo=w.body.querySelector('[data-sel]');
    const PLUS=['Desktop','Documents','Downloads','Pictures','Music','Videos','Games','Home'];

    function go(p,push){
      const n=VFS.node(p);
      if(!n||n.type!=='dir')return toast('Folder not found','<span style="color:#ff5c72">!</span>');
      st.path=VFS.norm(p);st.sel.clear();st.query='';
      w.body.querySelector('[data-search]').value='';
      if(push){st.hist=st.hist.slice(0,st.hi+1);st.hist.push(st.path);st.hi=st.hist.length-1}
      render();
    }
    function renderSide(){
      side.innerHTML='<div class="lbl">Places</div>';
      PLUS.forEach(p=>{
        const node=VFS.node('/'+p);
        if(!node||node.type!=='dir')return;
        const b=el('button','sideIco'+(st.path.startsWith('/'+p)?' on':''),side);
        b.innerHTML=`<span class="ic">${ICONS.folder}</span><span>${p}</span>
          <span class="cnt">${(node.children||[]).length}</span>`;
        b.onclick=()=>go('/'+p);
      });
      el('div','lbl',side).textContent='System';
      [['/',ICONS.computer,'Root'],['/Desktop',ICONS.folder,'Desktop']].forEach(([p,i,nm])=>{
        const b=el('button','sideIco'+(st.path===p?' on':''),side);
        b.innerHTML=`<span class="ic">${i}</span><span>${nm}</span>`;
        b.onclick=()=>go(p);
      });
      const stt=VFS.stats();
      side.insertAdjacentHTML('beforeend',
        `<div class="lbl">Storage</div>
         <div style="padding:4px 9px;font-size:11px;color:#8ea0bd;line-height:1.8">
           <div>${stt.files} files</div><div>${stt.dirs} folders</div>
           <div>${fmtBytes(stt.bytes)} used</div></div>`);
    }
    function renderCrumbs(){
      crumbs.innerHTML='';
      const segs=st.path.split('/').filter(Boolean);
      const root=el('button','',crumbs);root.innerHTML='<span style="display:inline-grid;width:13px;height:13px">'+ICONS.computer+'</span>';
      root.onclick=()=>go('/');
      let acc='';
      segs.forEach(s=>{
        acc+='/'+s;
        const sp=el('span','sp',crumbs);sp.textContent='›';
        const b=el('button','',crumbs);b.textContent=s;
        const target=acc;b.onclick=()=>go(target);
        if(target===st.path)b.style.color='#fff';
      });
    }
    function nodeList(){
      if(st.query){
        return VFS.search(st.query).map(r=>({n:r.node,p:r.path})).filter(r=>S.showHidden||r.n.name[0]!=='.');
      }
      const d=VFS.node(st.path);if(!d)return [];
      let ch=[...(d.children||[])];
      ch=ch.filter(n=>S.showHidden||n.name[0]!=='.');
      ch.sort((a,b)=>{
        if((a.type==='dir')!==(b.type==='dir'))return a.type==='dir'?-1:1;
        let r=0;
        if(st.sort==='name')r=a.name.localeCompare(b.name,undefined,{numeric:true});
        else if(st.sort==='size')r=(a.size||0)-(b.size||0);
        else r=(a.mtime||0)-(b.mtime||0);
        return st.asc?r:-r;
      });
      return ch.map(n=>({n,p:st.path.replace(/\/$/,'')+'/'+n.name}));
    }
    function renderList(){
      list.className='flist'+(st.view==='grid'?' grid':'');
      list.innerHTML='';
      const items=nodeList();
      if(!items.length){
        list.innerHTML=`<div class="empty" style="grid-column:1/-1">
          <div>${ICONS.folder}</div><b>${st.query?'No matches':'This folder is empty'}</b>
          <span>${st.query?'Try a different search.':'Right-click here to create a folder or file, or use the toolbar above.'}</span></div>`;
        info.textContent=st.query?`${items.length} results`:'Empty folder';
        selInfo.textContent='';return;
      }
      const mark=new Set(Clipboard.items.map(i=>i.src));
      items.forEach(({n,p})=>{
        const f=el('div','fitem'+(st.sel.has(p)?' sel':'')+(mark.has(p)&&Clipboard.mode==='cut'?' cut':''),list);
        f.innerHTML=`<span class="ic">${iconForNode(n,n.type==='dir')}</span>
          <span class="nm" title="${esc(n.name)}">${esc(n.name)}</span>
          <span class="mt">${n.type==='dir'?(n.children||[]).length+' items':fmtBytes(n.size||0)}<br>
            <span style="opacity:.75">${fmtDateShort(n.mtime)}</span></span>`;
        f.draggable=true;
        f.onclick=e=>{
          if(e.ctrlKey){st.sel.has(p)?st.sel.delete(p):st.sel.add(p)}
          else{st.sel.clear();st.sel.add(p)}
          renderSel();
        };
        f.ondblclick=()=>{
          if(n.type==='dir')go(p);
          else if(EXT_ICON[extOf(n.name)]==='vid')API.open('video',{path:p});
          else if(EXT_ICON[extOf(n.name)]==='aud')API.open('music',{file:p});
          else if(EXT_ICON[extOf(n.name)]==='img')API.openFile(p);
          else API.open('editor',{path:p});
        };
        f.oncontextmenu=e=>{e.preventDefault();e.stopPropagation();
          if(!st.sel.has(p)){st.sel.clear();st.sel.add(p);renderSel()}
          itemMenu(e,n,p);
        };
        f.ondragstart=e=>{e.dataTransfer.setData('text/nexus',p);e.dataTransfer.effectAllowed='move'};
        f.ondragover=e=>{e.preventDefault();f.classList.add('dragover')};
        f.ondragleave=()=>f.classList.remove('dragover');
        f.ondrop=e=>{
          e.preventDefault();e.stopPropagation();f.classList.remove('dragover');
          const src=e.dataTransfer.getData('text/nexus');
          if(src&&src!==p&&n.type==='dir'){
            const r=VFS.move(src,p);
            r.err?toast(r.err,ICONS.warn):(toast('Moved to '+n.name),render());
          }
        };
        f.ondblclick2=null;
      });
      const d=VFS.node(st.path);
      info.textContent=st.query?`${items.length} result${items.length>1?'s':''}`:
        `${items.length} item${items.length>1?'s':''}${d?' · '+fmtBytes(d.size||0)+' in folder':''}`;
      renderSel();
    }
    function renderSel(){
      const paths=[...st.sel];
      $$('.fitem',list).forEach(f=>{
        const p=paths.find(x=>f.querySelector('.nm').title===x.split('/').pop());
        f.classList.toggle('sel',!!p);
      });
      const tot=paths.reduce((a,p)=>{const n=VFS.node(p);return a+(n?(n.type==='dir'?0:(n.size||0)):0)},0);
      selInfo.textContent=paths.length?`${paths.length} selected · ${fmtBytes(tot)}`:'';
    }
    function itemMenu(e,n,p){
      ctxMenu(e.clientX,e.clientY,[
        {label:'Open',icon:ICONS.open,act:()=>n.type==='dir'?go(p):fitemDbl(n,p)},
        {label:'Open in Editor',icon:ICONS.notes,dis:n.type==='dir',act:()=>API.open('editor',{path:p})},
        {label:'Open in Terminal',icon:ICONS.terminal,act:()=>API.open('terminal',{cwd:n.type==='dir'?p:VFS.norm(p.replace(/\/[^/]+$/,''))})},
        {sep:1},
        {label:'Copy',icon:ICONS.copy,key:'Ctrl+C',act:()=>{Clipboard.copy([...st.sel.size>1?st.sel:[p]]);toast('Copied')}},
        {label:'Cut',icon:ICONS.cut,key:'Ctrl+X',act:()=>{Clipboard.cut([...st.sel.size>1?st.sel:[p]]);toast('Cut')}},
        {label:'Rename…',icon:ICONS.pencil,key:'F2',act:async()=>{
          const v=await prompt2('Rename','New name:',n.name);
          if(v){const r=VFS.rename(p,v);r.err?toast(r.err,ICONS.warn):render()}
        }},
        {label:'Duplicate',icon:ICONS.copy,act:()=>{const r=VFS.copy(p,st.path);r.err?toast(r.err,ICONS.warn):render()}},
        {label:'Delete',icon:ICONS.trash,key:'Del',danger:1,act:async()=>delSel([...st.sel.size>1?st.sel:[p]])},
        {sep:1},
        {label:'Properties',icon:ICONS.info,key:'Alt+Enter',act:()=>showProps(p)}
      ],n.name);
    }
    function fitemDbl(n,p){
      if(n.type==='dir')go(p);
      else if(EXT_ICON[extOf(n.name)]==='vid')API.open('video',{path:p});
          else if(EXT_ICON[extOf(n.name)]==='aud')API.open('music',{file:p});
      else API.open('editor',{path:p});
    }
    async function delSel(paths){
      if(!paths.length)return;
      const names=paths.map(p=>p.split('/').pop());
      if(await confirmBox('Delete '+names.length+' item'+(names.length>1?'s':'')+'?',
        names.slice(0,6).join(', ')+(names.length>6?'…':'')+'\nThis cannot be undone.',true)){
        let n=0;
        paths.forEach(p=>{const r=VFS.rm(p,null,true);if(!r.err){n++;Bus.emit('fs')}});
        st.sel.clear();render();
        toast(`${n} item${n>1?'s':''} deleted`);
        Audio2.tone(300,.15,'sawtooth',.07,120);
      }
    }
    list.oncontextmenu=e=>{
      if(e.target.closest('.fitem'))return;
      e.preventDefault();
      ctxMenu(e.clientX,e.clientY,[
        {label:'New Folder',icon:ICONS.folder,act:async()=>{const v=await prompt2('New Folder','Name:','New Folder');if(v){VFS.mkdir(st.path+'/'+v);render()}}},
        {label:'New Text File',icon:ICONS.txt,act:async()=>{const v=await prompt2('New File','Name:','Untitled.txt');if(v){VFS.write(st.path+'/'+v,'');render();Achvements.grant('FIRST_FILE')}}},
        {sep:1},
        {label:'Paste',icon:ICONS.paste,key:'Ctrl+V',dis:!Clipboard.items.length,act:()=>{Clipboard.pasteInto(st.path);render()}},
        {label:'Select All',icon:ICONS.ok,key:'Ctrl+A',act:()=>{nodeList().forEach(({p})=>st.sel.add(p));renderSel()}},
        {sep:1},
        {label:'Open Terminal Here',icon:ICONS.terminal,act:()=>API.open('terminal',{cwd:st.path})},
        {label:'Refresh',icon:ICONS.reload,key:'F5',act:()=>render()},
        {label:'Sort by Name',icon:ICONS.list,act:()=>{st.sort='name';st.asc=!st.asc;render()}}
      ],'Files');
    };
    list.ondragover=e=>{if(e.target===list)e.preventDefault()};
    list.ondrop=e=>{
      if(e.target!==list)return;e.preventDefault();
      const src=e.dataTransfer.getData('text/nexus');
      if(src&&VFS.node(src).type==='dir'){
        const r=VFS.move(src,st.path);r.err?toast(r.err,ICONS.warn):(toast('Moved'),render());
      }else if(src){const r=VFS.copy(src,st.path);r.err?toast(r.err,ICONS.warn):(toast('Copied'),render())}
    };
    w.body.addEventListener('click',e=>{
      const b=e.target.closest('[data-a]');if(!b)return;
      const a=b.dataset.a;
      if(a==='back'){if(st.hi>0){st.hi--;go(st.hist[st.hi],false)}else toast('No more history')}
      else if(a==='up'){const p=VFS.parent(st.path);if(p)go(p.path)}
      else if(a==='grid'||a==='list'){st.view=a;LS.set('fmView',a);render()}
      else if(a==='newdir'){ (async()=>{const v=await prompt2('New Folder','Name:','New Folder');if(v){VFS.mkdir(st.path+'/'+v);render()}})() }
      else if(a==='newfile'){ (async()=>{const v=await prompt2('New File','Name:','Untitled.txt');if(v){VFS.write(st.path+'/'+v,'');render();Achvements.grant('FIRST_FILE')}})() }
      else if(a==='copy'){if(st.sel.size){Clipboard.copy([...st.sel]);toast(st.sel.size+' copied');renderList()}}
      else if(a==='cut'){if(st.sel.size){Clipboard.cut([...st.sel]);toast(st.sel.size+' cut');renderList()}}
      else if(a==='paste'){if(Clipboard.items.length){Clipboard.pasteInto(st.path);render()}else toast('Clipboard is empty')}
      else if(a==='del')delSel([...st.sel]);
    });
    w.body.querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>{
      if(b.dataset.sort==='sort')return;
      if(st.sort===b.dataset.sort)st.asc=!st.asc;else{st.sort=b.dataset.sort;st.asc=true}
      render();
    });
    const sInp=w.body.querySelector('[data-search]');
    sInp.addEventListener('input',()=>{st.query=sInp.value.trim();renderList();
      info.textContent=st.query?VFS.search(st.query).length+' results':info.textContent});
    w.el.addEventListener('keydown',e=>{
      if(e.target.tagName==='INPUT')return;
      if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='a'){e.preventDefault();nodeList().forEach(({p})=>st.sel.add(p));renderSel()}
      else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='c'){Clipboard.copy([...st.sel])}
      else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='x'){Clipboard.cut([...st.sel])}
      else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='v'){Clipboard.pasteInto(st.path);render()}
      else if(e.key==='Delete')delSel([...st.sel]);
      else if(e.key==='F2'&&st.sel.size===1){const p=[...st.sel][0];
        prompt2('Rename','New name:',p.split('/').pop()).then(v=>{if(v){VFS.rename(p,v);render()}})}
      else if(e.key==='F5'){e.preventDefault();render()}
      else if(e.key==='Enter'&&st.sel.size){const p=[...st.sel][0];const n=VFS.node(p);
        if(n)n.type==='dir'?go(p):fitemDbl(n,p)}
      else if(e.key==='Backspace'){const p=VFS.parent(st.path);if(p)go(p.path)}
    });
    w.el.tabIndex=0;
    function render(){
      if(!VFS.node(st.path))st.path='/Desktop';
      renderSide();renderCrumbs();renderList();
      $$('[data-sort]',w.body).forEach(b=>{
        b.classList.toggle('on',b.dataset.sort===st.sort);
        if(b.dataset.sort===st.sort)b.textContent=b.dataset.sort==='name'?(st.asc?'Name ↑':'Name ↓'):b.dataset.sort==='size'?(st.asc?'Size ↑':'Size ↓'):(st.asc?'Date ↑':'Date ↓');
      });
      $$('[data-a]',w.body).forEach(b=>b.classList.toggle('on',(b.dataset.a===st.view)));
      w.el.querySelector('.ttl').textContent=st.path==='/'?'Files — Root':'Files — '+st.path.split('/').pop();
    }
    render();
    st.onResize=()=>{};
    const un=Bus.on('fs',()=>{if(WM.get(w.id))render()});
    return {destroy:()=>un()};
  }
};

APPS.terminal={
  title:'Terminal',icon:ICONS.terminal,desc:'NexusShell',w:800,h:500,
  build(w,opts){
    w.body.innerHTML=`<div class="termWrap">
      <div class="termOut" tabindex="0"></div>
      <div class="termIn"><span class="ps"></span><input spellcheck="false" autocomplete="off"><span class="cur"></span></div>
    </div>`;
    const wrap=w.body.querySelector('.termWrap'),
      out=w.body.querySelector('.termOut'),
      inp=w.body.querySelector('input'),
      ps=w.body.querySelector('.ps');
    const st={cwd:opts.cwd||'/Desktop',hist:LS.get('hist',[]),hi:-1,busy:false};
    let echoCursor=null;

    function promptStr(){return `<span style="color:#3ddc84">user@nexus</span>:<span style="color:#37e0ff">${st.cwd}</span>$`}
    function setPs(){ps.textContent=promptStr()}
    function print(html,cls){
      const d=el('div','termLine'+(cls?' '+cls:''),out);
      d.innerHTML=html;out.scrollTop=out.scrollHeight;
      return d;
    }
    function echoCmd(c){
      const d=el('div','termLine',out);
      d.innerHTML=`<span style="color:#3ddc84">user@nexus</span>:<span style="color:#37e0ff">${esc(st.cwd)}</span>$ <span class="t-wht">${esc(c)}</span><span class="cur" style="animation:none"></span>`;
      out.scrollTop=out.scrollHeight;
      return d.querySelector('.cur');
    }
    const argColors={help:'t-cyan',clear:'t-dim',pwd:'t-cyan',ls:'t-cyan',cd:'t-cyan',mkdir:'t-cyan',touch:'t-cyan',
      cat:'t-cyan',echo:'t-cyan',rm:'t-cyan',cp:'t-cyan',mv:'t-cyan',tree:'t-cyan',find:'t-cyan',date:'t-cyan',
      whoami:'t-cyan',history:'t-cyan',neofetch:'t-mag',calc:'t-cyan',open:'t-cyan',sysinfo:'t-cyan',
      matrix:'t-green',nw:'t-green',reboot:'t-red',secrets:'t-yel',theme:'t-mag',rmrf:'t-red',
      cowsay:'t-yel',banner:'t-mag',joke:'t-yel',fortune:'t-mag',matrix2:'t-green'};
    const CMDS={
      help:{
        d:'show this help',run(){
          const groups=[
            ['Filesystem','pwd ls cd mkdir touch cat rm cp mv tree find'],
            ['Content','echo open'],
            ['System','date whoami history sysinfo neofetch clear calc'],
            ['Fun','matrix banner cowsay joke fortune secrets nw'],
            ['Session','theme reboot']
          ];
          let h='\x1b[36mNEXUS Shell 1.0.0 — command reference\x1b[0m\n';
          groups.forEach(([g,cs])=>{
            h+=`\n\x1b[1m\x1b[36m  ${g}\x1b[0m\n`;
            cs.split(' ').forEach(c=>{
              h+=`    \x1b[32m${c.padEnd(10)}\x1b[0m\x1b[90m${(CMDS[c]&&CMDS[c].d)||'—'}\x1b[0m\n`;
            });
          });
          h+='\n\x1b[90m  Tab completes · ↑/↓ history · Ctrl+L clears · try "secrets" for a reason\x1b[0m';
          print(h);
        }},
      clear:{d:'clear the screen',run(){out.innerHTML=''}},
      pwd:{d:'print working directory',run(){print('\x1b[37m'+st.cwd+'\x1b[0m')}},
      ls:{d:'list directory (-a shows hidden)',run(a,red){
        const showAll=a.some(x=>/^-[a-zA-Z]*a/.test(x));
        const rest=a.filter(x=>!x.startsWith('-'));
        const p=rest[0]?VFS.norm(rest[0],st.cwd):st.cwd;
        const n=VFS.node(p);
        if(!n)return red('<x>ls: '+(rest[0]||'')+': not found</x>');
        if(n.type==='file')return red(lsLine(n));
        const ch=[...(n.children||[])].filter(x=>showAll||S.showHidden||x.name[0]!=='.')
          .sort((x,y)=>(x.type===y.type)?x.name.localeCompare(y.name):(x.type==='dir'?-1:1));

          const n=VFS.node(f,st.cwd);
          if(!n)return red(`<x>cat: ${esc(f)}: no such file</x>`);

      echo:{d:'print text (supports > file)',run(a,red,raw){
        const m=raw.match(/^echo\s+(.*?)\s*>\s*(\S+)\s*$/);
        if(m){
          const txt=m[1].replace(/^["']|["']$/g,'');
          const r=VFS.write(m[2],txt,st.cwd);
          r.err?red(`<x>echo: ${r.err}</x>`):(Bus.emit('fs'),print('\x1b[90m→ wrote '+fmtBytes((txt.length)*2)+' to '+esc(m[2])+'\x1b[0m'));
          return;
        }
        const m2=raw.match(/^echo\s+(.*?)\s*>>\s*(\S+)\s*$/);
        if(m2){
          const n=VFS.node(m2[2],st.cwd);
          const txt=(n&&n.type==='file'?n.content:'')+m2[1].replace(/^["']|["']$/g,'');
          VFS.write(m2[2],txt,st.cwd);Bus.emit('fs');
          return;

      calc:{d:'evaluate expression',run(a,red,raw){

    function startMatrix(){
      if(wrap._mx)return;
      wrap._mx=true;wrap.classList.add('matrix');
      const cv=el('canvas','',wrap);cv.id='matrixCanvas';
      const c=cv.getContext('2d');
      const d=Math.min(devicePixelRatio||1,2);
      const fit=()=>{cv.width=wrap.clientWidth*d;cv.height=wrap.clientHeight*d;c.setTransform(d,0,0,d,0,0)};
      fit();
      const fs=15,cols=Math.ceil(cv.width/(fs*d)),drops=new Array(cols).fill(0).map(()=>Math.random()*-40);
      c.font=(fs*d)+'px monospace';
      let raf,t0=performance.now();
      const glyphs='ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ0123456789';
      const loop=()=>{
        raf=requestAnimationFrame(loop);
        const el2=(performance.now()-t0)/1000;
        if(el2>14){stopMatrix();print('\x1b[90mThe matrix continues without you.\x1b[0m');return}
        c.fillStyle='rgba(0,0,0,.07)';c.fillRect(0,0,cv.width,cv.height);
        for(let i=0;i<cols;i++){
          const ch=glyphs[(Math.random()*glyphs.length)|0];
          c.fillStyle=Math.random()>.97?'#dfffe8':'#25ff7a';
          c.fillText(ch,i*fs*d,drops[i]*fs*d);
          c.fillStyle='rgba(37,255,122,.4)';
          c.fillText(glyphs[(Math.random()*glyphs.length)|0],i*fs*d,(drops[i]-1)*fs*d);
          drops[i]+=.55+Math.random()*.7;
          if(drops[i]*fs*d>cv.height&&Math.random()>.975)drops[i]=-Math.random()*20;
        }
      };
      const stopMatrix=()=>{cancelAnimationFrame(raf);cv.remove();wrap.classList.remove('matrix');wrap._mx=false};
      w.api.matrixStop=stopMatrix;
      loop();
    }
    function lsLine(n){
      if(n.type==='dir')return `\x1b[1m\x1b[36m${n.name}/\x1b[0m`;
      const e=EXT_ICON[extOf(n.name)];
      const col=e==='code'?'\x1b[32m':e==='img'?'\x1b[35m':e==='aud'?'\x1b[33m':e==='vid'?'\x1b[34m':'\x1b[37m';
      return `${col}${n.name}\x1b[0m \x1b[90m${fmtBytes(n.size||0)}\x1b[0m`;
    }
    function run(raw){
      echoCursor&&echoCursor.remove();echoCursor=null;
      const line=raw.trim();
      if(!line){setPs();return}
      st.hist=st.hist.filter(h=>h!==line);
      st.hist.push(line);
      if(st.hist.length>200)st.hist.shift();
      LS.set('hist',st.hist.slice(-80));
      st.hi=st.hist.length;
      const parts=line.match(/(?:[^\s"']+|"[^"]*"|'[^']*')+/g)||[];
      const cmd=parts[0].toLowerCase();
      const a=parts.slice(1).map(s=>s.replace(/^["']|["']$/g,''));
      if(!CMDS[cmd]){
        print(`\x1b[31mnexus-sh: command not found: ${esc(cmd)}\x1b[0m\n\x1b[90mType "help" for the command list.\x1b[0m`);
        Audio2.tone(200,.1,'square',.05);
        setPs();return;
      }
      const lastLine=out.lastElementChild;
      let done=false;
      const red=(txt)=>{if(!done){done=true;print(txt)}};
      try{CMDS[cmd].run(a,red,line)}catch(e){red('<x>'+esc(e.message)+'</x>')}
      if(!done)print('');
      setPs();
      Achievements.bump('term');
      if(Achievements.counts.term>=25)Achievements.grant('TERMINAL_MASTER');
    }
    inp.addEventListener('keydown',e=>{
      Audio2.resume();
      if(e.key==='Enter'){const v=inp.value;inp.value='';run(v);return}
      if(e.key==='ArrowUp'){e.preventDefault();if(st.hi>0){st.hi--;inp.value=st.hist[st.hi]||''}return}
      if(e.key==='ArrowDown'){e.preventDefault();if(st.hi<st.hist.length-1){st.hi++;inp.value=st.hist[st.hi]||''}else{st.hi=st.hist.length;inp.value=''}return}
      if(e.key==='Tab'){
        e.preventDefault();
        const v=inp.value;const parts=v.split(' ');const last=parts[parts.length-1];
        const cmd=parts.length===1?last:parts[0];
        if(parts.length===1){
          const m=Object.keys(CMDS).filter(c=>c.startsWith(last.toLowerCase()));
          if(m.length===1)inp.value=m[0]+' ';
          else if(m.length>1)print('\x1b[90m'+m.join('  ')+'\x1b[0m');
        }else{
          const d=VFS.node(parts[0]==='cd'||parts[0]==='open'?st.cwd:st.cwd);
          const base=VFS.node(st.cwd);
          const pool=base?(base.children||[]).map(c=>c.name+(c.type==='dir'?'/':'')):[];
          const m=pool.filter(n=>n.toLowerCase().startsWith(last.toLowerCase()));
          if(m.length===1)inp.value=parts.slice(0,-1).join(' ')+' '+m[0];
          else if(m.length>1)print('\x1b[90m'+m.join('  ')+'\x1b[0m');
        }
        return;
      }
      if(e.ctrlKey&&e.key.toLowerCase()==='l'){e.preventDefault();out.innerHTML='';return}
      if(e.ctrlKey&&e.key.toLowerCase()==='c'){print('<x>^C</x>');inp.value='';echoCursor&&(echoCursor.style.display='none');return}
      if(e.ctrlKey&&e.key.toLowerCase()==='u'){e.preventDefault();inp.value='';return}
    });
    inp.addEventListener('input',()=>{if(!echoCursor)return;echoCursor.remove();echoCursor=null;
      echoCursor=echoCmd(inp.value)});
    out.addEventListener('click',()=>inp.focus());
    setPs();
    print(`\x1b[36mNEXUS Shell 1.0.0\x1b[0m  \x1b[90m(nexus-kernel 4.2.1)\x1b[0m
\x1b[90mType "help" for commands, "secrets" for a reason.\x1b[0m`);
    setTimeout(()=>inp.focus(),120);
    const un=Bus.on('fs',()=>{});
    return {destroy(){un();if(w.api.matrixStop)w.api.matrixStop()},onResize(){}};
  }
};

const HL={
  lang(name){
    const e=extOf(name);
    return {js:'js',ts:'js',json:'json',html:'html',htm:'html',css:'css',md:'md',py:'py',sh:'sh'}[e]||'txt';
  },
  run(text,lang){
    if(lang==='txt'||!text)return esc(text);
    let s=esc(text);
    if(lang==='js'||lang==='ts'){
      s=s.replace(/(\/\*[\s\S]*?\*\/|\/\/[^\n]*)/g,'<i class="tk-com">$1</i>')
        .replace(/(`(?:\\.|[^`\\])*`|'[^'\n]*'|"[^"\n]*")/g,'<i class="tk-str">$1</i>')
        .replace(/\b(function|return|const|let|var|if|else|for|while|class|new|await|async|this|typeof|of|in|break|continue|switch|case|default|try|catch|finally|throw|import|export|from|null|undefined|true|false)\b/g,'<i class="tk-key">$1</i>')
        .replace(/\b(\d+\.?\d*)\b/g,'<i class="tk-num">$1</i>')
        .replace(/\b([A-Za-z_$][\w$]*)\s*\(/g,'<i class="tk-fn">$1</i>(');
    }else if(lang==='json'){
      s=s.replace(/("(?:\\.|[^"\\])*")(\s*:)/g,'<i class="tk-attr">$1</i>$2')
        .replace(/:\s*("(?:\\.|[^"\\])*")/g,': <i class="tk-str">$1</i>')
        .replace(/\b(-?\d+\.?\d*)\b/g,'<i class="tk-num">$1</i>')
        .replace(/\b(true|false|null)\b/g,'<i class="tk-key">$1</i>');
    }else if(lang==='html'){
      s=s.replace(/(&lt;!--[\s\S]*?--&gt;)/g,'<i class="tk-com">$1</i>')
        .replace(/(&lt;\/?)([\w-]+)/g,'$1<i class="tk-tag">$2</i>')
        .replace(/([\w-]+)(=)(&quot;[^&]*?&quot;)/g,'<i class="tk-attr">$1</i>$2<i class="tk-str">$3</i>')
        .replace(/(&lt;\/?)([\w-]+)/g,'$1<i class="tk-tag">$2</i>');
    }else if(lang==='css'){
      s=s.replace(/(\/\*[\s\S]*?\*\/)/g,'<i class="tk-com">$1</i>')
        .replace(/([\w-]+)(\s*:\s*)([^;{}\n]+)/g,'<i class="tk-attr">$1</i>$2<i class="tk-str">$3</i>')
        .replace(/(^|\n)([^{}\n]+)(\{)/g,'$1<i class="tk-tag">$2</i>$3')
        .replace(/([.#@][\w-]+)/g,'<i class="tk-fn">$1</i>');
    }else if(lang==='py'){
      s=s.replace(/(#[^\n]*)/g,'<i class="tk-com">$1</i>')
        .replace(/(`(?:\\.|[^`\\])*`|'[^'\n]*'|"[^"\n]*")/g,'<i class="tk-str">$1</i>')
        .replace(/\b(def|class|return|if|elif|else|for|while|import|from|as|with|try|except|finally|raise|lambda|None|True|False|and|or|not|in|is|pass|break|continue|global)\b/g,'<i class="tk-key">$1</i>')
        .replace(/\b(\d+\.?\d*)\b/g,'<i class="tk-num">$1</i>')
        .replace(/\b([A-Za-z_][\w]*)\s*\(/g,'<i class="tk-fn">$1</i>(');
    }else if(lang==='sh'){
      s=s.replace(/(#[^\n]*)/g,'<i class="tk-com">$1</i>')
        .replace(/('[^']*'|"[^"]*")/g,'<i class="tk-str">$1</i>')
        .replace(/\b(if|then|else|fi|for|in|do|done|while|case|esac|function|return|export|local|echo|cd|ls|rm|cp|mv|mkdir|cat|touch)\b/g,'<i class="tk-key">$1</i>');
    }else if(lang==='md'){
      s=s.replace(/^(#{1,6} .*)$/gm,'<i class="tk-tag">$1</i>')
        .replace(/(`[^`\n]*`)/g,'<i class="tk-str">$1</i>')
        .replace(/^(\s*[-*+] )/gm,'<i class="tk-num">$1</i>')
        .replace(/\*\*([^*]+)\*\*/g,'<i class="tk-key">$1</i>');
    }
    return s;
  }
};
APPS.editor={
  title:'Notes',icon:ICONS.notes,desc:'Text & code editor',w:900,h:620,
  build(w,opts){
    w.body.innerHTML=`
      <div class="edTabs"></div>
      <div class="toolbar">
        <button class="btn" data-a="new">${ICONS.plus} New</button>
        <button class="btn" data-a="open">${ICONS.open} Open</button>
        <button class="btn pri" data-a="save">${ICONS.save} Save</button>
        <button class="btn" data-a="saveas">Save As</button>
        <span class="sp"></span>
        <span class="edAutostave" style="font-size:11px;color:#8ea0bd"></span>
        <button class="btn" data-a="run" title="Run in terminal">${ICONS.terminal} Run</button>
      </div>
      <div class="ed">
        <div class="edGutter"></div>
        <div class="edArea"><pre class="edPre"></pre><textarea class="edTa" spellcheck="false"></textarea></div>
      </div>
      <div class="edStatus">
        <span data-pos>Ln 1, Col 1</span><span data-count>0 words · 0 chars</span>
        <span data-lang>Text</span><span class="sp" style="flex:1"></span>
        <span data-save></span>
      </div>`;
    const tabsEl=w.body.querySelector('.edTabs'),
      gut=w.body.querySelector('.edGutter'),
      pre=w.body.querySelector('.edPre'),
      ta=w.body.querySelector('.edTa'),
      posEl=w.body.querySelector('[data-pos]'),
      cntEl=w.body.querySelector('[data-count]'),
      langEl=w.body.querySelector('[data-lang]'),
      saveEl=w.body.querySelector('[data-save]'),
      autostave=w.body.querySelector('.edAutostave');
    const st={tabs:[],cur:null,auto:null,dirtyTimer:null};

    function newTab(path,content){
      const t={id:'t'+Date.now()+Math.random().toString(36).slice(2,5),
        path:path||null,name:path?path.split('/').pop():'Untitled-'+(st.tabs.length+1),
        content:content!=null?content:'',saved:content||'',dirty:false};
      st.tabs.push(t);st.cur=t.id;render();sync();
      return t;
    }
    function cur(){return st.tabs.find(t=>t.id===st.cur)}
    function openPath(p){
      const n=VFS.node(p);
      if(!n||n.type==='dir'){toast('Cannot open folder','<span style="color:#ff5c72">!</span>');return}
      const ex=st.tabs.find(t=>t.path===VFS.norm(p));
      if(ex){st.cur=ex.id;render();sync();return}
      newTab(VFS.norm(p),n.content||'');
    }
    function closeTab(id){
      const i=st.tabs.findIndex(t=>t.id===id);if(i<0)return;
      const t=st.tabs[i];
      const doClose=()=>{
        st.tabs.splice(i,1);
        if(st.cur===id)st.cur=st.tabs[Math.min(i,st.tabs.length-1)]?.id||null;
        if(!st.tabs.length)newTab();
        else{render();sync()}
      };
      if(t.dirty){
        dialog({title:'Unsaved changes',text:'"'+t.name+'" has unsaved changes.',
          icon:ICONS.warn,buttons:[
            {label:'Cancel',value:0},{label:'Discard',value:'d',danger:1},{label:'Save',value:'s',pri:1}]})
          .then(v=>{if(v==='d')doClose();else if(v==='s'){save(t);doClose()}});
      }else doClose();
    }
    function save(t,saveAs){
      t=t||cur();if(!t)return;
      const write=path=>{
        const r=VFS.write(path,t.content);
        if(r.err){toast(r.err,ICONS.warn);return false}
        t.path=r.path;t.name=r.path.split('/').pop();
        t.saved=t.content;t.dirty=false;
        render();sync();
        Notify.send('File saved',t.path,{app:'editor',icon:ICONS.save});
        return true;
      };
      if(!t.path||saveAs){
        prompt2('Save As','Save to path (e.g. /Documents/notes.txt):',t.path||'/Documents/'+t.name)
          .then(v=>{if(v)write(v)});
        return;
      }
      if(write(t.path)){Audio2.click();toast('Saved '+t.name)}
    }
    function highlight(){
      const t=cur();if(!t)return;
      const lang=HL.lang(t.name);
      pre.innerHTML=HL.run(t.content,lang)+'\n';
      const lines=t.content.split('\n').length;
      if(gut._n!==lines){
        gut.innerHTML='';
        for(let i=1;i<=lines;i++)el('div','',gut).textContent=i;
        gut._n=lines;
      }
      langEl.textContent={js:'JavaScript',ts:'TypeScript',json:'JSON',html:'HTML',css:'CSS',md:'Markdown',py:'Python',sh:'Shell',txt:'Plain Text'}[lang];
    }
    function sync(){
      const t=cur();if(!t)return;
      if(ta.value!==t.content)ta.value=t.content;
      highlight();
      const lines=t.content.split('\n');
      const upto=t.content.slice(0,ta.selectionStart);
      const ln=upto.split('\n');
      posEl.textContent=`Ln ${ln.length}, Col ${ln[ln.length-1].length+1}`;
      const words=t.content.trim()?(t.content.trim().match(/\S+/g)||[]).length:0;
      cntEl.textContent=`${words} words · ${t.content.length} chars · ${lines.length} lines`;
      saveEl.textContent=t.dirty?'● Unsaved':(t.path?'✓ Saved':'— Unsaved file');
      saveEl.className=t.dirty?'wr':'ok';
      w.el.querySelector('.ttl').textContent=(t.dirty?'● ':'')+t.name+' — Notes';
      clearTimeout(st.auto);
      if(t.dirty){
        st.auto=setTimeout(()=>{
          if(!t.path)return;
          VFS.write(t.path,t.content);
          t.saved=t.content;
          saveEl.textContent='✓ Autosaved';saveEl.className='ok';
          autostave.textContent='autosaved '+fmtHMS(new Date());
          Bus.emit('fs');
        },2500);
      }else autostave.textContent='';
    }
    function render(){
      tabsEl.innerHTML='';
      st.tabs.forEach(t=>{
        const b=el('div','edTab'+(t.id===st.cur?' on':''),tabsEl);
        b.innerHTML=`${t.dirty?'<span class="dot"></span>':''}<span>${esc(t.name)}</span><span class="x" data-x>×</span>`;
        b.onclick=e=>{if(e.target.dataset.x)return;st.cur=t.id;render();sync()};
        b.oncontextmenu=e=>{e.preventDefault();
          ctxMenu(e.clientX,e.clientY,[
            {label:'Close',icon:ICONS.x,act:()=>closeTab(t.id)},
            {label:'Close Others',icon:ICONS.x,act:()=>{[...st.tabs].filter(x=>x.id!==t.id).forEach(x=>closeTab(x.id))}},
            {sep:1},
            {label:'Save',icon:ICONS.save,act:()=>save(t)},
            {label:'Copy Path',icon:ICONS.copy,act:()=>{navigator.clipboard&&navigator.clipboard.writeText(t.path||'/');toast('Path copied')}}
          ],t.name);
        };
        b.querySelector('[data-x]').onclick=e=>{e.stopPropagation();closeTab(t.id)};
      });
    }
    ta.addEventListener('input',()=>{const t=cur();if(!t)return;t.content=ta.value;t.dirty=t.content!==t.saved;sync()});
    ta.addEventListener('scroll',()=>{pre.scrollTop=ta.scrollTop;pre.scrollLeft=ta.scrollLeft;gut.scrollTop=ta.scrollTop});
    ta.addEventListener('keyup',sync);ta.addEventListener('click',sync);
    ta.addEventListener('keydown',e=>{
      if(e.key==='Tab'){
        e.preventDefault();
        const s=ta.selectionStart,en=ta.selectionEnd;
        ta.value=ta.value.slice(0,s)+'  '+ta.value.slice(en);
        ta.selectionStart=ta.selectionEnd=s+2;
        cur().content=ta.value;cur().dirty=true;sync();
      }
      if((e.ctrlKey||e.metaKey)){
        const k=e.key.toLowerCase();
        if(k==='s'){e.preventDefault();save(cur(),e.shiftKey)}
        else if(k==='o'){e.preventDefault();pickFile()}
        else if(k==='n'){e.preventDefault();newTab();ta.focus()}
        else if(k==='w'){e.preventDefault();closeTab(st.cur)}
      }
    });
    async function pickFile(){
      const p=await filePicker();
      if(p)openPath(p);
    }
    w.body.addEventListener('click',e=>{
      const b=e.target.closest('[data-a]');if(!b)return;
      const a=b.dataset.a;
      if(a==='new'){newTab();ta.focus()}
      else if(a==='open')pickFile();
      else if(a==='save'){save(cur(),e.shiftKey);ta.focus()}
      else if(a==='saveas')save(cur(),true);
      else if(a==='run'){
        const t=cur();if(!t)return;
        if(!t.path){toast('Save the file first');return}
        const ext=extOf(t.name);
        if(ext==='js'){API.open('terminal',{cmd:'node '+t.path,autoClose:false})}
        else if(ext==='sh'){API.open('terminal',{cmd:'bash '+t.path,autoClose:false})}
        else if(ext==='py'){API.open('terminal',{cmd:'python3 '+t.path,autoClose:false})}
        else if(ext==='md'){API.open('browser',{url:'nexus://md?f='+encodeURIComponent(t.path)})}
        else toast('Nothing to run for .'+ext+' files');
      }
    });
    const un=Bus.on('fs',()=>{
      st.tabs.forEach(t=>{if(t.path&&!t.dirty){const n=VFS.node(t.path);if(n&&n.type==='file')t.content=n.content}});
      if(!st.tabs.length)newTab();else sync();
    });
    // initial
    if(opts.path){const n=VFS.node(opts.path);
      if(n&&n.type==='file')newTab(VFS.norm(opts.path),n.content);
      else newTab();
    }else newTab();
    setTimeout(()=>ta.focus(),100);
    return {destroy:()=>{un();clearTimeout(st.auto)},onResize(){}};
  }
};
/* file picker dialog */
function filePicker(startDir){
  return new Promise(res=>{
    let dir=startDir||'/';
    const body=el('div','');
    body.style.cssText='max-height:340px;overflow:auto';
    const render=()=>{
      body.innerHTML='';
      const crumbs=el('div','',body);
      crumbs.style.cssText='display:flex;flex-wrap:wrap;gap:3px;margin-bottom:9px';
      const segs=dir.split('/').filter(Boolean);
      const rb=el('button','btn',crumbs);rb.textContent='/';rb.onclick=()=>{dir='/';render()};
      let acc='';
      segs.forEach(s=>{acc+='/'+s;
        const sp=el('span','',crumbs);sp.textContent='›';sp.style.cssText='opacity:.5;align-self:center';
        const b=el('button','btn',crumbs);b.textContent=s;b.onclick=()=>{dir=acc;render()}});
      const list=el('div','',body);
      list.style.cssText='max-height:250px;overflow:auto;display:flex;flex-direction:column;gap:2px';
      const d=VFS.node(dir);
      if(d&&d.type==='dir'){
        if(dir!=='/'){
          const up=el('button','appRow',list);
          up.innerHTML='<span class="ic">'+ICONS.back+'</span><b>.. (up)</b>';
          up.onclick=()=>{dir=dir.replace(/\/[^/]+$/,'')||'/';render()};
        }
        (d.children||[]).filter(n=>S.showHidden||n.name[0]!=='.').sort((a,b)=>
          (a.type===b.type)?a.name.localeCompare(b.name):(a.type==='dir'?-1:1)).forEach(n=>{
          const b=el('button','appRow',list);
          b.innerHTML=`<span class="ic">${iconForNode(n,n.type==='dir')}</span><b>${esc(n.name)}</b><i>${n.type==='dir'?(n.children||[]).length+' items':fmtBytes(n.size||0)}</i>`;
          b.onclick=()=>{
            if(n.type==='dir'){dir=(dir==='/'?'':dir)+'/'+n.name;render()}
            else{closeDialog();res(dir.replace(/\/$/,'')+'/'+n.name)}
          };
        });
      }
      if(!(d&&d.children&&d.children.length))list.innerHTML='<div style="padding:16px;color:#8ea0bd;font-size:12px">This folder is empty.</div>';
    };
    render();
    dialog({title:'Open File',text:'Choose a file to open.',icon:ICONS.open,body,
      buttons:[{label:'Cancel',value:null},{label:'New File',value:'new'},{label:'Open',value:1,pri:1}]})
      .then(async v=>{
        if(v===1)res(selPath);
        else if(v==='new'){
          const nm=await prompt2('New File','File name (with extension):','Untitled.txt');
          if(nm){const r=VFS.write((dir==='/'?'':dir)+'/'+nm,'');if(!r.err)res(r.path);else toast(r.err)}
        }
      });
    let selPath=dir;
  });
}

    const KEYS=[
      ['AC','fn'],['±','fn'],['%','fn'],['÷','op'],

    ];
    KEYS.forEach(([k,c])=>{
      const b=el('button','ckey '+c,pad);b.textContent=k;b.dataset.k=k;
      b.onclick=()=>press(k);
    });
    const fmt=n=>{
      if(!isFinite(n))return 'Error';
      if(Math.abs(n)>=1e16||(Math.abs(n)<1e-9&&n!==0))return n.toExponential(6);
      const s=parseFloat(n.toPrecision(12)).toString();
      if(s.length>14)return parseFloat(n.toPrecision(10)).toString();
      return s;
    };
    function compute(a,op,b){
      switch(op){
        case '+':return a+b; case '−':return a-b; case '×':return a*b; case '÷':return b===0?NaN:a/b;
      }
      return b;
    }
    function pushHist(expr,res){
      st.hist.unshift({e:expr,r:fmt(res)});
      if(st.hist.length>40)st.hist.pop();
      LS.set('calcHist',st.hist);
      renderHist();
    }
    function renderHist(){
      histEl.innerHTML='';
      if(!st.hist.length){histEl.innerHTML='<div style="padding:8px;font-size:11px;color:#5b6a86">No calculations yet</div>';return}
      st.hist.slice(0,20).forEach(h=>{
        const d=el('div','',histEl);
        d.innerHTML=`<span>${esc(h.e)}</span><b>${esc(h.r)}</b>`;
        d.onclick=()=>{st.cur=h.r;st.fresh=true;update()};
        d.oncontextmenu=e=>{e.preventDefault();st.hist=st.hist.filter(x=>x!==h);LS.set('calcHist',st.hist);renderHist()};
      });
    }
    function update(){
      disp.textContent=fmt(parseFloat(st.cur));
      expr.textContent=st.expr||'&nbsp;';
    }
    function press(k){
      Audio2.init();
      const isDigit=/^[0-9]$/.test(k);
      if(k==='AC'){st.cur='0';st.prev=null;st.op=null;st.fresh=true;st.expr='';Audio2.key()}
      else if(k==='±'){st.cur=String(-parseFloat(st.cur));Audio2.key()}
      else if(k==='%'){
        const v=parseFloat(st.cur);
        st.cur=String(st.prev!==null&&st.op? v*st.prev/100 : v/100);
        st.fresh=true;Audio2.key();
      }
      else if(k==='√'){
        const v=parseFloat(st.cur);
        if(v<0){disp.textContent='Error';st.cur='0';st.fresh=true;Audio2.error();return}
        st.cur=String(Math.sqrt(v));st.fresh=true;Audio2.tone(1200,.07,'sine',.06);update();return;
      }
      else if(k==='.'){
        if(st.fresh){st.cur='0.';st.fresh=false}
        else if(!st.cur.includes('.'))st.cur+='.';
        Audio2.key();
      }
      else if(isDigit){
        if(st.fresh){st.cur=k;st.fresh=false}
        else if(st.cur.replace(/[-.]/g,'').length<16)st.cur=st.cur==='0'?k:st.cur+k;
        Audio2.key();
      }
      else if('+−×÷'.includes(k)){
        const v=parseFloat(st.cur);
        if(st.op!==null&&!st.fresh&&st.prev!==null){
          const r=compute(st.prev,st.op,v);
          st.prev=r;st.cur=String(r);
          pushHist(st.prev==null?'':fmt(st.prev)+' '+st.op+' '+fmt(v),r);
        }else st.prev=v;
        st.op=k;st.fresh=true;
        st.expr=fmt(st.prev)+' '+k;
        Audio2.tone(700,.05,'sine',.05);
      }
      else if(k==='='){
        if(st.op!==null&&st.prev!==null){
          const v=parseFloat(st.cur);
          const e=fmt(st.prev)+' '+st.op+' '+fmt(v);
          const r=compute(st.prev,st.op,v);
          if(!isFinite(r)){
            disp.textContent=st.op==='÷'&&v===0?'Cannot divide by zero':'Error';
            st.cur='0';st.prev=null;st.op=null;st.expr='';st.fresh=true;
            Audio2.error();update();return;
          }
          pushHist(e,r);
          st.cur=String(r);st.expr=e+' =';st.prev=null;st.op=null;st.fresh=true;
          API.lastCalc={e,r};
        }
        Audio2.tone(520,.09,'triangle',.08,880);
      }
      update();
    }
    w.el.addEventListener('keydown',e=>{
      const k=e.key;
      if(/^[0-9]$/.test(k))press(k);
      else if(k==='.'||k===',')press('.');
      else if('+-*/'.includes(k))press({'+':'+','-':'−','*':'×','/':'÷'}[k]);
      else if(k==='Enter'||k==='=')press('=');
      else if(k==='Backspace'){st.cur=st.cur.length>1?st.cur.slice(0,-1):'0';update()}
      else if(k==='Escape'||k==='Delete')press('AC');
      else if(k==='%')press('%');
      else if(k==='r'||k==='R')press('√');
      else return;
      e.preventDefault();
    });
    w.el.tabIndex=0;setTimeout(()=>w.el.focus(),80);
    renderHist();update();
    return {onResize(){}};
  }
};

APPS.browser={
  title:'Browser',icon:ICONS.browser,desc:'NexusBrowser',w:940,h:640,
  build(w,opts){
    const BOOKMARKS=LS.get('bookmarks',['nexus://home','nexus://about','nexus://games','nexus://system','nexus://terminal']);
    w.body.innerHTML=`<div class="br">
      <div class="brTabs"></div>
      <div class="brBar">
        <button class="nav" data-a="back" title="Back">${ICONS.back}</button>
        <button class="nav" data-a="fwd" title="Forward">${ICONS.fwd}</button>
        <button class="nav" data-a="reload" title="Reload">${ICONS.reload}</button>
        <button class="nav" data-a="home" title="Home">${ICONS.home}</button>
        <div class="brUrl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
          <input spellcheck="false" placeholder="nexus://home"></div>
        <button class="nav" data-a="star" title="Bookmark">${ICONS.star}</button>
        <select class="inp" data-bm style="max-width:150px" title="Bookmarks"></select>
      </div>
      <div class="brView"></div>
    </div>`;
    const tabsEl=w.body.querySelector('.brTabs'),
      view=w.body.querySelector('.brView'),
      urlInp=w.body.querySelector('.brUrl input'),
      bmSel=w.body.querySelector('[data-bm]');
    let tabs=[],cur=0,live=null;
    function newTab(url){
      const t={id:'bt'+Date.now()+Math.random().toString(36).slice(2,4),url:url||'nexus://home',title:'Loading…',hist:[],hi:-1};
      tabs.push(t);cur=tabs.length-1;navigate(t.url);renderTabs();
      return t;
    }
    function closeTab(i){
      if(tabs.length===1){newTab('nexus://home');return}
      tabs.splice(i,1);
      if(cur>=tabs.length)cur=tabs.length-1;
      renderTabs();navigate(tabs[cur].url);
    }
    function renderTabs(){
      tabsEl.innerHTML='';
      tabs.forEach((t,i)=>{
        const d=el('div','brTab'+(i===cur?' on':''),tabsEl);
        d.innerHTML=`<span class="fav"></span><span class="t">${esc(t.title)}</span><span class="x">×</span>`;
        d.querySelector('.fav').style.background=t.fav||'linear-gradient(135deg,#37e0ff,#b06bff)';
        d.onclick=()=>{cur=i;renderTabs();navigate(t.url)};
        d.querySelector('.x').onclick=e=>{e.stopPropagation();closeTab(i)};
        d.oncontextmenu=e=>{e.preventDefault();ctxMenu(e.clientX,e.clientY,[
          {label:'Reload',icon:ICONS.reload,act:()=>{cur=i;navigate(t.url)}},
          {label:'Duplicate',icon:ICONS.copy,act:()=>{const n={...t,id:'bt'+Date.now(),hist:[...t.hist],hi:t.hi};tabs.splice(i+1,0,n);cur=i+1;renderTabs();navigate(n.url)}},
          {sep:1},
          {label:'Close',icon:ICONS.x,act:()=>closeTab(i)},
          {label:'Close Others',icon:ICONS.x,act:()=>{tabs=[t];cur=0;renderTabs();navigate(t.url)}}
        ],t.title)};
      });
    }
    function renderBm(){
      bmSel.innerHTML='<option value="">Bookmarks</option>'+
        BOOKMARKS.map(b=>`<option value="${esc(b)}">${esc(b.replace('nexus://',''))}</option>`).join('');
    }
    function navigate(url){
      const t=tabs[cur];if(!t)return;
      url=String(url||'').trim();
      if(!url)url='nexus://home';
      if(!/^[a-z]+:\/\//i.test(url)&&!/^nexus:/i.test(url))url='nexus://'+url;
      if(t.url!==url||t.hist[t.hi]!==url){
        t.hist=t.hist.slice(0,t.hi+1);t.hist.push(url);t.hi=t.hist.length-1;
      }
      t.url=url;
      urlInp.value=url;
      w.body.querySelector('[data-a="back"]').disabled=t.hi<=0;
      w.body.querySelector('[data-a="fwd"]').disabled=t.hi>=t.hist.length-1;
      const key=url.split('?')[0].replace(/\/$/,'');
      const pg=NEXUS_PAGES[key.split('://')[1]]||NEXUS_PAGES[key];
      if(pg){
        t.title=pg.title;t.fav=pg.fav;
        view.style.background='#f7f9fc';
        view.innerHTML=pg.render(url.split('?')[1]||'');
        view.scrollTop=0;
        w.el.querySelector('.ttl').textContent=pg.title+' — Browser';
        if(key.endsWith('system'))startLive();
        else stopLive();
        if(key.endsWith('home'))fillHome();
      }else{
        t.title='Cannot reach page';t.fav='#ff5c72';
        view.style.background='#f7f9fc';
        view.innerHTML=`<div class="page"><div class="wrap" style="padding-top:60px;text-align:center">
          <div style="width:64px;height:64px;margin:0 auto 18px;opacity:.35">${ICONS.warn}</div>
          <h2>This site cannot be reached</h2>
          <p>NEXUS is an offline system. Only <code>nexus://</code> pages exist inside its network.</p>
          <p style="color:#8ea0bd">Try: <a href="#" data-go="nexus://home" style="color:#37e0ff">nexus://home</a> ·
          <a href="#" data-go="nexus://about" style="color:#37e0ff">nexus://about</a> ·
          <a href="#" data-go="nexus://games" style="color:#37e0ff">nexus://games</a></p>
          <button class="btnG" style="margin-top:20px" data-go="nexus://home">Go to start page</button></div></div>`;
        stopLive();
      }
      renderTabs();renderBm();
    }
    function fillHome(){
      const fs=$('#bhFs');
      if(fs){const st=VFS.stats();fs.textContent=`The virtual filesystem currently holds ${st.files} files across ${st.dirs} folders, using ${fmtBytes(st.bytes)}.`}
      const apps=$('#bhApps');
      if(apps){
        apps.innerHTML=Object.keys(APPS).filter(k=>!['diagnostics','computer'].includes(k)).slice(0,8).map(k=>
          `<button class="card" data-open="${k}"><span class="ic">${APPS[k].icon}</span><b>${esc(APPS[k].title)}</b><span>${esc(APPS[k].desc||'')}</span></button>`).join('');
      }
    }
    let liveTimer=null;
    function startLive(){
      stopLive();
      liveTimer=setInterval(()=>{
        const up=$('#bUptime');if(up)up.textContent=Diag.uptimeStr();
        const res=$('#bRes');
        if(res){
          res.innerHTML=[['CPU',Diag.cpu,'%'],['RAM',Math.round(Diag.ram/Diag.ramTotal*100),'%'],
            ['Storage',Math.min(99,Math.round(storageBytes/5242880*100)),'%'],['Frame rate',Diag.fps,' fps']]
            .map(([n,v,u])=>`<p><b>${n}</b> — ${v}${u}</p>
              <div class="bar2"><i style="width:${clamp(v,0,100)}%"></i></div>`).join('');
        }
        const wins=$('#bWins');
        if(wins){
          wins.innerHTML=WM.wins.length?`<table class="tbl"><tr><th>Application</th><th>State</th><th>Memory (sim.)</th></tr>`+
            WM.wins.map(x=>`<tr><td>${esc(x.title)}</td><td>${x.min?'minimized':'open'}</td><td>${(40+Math.random()*90).toFixed(0)} MB</td></tr>`).join('')+'</table>'
            :'<p>No windows are open.</p>';
        }
      },700);
    }
    function stopLive(){if(liveTimer){clearInterval(liveTimer);liveTimer=null}}
    view.addEventListener('click',e=>{
      const go=e.target.closest('[data-go]');
      if(go){e.preventDefault();navigate(go.dataset.go);return}
      const op=e.target.closest('[data-open]');
      if(op){API.open(op.dataset.open,op.dataset.path?{path:op.dataset.path}:{});return}
      const g=e.target.closest('[data-game]');
      if(g){API.open('arcade',{game:g.dataset.game})}
    });
    urlInp.addEventListener('keydown',e=>{if(e.key==='Enter'){navigate(urlInp.value);urlInp.blur()}});
    urlInp.addEventListener('focus',()=>urlInp.select());
    w.body.querySelector('.brBar').addEventListener('click',e=>{
      const b=e.target.closest('[data-a]');if(!b)return;
      const a=b.dataset.a,t=tabs[cur];
      if(a==='back'){if(t.hi>0){t.hi--;navigate(t.hist[t.hi])}}
      else if(a==='fwd'){if(t.hi<t.hist.length-1){t.hi++;navigate(t.hist[t.hi])}}
      else if(a==='reload'){navigate('nexus://'+t.url.split('?')[0].replace('nexus://','')+(t.url.includes('?')?'?'+t.url.split('?')[1]:''))}
      else if(a==='home')navigate('nexus://home');
      else if(a==='star'){
        if(BOOKMARKS.includes(t.url)){BOOKMARKS.splice(BOOKMARKS.indexOf(t.url),1);toast('Bookmark removed')}
        else{BOOKMARKS.push(t.url);toast('Bookmarked')}
        LS.set('bookmarks',BOOKMARKS);renderBm();
      }
      Audio2.click();
    });
    bmSel.onchange=()=>{if(bmSel.value)navigate(bmSel.value)};
    renderBm();
    newTab(opts.url||'nexus://home');
    return {destroy:()=>{stopLive();if(live){URL.revokeObjectURL(live);live=null}}};
  }
};

        <select class="inp" data-fillmode style="width:100%">
          <option value="solid">Solid</option><option value="outline">Outline</option></select>
      </div>
      <div class="ptCanvasWrap"><canvas id="ptCanvas" width="900" height="560"></canvas></div>
    </div>`;
    const cv=w.body.querySelector('#ptCanvas'),
      ctx=cv.getContext('2d',{willReadFrequently:true}),
      toolsEl=w.body.querySelector('.ptTools'),
      colorsEl=w.body.querySelector('.ptColors');
    const PALETTE=['#000000','#ffffff','#37e0ff','#b06bff','#ff4d9d','#3ddc84','#ffc857','#ff6b35',
      '#6fb0ff','#8ea0bd','#1a2740','#e8f1ff','#ff2e63','#00ffc8','#ffe066','#c0ff2e'];
    const TOOLS=[['pencil','Pencil',ICONS.pencil],['brush','Brush',ICONS.brush],['eraser','Eraser',ICONS.eraser],
      ['line','Line',ICONS.line],['rect','Rectangle',ICONS.rect],['circle','Circle',ICONS.circ],
      ['fill','Fill',ICONS.fill],['picker','Color picker',ICONS.dropper]];
    const st={tool:'pencil',color:'#37e0ff',size:6,op:1,fillMode:'solid',drawing:false,
      start:null,snapshot:null,undo:[],redo:[]};
    TOOLS.forEach(([id,nm,ic])=>{
      const b=el('button','ptTool'+(id===st.tool?' on':''),toolsEl);
      b.innerHTML=ic;b.title=nm;
      b.onclick=()=>{st.tool=id;$$('.ptTool',toolsEl).forEach(x=>x.classList.toggle('on',x===b));
        w.el.querySelector('.ttl').textContent='Paint — '+nm};
    });
    PALETTE.forEach(c=>{
      const s=el('div','sw'+(c===st.color?' on':''),colorsEl);
      s.style.background=c;s.title=c;
      s.onclick=()=>{st.color=c;$$('.sw',colorsEl).forEach(x=>x.classList.toggle('on',x===s))};
    });
    const sizeInp=w.body.querySelector('[data-size]'),
      opInp=w.body.querySelector('[data-op]'),
      fillInp=w.body.querySelector('[data-fillmode]');
    sizeInp.oninput=()=>{st.size=+sizeInp.value;w.body.querySelector('[data-sizel]').textContent=st.size};
    opInp.oninput=()=>{st.op=+opInp.value/100;w.body.querySelector('[data-opl]').textContent=opInp.value};
    fillInp.onchange=()=>{st.fillMode=fillInp.value};
    ctx.fillStyle='#ffffff';ctx.fillRect(0,0,cv.width,cv.height);
    ctx.lineCap='round';ctx.lineJoin='round';

    const push=()=>{
      st.undo.push(ctx.getImageData(0,0,cv.width,cv.height));
      if(st.undo.length>25)st.undo.shift();
      st.redo.length=0;updateUndo();
    };
    const updateUndo=()=>{
      w.body.querySelectorAll('[data-a]').forEach(b=>b.disabled=false);
    };
    const pos=e=>{
      const r=cv.getBoundingClientRect();
      return {x:(e.clientX-r.left)*cv.width/r.width, y:(e.clientY-r.top)*cv.height/r.height};
    };
    cv.onpointerdown=e=>{
      cv.setPointerCapture(e.pointerId);
      const p=pos(e);
      if(st.tool==='picker'){pick(p);return}
      push();
      st.drawing=true;st.start=p;
      if(['line','rect','circle'].includes(st.tool))st.snapshot=ctx.getImageData(0,0,cv.width,cv.height);
      else if(st.tool==='fill'){floodFill(p);st.drawing=false;return}
      else{
        ctx.beginPath();ctx.moveTo(p.x,p.y);
        ctx.strokeStyle=st.tool==='eraser'?'#ffffff':st.color;
        ctx.lineWidth=st.tool==='brush'?st.size*2.2:st.size;
        ctx.globalAlpha=st.tool==='eraser'?1:st.op;
        ctx.lineTo(p.x+.01,p.y);
        ctx.stroke();
      }
    };
    cv.onpointermove=e=>{
      if(!st.drawing)return;
      const p=pos(e);
      if(['line','rect','circle'].includes(st.tool)){
        ctx.putImageData(st.snapshot,0,0);
        ctx.strokeStyle=st.color;ctx.lineWidth=st.size;ctx.globalAlpha=st.op;
        ctx.fillStyle=st.color;ctx.globalAlpha=st.op*0.35;
        ctx.beginPath();
        if(st.tool==='line'){ctx.moveTo(st.start.x,st.start.y);ctx.lineTo(p.x,p.y)}
        else if(st.tool==='rect'){ctx.rect(st.start.x,st.start.y,p.x-st.start.x,p.y-st.start.y)}
        else{ctx.arc(st.start.x,st.start.y,Math.hypot(p.x-st.start.x,p.y-st.start.y),0,7)}
        if(st.fillMode==='solid'&&st.tool!=='line')ctx.fill();
        ctx.stroke();
      }else{
        ctx.strokeStyle=st.tool==='eraser'?'#ffffff':st.color;
        ctx.lineWidth=st.tool==='brush'?st.size*2.2:st.size;
        ctx.globalAlpha=st.tool==='eraser'?1:st.op;
        ctx.lineTo(p.x,p.y);ctx.stroke();

    };
    const stop=()=>{st.drawing=false;st.snapshot=null;ctx.globalAlpha=1};
    cv.onpointerup=stop;cv.onpointercancel=stop;cv.onpointerleave=()=>{if(st.drawing)stop()};
    function pick(p){
      const d=ctx.getImageData(Math.floor(p.x),Math.floor(p.y),1,1).data;
      const hex='#'+[d[0],d[1],d[2]].map(v=>v.toString(16).padStart(2,'0')).join('');
      st.color=hex;
      $$('.sw',colorsEl).forEach(x=>x.classList.toggle('on',x.title.toLowerCase()===hex));
      toast('Picked '+hex.toUpperCase());
    }
    function floodFill(p){
      const W=cv.width,H=cv.height;
      const img=ctx.getImageData(0,0,W,H),d=img.data;
      const x0=Math.floor(p.x),y0=Math.floor(p.y);
      if(x0<0||y0<0||x0>=W||y0>=H)return;
      const idx=(y0*W+x0)*4;
      const tr=d[idx],tg=d[idx+1],tb=d[idx+2],ta=d[idx+3];
      const c=hexRGB(st.color);
      if(Math.abs(tr-c[0])<2&&Math.abs(tg-c[1])<2&&Math.abs(tb-c[2])<2)return;
      const tol=28;
      const match=i=>Math.abs(d[i]-tr)<=tol&&Math.abs(d[i+1]-tg)<=tol&&Math.abs(d[i+2]-tb)<=tol&&Math.abs(d[i+3]-ta)<=tol;
      const stack=[[x0,y0]];
      let guard=W*H;
      while(stack.length&&guard-->0){
        const [sx,sy]=stack.pop();
        let yy=sy;
        for(;;){
          let xx=sx;
          for(;xx<W;xx++){ if(!match((yy*W+xx)*4))break;
            const i=(yy*W+xx)*4;
            d[i]=c[0];d[i+1]=c[1];d[i+2]=c[2];d[i+3]=255; }
          yy++;
          if(yy>=H)break;
          const i=(yy*W+xx)*4;
          if(!match(i))break;
          stack.push([xx,yy]);
        }
        yy--;
        for(;yy>=sy;yy--){
          let xx=sx;
          for(;xx>=0;xx--){const i=(yy*W+xx)*4;if(!match(i))break}
          while(++xx<W){const i=(yy*W+xx)*4;if(!match(i))break;
            if(yy-1>=0&&match(((yy-1)*W+xx)*4))stack.push([xx,yy-1]);
            if(yy+1<H&&match(((yy+1)*W+xx)*4))stack.push([xx,yy+1])}
        }
      }
      ctx.putImageData(img,0,0);
    }
    function hexRGB(h){const n=parseInt(h.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255]}
    const bar=el('div','toolbar',w.body);
    bar.style.cssText='border-top:1px solid rgba(255,255,255,.08);border-bottom:none';
    [['undo',ICONS.undo,'Undo (Ctrl+Z)'],['redo',ICONS.redo,'Redo (Ctrl+Y)'],
      ['clear',ICONS.trash,'Clear canvas'],['save',ICONS.save,'Save to /Pictures']].forEach(([a,ic,t])=>{
      const b=el('button','btn',bar);b.innerHTML=ic;b.title=t;
      b.onclick=()=>{

          st.redo.push(ctx.getImageData(0,0,cv.width,cv.height));ctx.putImageData(st.undo.pop(),0,0)}
        else if(a==='redo'){if(!st.redo.length)return toast('Nothing to redo');
          st.undo.push(ctx.getImageData(0,0,cv.width,cv.height));ctx.putImageData(st.redo.pop(),0,0)}
        else if(a==='clear'){push();ctx.fillStyle='#ffffff';ctx.fillRect(0,0,cv.width,cv.height);toast('Canvas cleared')}
        else if(a==='save')savePNG();
      };
    });
    const sEl=el('span','',bar);sEl.style.cssText='flex:1;text-align:right;font-size:11px;color:#8ea0bd;font-family:var(--mono)';
    const updSize=()=>{sEl.textContent=cv.width+' × '+cv.height+' px · '+st.tool};
    updSize();
    async function savePNG(){
      const name=await prompt2('Save Drawing','File name:','drawing-'+Date.now().toString(36)+'.png');
      if(!name)return;
      const r=VFS.write('/Pictures/'+name,'');
      if(r.err){toast(r.err,ICONS.warn);return}
      r.node.type='file';
      r.node.mime='image/png';
      r.node.blobUrl=cv.toDataURL('image/png');
      r.node.dataUrl=r.node.blobUrl;
      r.node.content='';
      r.node.size=Math.round(r.node.blobUrl.length*0.75);
      VFS.save();
      Notify.send('Drawing saved','/Pictures/'+name,{app:'paint',icon:ICONS.paint});
      Achievements.grant('PAINTER');
      toast('Saved to /Pictures/'+name);
    }
    w.el.addEventListener('keydown',e=>{
      if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();
        bar.querySelector('[title^="Undo"]').click()}
      if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();
        bar.querySelector('[title^="Redo"]').click()}
      if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();savePNG()}
    });
    return {destroy(){},onResize(){}};
  }
};

/* Enumerated settings: an unknown value is a bug, not a preference. Silently
   accepting one leaves the UI showing a state nothing actually applied. */
const SETTING_CHOICES={
  theme:()=>Object.keys(THEMES),
  iconSize:()=>['small','medium','large'],
  taskbarPos:()=>['top','bottom'],
  wallpaper:()=>WALLPAPERS.map(w=>w.id),
};
function setSetting(k,v){
  const ok=SETTING_CHOICES[k];
  if(ok&&!ok().includes(v)){
    console.warn('[settings] ignoring invalid value for',k,'=',JSON.stringify(v),'— expected one of',ok().join(', '));
    return false;
  }
  S[k]=v;LS.set('settings',S);
  applySettings();
  return true;
}

function applyTheme(name){
  const t=THEMES[name]||THEMES.nexus;

  r.setProperty('--win-bg',t.win);
  r.setProperty('--win-bg-solid',t.win);

    r.setProperty('--win-border','rgba(0,0,0,.14)');

}

    function wpGradient(wp){
      const m={
        city:'linear-gradient(160deg,#0b1226 0%,#3a1040 45%,#ff6bb0 100%)',
        space:'radial-gradient(circle at 70% 30%,#2a3a8a,#01020a 70%)',
        aurora:'linear-gradient(170deg,#01030c,#063a4d 50%,#0a5c3a)',
        matrix:'linear-gradient(160deg,#001a08,#003d16)',
        sunset:'linear-gradient(180deg,#1a0733,#6b1a5e 45%,#ffb26b)',
        minimal:'linear-gradient(150deg,#08090d,#181c26)',
        nebula:'radial-gradient(circle at 30% 30%,#6a2aa0,#04030f 70%)',
        vortex:'conic-gradient(from 0deg,#01020a,#0a2a4a,#01020a,#4a0a3a,#01020a)',
        plasma:'conic-gradient(from 45deg,#12003a,#003a4a,#3a003a,#12003a)',
        wireframe:'linear-gradient(160deg,#04060e,#0a1830)',
        void:'radial-gradient(circle at 50% 50%,#0a1a2a,#000 70%)',
        zero:'linear-gradient(160deg,#000,#220011)'
      };
      return m[wp.kind]||'#111';
    }
    function exportFS(){
      try{
        const data=JSON.stringify(VFS.tree,null,1);
        const b=new Blob([data],{type:'application/json'});
        const a=document.createElement('a');
        a.href=URL.createObjectURL(b);
        a.download='nexus-filesystem.json';
        a.click();
        setTimeout(()=>URL.revokeObjectURL(a.href),2000);
        toast('Filesystem exported');
        Notify.send('Export complete','nexus-filesystem.json downloaded',{icon:ICONS.save});
      }catch(e){toast('Export failed','<span style="color:#ff5c72">!</span>')}
    }
    function importFS(){
      const i=document.createElement('input');
      i.type='file';i.accept='application/json,.json';
      i.onchange=()=>{
        const f=i.files[0];if(!f)return;
        const r=new FileReader();
        r.onload=()=>{
          try{
            const tree=JSON.parse(r.result);
            if(!tree||tree.type!=='dir')throw new Error('not a filesystem');
            VFS.tree=VFS.rehydrate(tree);VFS.save();Bus.emit('fs');renderDesktopFiles();
            toast('Filesystem imported');
          }catch(e){toast('Invalid filesystem file','<span style="color:#ff5c72">!</span>')}
        };
        r.readAsText(f);
      };
      i.click();
    }
    render();
    return {onResize(){}};
  }
};

const Diag={
  boot:Date.now(),fps:60,cpu:12,ram:420,ramTotal:2048,
  hist:new Array(60).fill(0),histT:0,lastFrame:0,frames:0,full:false,
  cpuName(){return ['NexusCore i9-13900H (simulated)','NXR-8 Quantum Core (simulated)',
    'Vortex R9 5900X (simulated)','Photon A2-880 (simulated)'][0]},
  uptimeMs(){return Date.now()-this.boot},
  uptimeStr(){
    const s=this.uptimeMs()/1000|0;
    const h=s/3600|0,m=(s%3600)/60|0,ss=s%60;
    return (h?h+'h ':'')+(h||m?m+'m ':'')+ss+'s';
  },
  procCount(){
    const base=['kernel','init','compositor','wm','audio','input','compositor-gpu','event-loop','indexer','tray'];
    return base.length+WM.wins.length+(Wall.running?2:0)+Object.keys(APPS).length;
  },
  tick(ts){
    if(this.lastFrame){
      this.frames++;
      if(ts-this.lastFrame>=1000){
        this.fps=Math.round(this.frames*1000/(ts-this.lastFrame));
        this.frames=0;this.lastFrame=ts;
        this.sample();
      }
    }else this.lastFrame=ts;
    if(this.full)this.render();
  },
  sample(){
    const load=clamp(6+WM.wins.length*7+Math.random()*22+(this.fps<40?18:0),2,99);
    this.cpu=Math.round(this.cpu*0.6+load*0.4);
    const fs=VFS.stats();
    const used=340+WM.wins.length*78+Math.min(320,fs.bytes/900)+Math.random()*60;
    this.ram=Math.round(used);
    this.hist.push(this.cpu);this.hist.shift();
  },
  bars(){
    return [['CPU',this.cpu,100,'%'],['RAM',Math.round(this.ram/this.ramTotal*100),100,'%'],
      ['Storage',clamp(Math.round((storageBytes+this.ram*2048)/(512*1048576)*100),1,100),100,'%'],
      ['Frame rate',clamp(this.fps,0,120),120,' fps']];
  },
  sparkHTML(){
    return `<div class="dgBox" style="grid-column:1/-1">
      <h4>CPU load history (simulated)</h4>
      <canvas id="dgSpark" width="600" height="56"></canvas></div>`;
  },
  drawSpark(){
    const c=document.getElementById('dgSpark');if(!c)return;
    const d=window.devicePixelRatio||1;
    const W=c.clientWidth||600,H=56;
    c.width=W*d;c.height=H*d;
    const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);
    x.clearRect(0,0,W,H);
    x.strokeStyle='rgba(55,224,255,.13)';x.lineWidth=1;
    for(let i=1;i<4;i++){x.beginPath();x.moveTo(0,H*i/4);x.lineTo(W,H*i/4);x.stroke()}
    x.beginPath();
    this.hist.forEach((v,i)=>{const px=i/(this.hist.length-1)*W, py=H-(v/100)*H});
    this.hist.forEach((v,i)=>{const px=i/(this.hist.length-1)*W,py=H-(v/100)*H;
      i?x.lineTo(px,py):x.moveTo(px,py)});
    x.strokeStyle='#37e0ff';x.lineWidth=1.6;x.shadowColor='#37e0ff';x.shadowBlur=8;x.stroke();
    x.shadowBlur=0;
    x.lineTo(W,H);x.lineTo(0,H);x.closePath();
    const g=x.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'rgba(55,224,255,.28)');g.addColorStop(1,'rgba(55,224,255,0)');
    x.fillStyle=g;x.fill();
  },
  gridHTML(){
    const fs=VFS.stats();
    return this.sparkHTML()+`
      ${this.bars().map(([n,v,mx,u])=>`
        <div class="dgBox"><h4>${n}</h4>
          <div class="dgBar ${v/mx>.8?'warn':''}"><i style="width:${clamp(v/mx*100,0,100)}%"></i></div>
          <div class="dgRow"><span>${n==='Frame rate'?'Frame rate':n+' load'}</span><b>${v}${u}</b></div>
          <div class="dgRow"><span>Peak</span><b>${n==='Frame rate'?'60 fps':(mx)+u}</b></div>
        </div>`).join('')}
      <div class="dgBox"><h4>System</h4>
        <div class="dgRow"><span>Uptime</span><b>${this.uptimeStr()}</b></div>
        <div class="dgRow"><span>Processes</span><b>${this.procCount()}</b></div>
        <div class="dgRow"><span>Windows</span><b>${WM.wins.length}</b></div>
        <div class="dgRow"><span>Boot time</span><b>${fmtHMS(new Date(this.boot))}</b></div>
      </div>
      <div class="dgBox"><h4>Memory</h4>
        <div class="dgRow"><span>Used (sim.)</span><b>${this.ram} MB</b></div>
        <div class="dgRow"><span>Total</span><b>${this.ramTotal} MB</b></div>
        <div class="dgRow"><span>Free</span><b>${this.ramTotal-this.ram} MB</b></div>
        <div class="dgRow"><span>Heap nodes</span><b>${(performance.memory?(performance.memory.usedJSHeapSize/1048576).toFixed(0):'n/a')} MB</b></div>
      </div>
      <div class="dgBox"><h4>Filesystem</h4>
        <div class="dgRow"><span>Files</span><b>${fs.files}</b></div>
        <div class="dgRow"><span>Folders</span><b>${fs.dirs}</b></div>
        <div class="dgRow"><span>Content</span><b>${fmtBytes(fs.bytes)}</b></div>
        <div class="dgRow"><span>Depth</span><b>${fs.deepest}</b></div>
      </div>
      <div class="dgBox"><h4>Storage</h4>
        <div class="dgRow"><span>localStorage</span><b>${fmtBytes(storageBytes)}</b></div>
        <div class="dgRow"><span>Keys</span><b>${(()=>{try{let n=0;for(let i=0;i<localStorage.length;i++)if((localStorage.key(i)||'').startsWith('nexus.'))n++;return n}catch(e){return 0}})()}</b></div>
        <div class="dgRow"><span>Notifications</span><b>${Notify.list.length}</b></div>
        <div class="dgRow"><span>Achievements</span><b>${Achievements.total()}/${ACH_LIST.length}</b></div>
      </div>
      <div class="dgBox" style="grid-column:1/-1"><h4>Active processes (simulated)</h4>
        ${this.procTableHTML()}</div>`;
  },
  procTableHTML(){
    const base=[['kernel',0.4,12],['init',0.2,4],['nexuswm',0.9,64],['compositor',1.4,96],
      ['audio.service',0.3,18],['input.service',0.1,8],['indexer',0.6,42],['tray',0.2,10]];
    const wins=WM.wins.map(x=>['app:'+x.app.id,0.3+Math.random()*.5,28+Math.random()*70]);
    const rows=base.concat(wins);
    return `<div style="max-height:210px;overflow:auto"><table style="width:100%;font-size:11px;border-collapse:collapse">`+
      rows.map(([n,c,m])=>`<tr style="border-bottom:1px solid rgba(55,224,255,.08)">
        <td style="padding:4px 6px;color:#8ea0bd">${esc(n)}</td>
        <td style="padding:4px 6px;width:90px">${c.toFixed(1)}%</td>
        <td style="padding:4px 6px;width:80px;text-align:right">${m.toFixed(0)} MB</td>
        <td style="padding:4px 6px;width:70px;text-align:right;color:#3ddc84">running</td></tr>`).join('')+
      `</table></div>`;
  },
  render(){
    const g=document.getElementById(this.full?'dgFullGrid':'diagGrid');
    if(!g)return;
    g.innerHTML=this.gridHTML();
    this.drawSpark();
  },
  toggleFull(){
    this.full=!this.full;
    $('#dgFull').classList.toggle('on',this.full);
    if(this.full)this.render();
    Achievements.grant('DIAGNOSED');
  }
};

          <span class="hs">BEST ${g.id==='snake'?g.best():g.best()}</span></div>
          <div class="info"><b>${g.name}</b><span>${g.desc}</span></div>`;
        const cv=c.querySelector('canvas'),x=cv.getContext('2d');
        let f=0;
        const anim=()=>{
          if(!c.isConnected)return;
          f++;
          x.clearRect(0,0,320,118);
          x.fillStyle='#04060d';x.fillRect(0,0,320,118);
          if(g.id==='snake'){
            x.strokeStyle='rgba(55,224,255,.13)';x.lineWidth=1;
            for(let i=0;i<10;i++){x.beginPath();x.moveTo(0,i*12);x.lineTo(320,i*12);x.stroke();
              x.beginPath();x.moveTo(i*32,0);x.lineTo(i*32,118);x.stroke()}
            x.shadowBlur=12;x.shadowColor='#37e0ff';x.fillStyle='#37e0ff';
            for(let i=0;i<7;i++){x.beginPath();
              x.arc(20+i*44, 30+((i*23+f*1.6)%70), 6, 0, 7);x.fill()}
            x.shadowColor='#ff4d9d';x.fillStyle='#ff4d9d';
            x.beginPath();x.arc(250+Math.sin(f/22)*40,55+Math.cos(f/18)*26,5,0,7);x.fill();
            x.shadowBlur=0;
          }else{
            x.fillStyle='rgba(176,107,255,.10)';x.fillRect(0,0,320,118);
            x.strokeStyle='rgba(55,224,255,.5)';
            const rows=[];
            for(let i=0;i<16;i++)rows.push({y:((i*10+f*3)%140)-20,w:2+i*13});
            rows.forEach((r,i)=>{
              x.globalAlpha=.25+i/26;
              x.fillStyle=i%2?'#37e0ff':'#ff4d9d';
              x.fillRect(160-r.w/2,r.y,r.w,2);
            });
            x.globalAlpha=1;
            const cy=76+Math.sin(f/12)*7;
            x.fillStyle='#b06bff';x.beginPath();
            x.moveTo(160,cy-11);x.lineTo(170,cy+9);x.lineTo(160,cy+4);x.lineTo(150,cy+9);x.closePath();x.fill();
            x.shadowBlur=14;x.shadowColor='#b06bff';x.fill();
            x.shadowBlur=0;
            [130,190,225,255,290].forEach((ox,i)=>{
              const sc=.4+i*.05, oy=cy-(cy-70)*sc*.35;
              x.globalAlpha=.35+sc*.4;x.fillStyle='#37e0ff';
              x.beginPath();
              x.moveTo(ox,oy-7*sc);x.lineTo(ox+7*sc,oy+7*sc);x.lineTo(ox,oy+3*sc);x.lineTo(ox-7*sc,oy+7*sc);
              x.closePath();x.fill();
            });
            x.globalAlpha=1;
          }
          requestAnimationFrame(anim);
        };
        anim();
        c.onclick=()=>launch(g.id);
      });
    }
    function launch(game){
      home.style.display='none';
      if(game==='snake')buildSnake(w);
      else buildRacer(w);
    }
    renderHome();
    if(opts.game)setTimeout(()=>launch(opts.game),50);
    return {destroy(){w._gameCleanup&&w._gameCleanup()}};
  }
};
