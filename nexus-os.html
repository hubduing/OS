/* ============================================================
   NEXUS OS — single file operating system
   ============================================================ */
:root{
  --accent:#37e0ff;
  --accent2:#b06bff;
  --accent3:#ff4d9d;
  --win-bg:rgba(14,18,30,.78);
  --win-bg-solid:#0e1220;
  --win-border:rgba(255,255,255,.14);
  --win-shadow:0 30px 80px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.05) inset;
  --blur:18px;
  --opacity:1;
  --anim:1;
  --taskbar-pos:bottom;
  --icon-size:88px;
  --radius:14px;
  --font:'Segoe UI Variable Display','Segoe UI',Inter,system-ui,-apple-system,sans-serif;
  --mono:'Cascadia Code','JetBrains Mono',Consolas,'Courier New',monospace;
  --text:#e8f1ff;
  --muted:#8ea0bd;
  --ok:#3ddc84;
  --warn:#ffc857;
  --err:#ff5c72;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#05070d;color:var(--text);font-family:var(--font);font-size:14px;user-select:none}
body.no-anim *{animation:none!important;transition:none!important}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
input,textarea,select{outline:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:20px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.28);background-clip:padding-box}
.sel{user-select:text}

/* ---------- BOOT ---------- */
#boot{position:fixed;inset:0;background:#04060b;z-index:99999;display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-family:var(--mono);color:#9fe8ff;overflow:hidden}
#boot.off{opacity:0;pointer-events:none;transition:opacity .8s ease, filter .8s}
#boot.gone{display:none}
#bootGlow{position:absolute;width:760px;height:760px;border-radius:50%;filter:blur(90px);opacity:.30;
  background:radial-gradient(circle,var(--accent) 0%,transparent 65%);animation:pulseGlow 3.4s ease-in-out infinite}
@keyframes pulseGlow{0%,100%{transform:scale(.85);opacity:.22}50%{transform:scale(1.12);opacity:.4}}
#bootLogo{position:relative;font-size:clamp(30px,7vw,62px);font-weight:200;letter-spacing:.36em;
  text-indent:.36em;margin-bottom:6px;
  background:linear-gradient(90deg,#37e0ff,#b06bff,#ff4d9d,#37e0ff);background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 4s linear infinite;
  filter:drop-shadow(0 0 22px rgba(55,224,255,.5))}
@keyframes shine{to{background-position:300% 0}}
#bootSub{position:relative;font-size:11px;letter-spacing:.42em;color:#4a7f9e;margin-bottom:34px;text-transform:uppercase}
#bootLog{position:relative;width:min(640px,88vw);height:200px;overflow:hidden;font-size:13px;line-height:1.75}
#bootLog div{opacity:0;animation:fadeIn .3s forwards;white-space:pre-wrap}
#bootLog .ok{color:#3ddc84}
#bootLog .warn{color:#ffc857}
#bootLog .hi{color:#fff;text-shadow:0 0 10px var(--accent)}
@keyframes fadeIn{to{opacity:1}}
#bootCur{display:inline-block;width:9px;height:16px;background:var(--accent);vertical-align:-3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
#bootBarWrap{position:relative;width:min(640px,88vw);height:3px;background:rgba(255,255,255,.08);border-radius:4px;margin-top:18px;overflow:hidden}
#bootBar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));box-shadow:0 0 14px var(--accent);transition:width .25s}
#bootPct{position:relative;margin-top:10px;font-size:11px;color:#4a7f9e;letter-spacing:.2em}
#shutdownScreen{position:fixed;inset:0;background:#04060b;z-index:100000;display:none;align-items:center;justify-content:center;
  flex-direction:column;gap:18px;font-family:var(--mono);color:var(--accent);letter-spacing:.3em;font-size:13px}
#shutdownScreen.on{display:flex}

/* ---------- WALLPAPER ---------- */
#wall{position:fixed;inset:0;z-index:0;background:#05070d;overflow:hidden}
#wall canvas{position:absolute;inset:0;width:100%;height:100%}
#wall .wp{position:absolute;inset:0;opacity:0;transition:opacity 1.1s ease;background-size:cover;background-position:center}
#wall .wp.on{opacity:1}

/* ---------- DESKTOP ---------- */
#desktop{position:fixed;inset:0;z-index:1}
#icons{position:absolute;inset:0;padding:12px;display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-start;gap:4px}
.dicon{width:var(--icon-size);padding:10px 4px 6px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:7px;
  cursor:pointer;border:1px solid transparent;transition:background .15s,border-color .15s,transform .12s}
.dicon:hover{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.1)}
.dicon.sel{background:rgba(55,224,255,.16);border-color:rgba(55,224,255,.45)}
.dicon:active{transform:scale(.96)}
.dicon .ico{width:44px;height:44px;display:grid;place-items:center;filter:drop-shadow(0 6px 12px rgba(0,0,0,.55))}

.dicon span{font-size:11.5px;text-align:center;line-height:1.25;text-shadow:0 1px 4px #000,0 0 10px rgba(0,0,0,.7);
  max-width:100%;word-break:break-word;padding:1px 5px;border-radius:5px}
.dicon.sel span{background:var(--accent);color:#001018;text-shadow:none}
.marquee{position:absolute;border:1px solid var(--accent);background:rgba(55,224,255,.12);pointer-events:none;display:none;z-index:5}

/* ---------- TASKBAR ---------- */
#taskbar{position:fixed;left:0;right:0;bottom:0;height:52px;z-index:9000;display:flex;align-items:center;gap:6px;padding:0 8px;
  background:rgba(8,12,22,.62);backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);
  border-top:1px solid rgba(255,255,255,.1);box-shadow:0 -10px 40px rgba(0,0,0,.45);
  transition:transform .35s cubic-bezier(.2,.8,.2,1)}
#taskbar.hidden{transform:translateY(110%)}
#startBtn{display:flex;align-items:center;gap:9px;padding:7px 14px 7px 10px;border-radius:10px;transition:background .15s,box-shadow .15s}
#startBtn:hover,#startBtn.on{background:rgba(255,255,255,.1);box-shadow:0 0 0 1px rgba(255,255,255,.12),0 0 18px rgba(55,224,255,.25)}
#startBtn .lg{width:22px;height:22px}
#startBtn b{font-weight:600;font-size:12.5px;letter-spacing:.22em}
#searchBtn{display:flex;align-items:center;gap:8px;padding:7px 14px;border-radius:10px;color:var(--muted);font-size:12.5px;transition:.15s}
#searchBtn:hover{background:rgba(255,255,255,.08);color:var(--text)}
#taskItems{flex:1;display:flex;align-items:center;gap:5px;overflow-x:auto;overflow-y:hidden;padding:0 4px;scrollbar-width:none}
#taskItems::-webkit-scrollbar{display:none}
.titem{height:38px;min-width:44px;max-width:170px;padding:0 12px;border-radius:9px;display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);position:relative;flex:0 0 auto;
  transition:background .15s,transform .12s,border-color .15s}
.titem:hover{background:rgba(255,255,255,.12)}
.titem:active{transform:scale(.95)}
.titem.active{background:linear-gradient(180deg,rgba(55,224,255,.28),rgba(55,224,255,.1));border-color:rgba(55,224,255,.5);
  box-shadow:0 0 16px rgba(55,224,255,.25)}
.titem .ic{width:20px;height:20px;flex:0 0 auto}
.titem .ic svg{width:100%;height:100%}
.titem .tt{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titem .und{position:absolute;bottom:1px;left:50%;transform:translateX(-50%);width:5px;height:3px;border-radius:2px;background:var(--muted)}
.titem.active .und{width:16px;background:var(--accent);box-shadow:0 0 8px var(--accent)}
#tray{display:flex;align-items:center;gap:4px;padding:0 4px;border-radius:9px;transition:background .15s}
#tray:hover{background:rgba(255,255,255,.08)}
.trayIco{width:22px;height:22px;display:grid;place-items:center;opacity:.9;position:relative}
.trayIco svg{width:100%;height:100%}
.trayIco.badge::after{content:attr(data-n);position:absolute;top:-4px;right:-6px;min-width:15px;height:15px;padding:0 3px;
  border-radius:8px;background:var(--accent3);color:#fff;font-size:9px;font-weight:700;display:grid;place-items:center;box-shadow:0 0 8px var(--accent3)}
#clock{text-align:right;line-height:1.25;padding:4px 8px;border-radius:8px;transition:background .15s}
#clock:hover{background:rgba(255,255,255,.08)}
#clock .t{font-size:12.5px;font-weight:600;letter-spacing:.03em}
#clock .d{font-size:10.5px;color:var(--muted)}

#ncList{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.ncItem{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:11px;padding:10px 12px;cursor:pointer;transition:.14s}
.ncItem:hover{background:rgba(255,255,255,.11);transform:translateX(-3px)}
.ncItem b{display:block;font-size:12.5px;margin-bottom:3px}
.ncItem span{font-size:11.5px;color:var(--muted);line-height:1.45}
.ncItem .tm{float:right;font-size:10px;color:var(--muted)}

/* ---------- DIALOGS ---------- */
#modalWrap{position:fixed;inset:0;z-index:13000;display:none;align-items:center;justify-content:center;
  background:rgba(3,6,12,.55);backdrop-filter:blur(3px)}
#modalWrap.on{display:flex}
.modal{width:min(420px,92vw);border-radius:16px;background:rgba(14,19,33,.95);border:1px solid rgba(255,255,255,.16);
  box-shadow:0 30px 80px rgba(0,0,0,.7);overflow:hidden;animation:winIn .22s cubic-bezier(.2,1.1,.3,1)}
.modal .hd{padding:15px 18px 8px;display:flex;gap:11px;align-items:flex-start}
.modal .hd .ic{width:30px;height:30px;flex:0 0 auto;border-radius:9px;display:grid;place-items:center;background:rgba(55,224,255,.16);padding:5px}
.modal .hd .ic svg{width:100%;height:100%}
.modal .hd b{font-size:14px;display:block;margin-bottom:3px}
.modal .hd p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.55}
.modal .bd{padding:6px 18px 14px}
.modal .ft{padding:12px 18px;display:flex;gap:9px;justify-content:flex-end;background:rgba(0,0,0,.22);border-top:1px solid rgba(255,255,255,.07)}
.toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%) translateY(20px);z-index:14000;padding:9px 18px;
  border-radius:11px;background:rgba(12,17,30,.94);border:1px solid rgba(255,255,255,.16);font-size:12.5px;
  box-shadow:0 14px 40px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:.25s;display:flex;align-items:center;gap:9px}
.toast.on{opacity:1;transform:translateX(-50%)}
.toast svg{width:15px;height:15px;color:var(--accent)}


/* ==================================================================
   KERNEL/06-FILES-TERM
   src/kernel/06-files-term.css
   ================================================================== */

/* ---------- FILE MANAGER ---------- */
.fm{display:flex;flex:1;min-height:0}
.fmSide{width:180px;flex:0 0 auto;border-right:1px solid rgba(255,255,255,.08);padding:9px;overflow-y:auto;background:rgba(0,0,0,.16)}
.fmSide .lbl{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);padding:9px 9px 5px}
.sideIco{display:flex;align-items:center;gap:9px;padding:6px 9px;border-radius:8px;font-size:12px;color:#c8d6ee;width:100%;transition:.13s}
.sideIco:hover{background:rgba(255,255,255,.09)}
.sideIco.on{background:linear-gradient(90deg,rgba(55,224,255,.26),transparent);color:#fff;box-shadow:inset 2px 0 0 var(--accent)}
.sideIco .ic{width:17px;height:17px;flex:0 0 auto}
.sideIco .ic svg{width:100%;height:100%}
.sideIco .cnt{margin-left:auto;font-size:10px;color:var(--muted)}
.fmMain{flex:1;display:flex;flex-direction:column;min-width:0}
.crumbs{display:flex;align-items:center;gap:2px;padding:7px 10px;overflow-x:auto;white-space:nowrap;border-bottom:1px solid rgba(255,255,255,.07)}
.crumbs button{padding:4px 8px;border-radius:7px;font-size:12px;color:#c8d6ee;transition:.13s}
.crumbs button:hover{background:rgba(255,255,255,.12)}
.crumbs .sp{color:var(--muted);font-size:11px;padding:0 2px;pointer-events:none}
.flist{flex:1;overflow:auto;padding:10px}
.flist.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px;align-content:start}
.fitem{border-radius:10px;padding:9px 6px;display:flex;align-items:center;gap:9px;transition:background .13s,border-color .13s;cursor:default;position:relative}
.fitem:hover{background:rgba(255,255,255,.08)}
.fitem.sel{background:rgba(55,224,255,.2);box-shadow:inset 0 0 0 1px rgba(55,224,255,.45)}
.fitem.cut{opacity:.45}
.fitem .ic{width:30px;height:30px;flex:0 0 auto;display:grid;place-items:center}
.flist.grid .fitem{flex-direction:column;gap:8px;text-align:center;padding:12px 4px}
.fitem .ic svg{width:100%;height:100%;overflow:visible}
.fitem .nm{font-size:12px;line-height:1.3;word-break:break-word;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flist.grid .fitem .nm{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:11.5px}
.fitem .mt{margin-left:auto;font-size:10px;color:var(--muted);text-align:right;line-height:1.45;flex:0 0 auto}
.fmStatus{flex:0 0 auto;padding:6px 12px;font-size:11px;color:var(--muted);border-top:1px solid rgba(255,255,255,.07);background:rgba(0,0,0,.16);display:flex;gap:14px;align-items:center}
.dragover{background:rgba(55,224,255,.12)!important;box-shadow:inset 0 0 0 2px rgba(55,224,255,.5)!important}
.ren{width:100%;background:#000;border:1px solid var(--accent);border-radius:5px;padding:3px 5px;font-size:12px}

/* ---------- TERMINAL ---------- */
.termWrap{flex:1;display:flex;flex-direction:column;background:rgba(2,4,8,.9);font-family:var(--mono);font-size:12.5px;min-height:0}
.termOut{flex:1;overflow-y:auto;padding:11px 13px;white-space:pre-wrap;word-break:break-word;line-height:1.5;user-select:text;cursor:text}
.termLine{animation:fadeIn .15s}
.termIn{flex:0 0 auto;display:flex;align-items:flex-start;gap:0;padding:5px 13px 11px;background:rgba(2,4,8,.9)}
.termIn .ps{color:var(--ok);flex:0 0 auto;white-space:pre}
.termIn input{flex:1;background:none;border:none;font-family:var(--mono);font-size:12.5px;color:#d7e6ff;caret-color:transparent;min-width:0;user-select:text}
.termIn .cur{display:inline-block;width:8px;height:15px;background:var(--accent);vertical-align:-3px;pointer-events:none;
  box-shadow:0 0 8px var(--accent)}
.termIn input:focus+.cur{animation:blink 1.05s steps(1) infinite}
.t-green{color:#3ddc84}.t-cyan{color:#37e0ff}.t-yel{color:#ffc857}.t-red{color:#ff5c72}.t-mag{color:#b06bff}
.t-dim{color:#6b7f9e}.t-wht{color:#e8f1ff}.t-bl{color:#6fb0ff}
.termWrap.matrix .termOut,.termWrap.matrix .termIn{background:#000}
#matrixCanvas{position:absolute;inset:0;z-index:-1;opacity:.85}


/* ==================================================================
   KERNEL/07-EDITOR-CALC
   src/kernel/07-editor-calc.css
   ================================================================== */

/* ---------- EDITOR ---------- */
.ed{display:flex;flex:1;min-height:0;position:relative}
.edGutter{flex:0 0 auto;padding:9px 8px 9px 12px;text-align:right;font-family:var(--mono);font-size:12.5px;line-height:1.55;
  color:#3d4f6b;background:rgba(0,0,0,.24);border-right:1px solid rgba(255,255,255,.06);overflow:hidden;user-select:none}
.edGutter div.cur{color:var(--accent);text-shadow:0 0 8px var(--accent)}
.edArea{flex:1;position:relative;overflow:hidden}
.edPre,.edTa{position:absolute;inset:0;padding:9px 13px;font-family:var(--mono);font-size:12.5px;line-height:1.55;
  white-space:pre-wrap;word-break:break-word;overflow-wrap:break-word;border:none;user-select:text;overflow-y:auto}
.edPre{pointer-events:none;color:#c9dcf5;z-index:1}
.edTa{background:transparent;color:transparent;caret-color:var(--accent);z-index:2;resize:none}
.tk-key{color:#b06bff;font-weight:600}
.tk-str{color:#3ddc84}
.tk-num{color:#ffc857}
.tk-com{color:#4a5f7d;font-style:italic}
.tk-fn{color:#37e0ff}
.tk-tag{color:#ff4d9d}
.tk-attr{color:#ffc857}
.edTabs{flex:0 0 auto;display:flex;gap:2px;padding:5px 6px 0;background:rgba(0,0,0,.26);overflow-x:auto;scrollbar-width:none}
.edTabs::-webkit-scrollbar{display:none}
.edTab{display:flex;align-items:center;gap:7px;padding:6px 10px;border-radius:8px 8px 0 0;font-size:11.5px;color:var(--muted);
  background:rgba(255,255,255,.05);white-space:nowrap;transition:.13s;flex:0 0 auto}
.edTab:hover{background:rgba(255,255,255,.11)}
.edTab.on{background:rgba(255,255,255,.14);color:#fff;box-shadow:inset 0 -2px 0 var(--accent)}
.edTab .dot{width:6px;height:6px;border-radius:50%;background:var(--warn);box-shadow:0 0 6px var(--warn)}
.edTab .x{opacity:.5;font-size:13px;line-height:1}
.edTab .x:hover{opacity:1;color:var(--err)}
.edStatus{flex:0 0 auto;display:flex;gap:16px;align-items:center;padding:5px 12px;font-size:10.5px;color:var(--muted);
  border-top:1px solid rgba(255,255,255,.07);background:rgba(0,0,0,.22);font-family:var(--mono)}
.edStatus .ok{color:var(--ok)}
.edStatus .wr{color:var(--warn)}

/* ---------- CALCULATOR ---------- */
.calc{flex:1;display:flex;flex-direction:column;min-height:0;padding:12px;gap:11px;background:rgba(0,0,0,.2)}
.calcDisp{flex:0 0 auto;text-align:right;padding:14px 16px;border-radius:13px;background:rgba(0,0,0,.34);
  border:1px solid rgba(255,255,255,.09)}
.calcExpr{font-size:12.5px;color:var(--muted);min-height:18px;font-family:var(--mono);word-break:break-all}
.calcVal{font-size:34px;font-weight:200;letter-spacing:-.02em;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.calcPad{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:7px;min-height:0}
.ckey{border-radius:12px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.09);font-size:16px;font-weight:400;
  transition:.12s;display:grid;place-items:center;color:#e8f1ff}
.ckey:hover{background:rgba(255,255,255,.15);transform:translateY(-1px)}
.ckey:active{transform:scale(.94)}
.ckey.op{background:linear-gradient(135deg,rgba(55,224,255,.28),rgba(176,107,255,.2));border-color:rgba(55,224,255,.35);font-weight:600}
.ckey.fn{background:rgba(255,255,255,.13);font-size:14px;color:#c8d6ee}
.ckey.eq{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#00121a;font-weight:700;box-shadow:0 4px 18px rgba(55,224,255,.35)}
.calcHist{flex:0 0 92px;overflow-y:auto;border-radius:11px;background:rgba(0,0,0,.24);border:1px solid rgba(255,255,255,.07);padding:6px}
.calcHist div{padding:5px 8px;font-size:11.5px;font-family:var(--mono);color:var(--muted);border-radius:7px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.calcHist div:hover{background:rgba(255,255,255,.09);color:#fff}
.calcHist b{color:var(--accent);font-weight:600}


/* ==================================================================
   KERNEL/08-BROWSER
   src/kernel/08-browser.css
   ================================================================== */

/* ---------- BROWSER ---------- */
.br{display:flex;flex-direction:column;flex:1;min-height:0}
.brTabs{flex:0 0 auto;display:flex;gap:3px;padding:6px 8px 0;background:rgba(0,0,0,.3);overflow-x:auto;scrollbar-width:none}
.brTabs::-webkit-scrollbar{display:none}
.brTab{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:9px 9px 0 0;font-size:11.5px;max-width:210px;
  background:rgba(255,255,255,.05);transition:.13s;flex:0 0 auto;cursor:default}
.brTab:hover{background:rgba(255,255,255,.12)}
.brTab.on{background:rgba(255,255,255,.15)}
.brTab .fav{width:14px;height:14px;flex:0 0 auto;border-radius:3px;background:linear-gradient(135deg,var(--accent),var(--accent2))}
.brTab .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.brTab .x{opacity:.5;font-size:13px}.brTab .x:hover{opacity:1;color:var(--err)}
.brBar{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:7px 9px;border-bottom:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03)}
.brBar .nav{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:#c8d6ee;transition:.13s;flex:0 0 auto}
.brBar .nav:hover:not(:disabled){background:rgba(255,255,255,.13)}
.brBar .nav:disabled{opacity:.28;cursor:default}
.brBar .nav svg{width:14px;height:14px}
.brUrl{flex:1;display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.1);
  border-radius:9px;padding:6px 11px;transition:.15s}
.brUrl:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(55,224,255,.14)}
.brUrl svg{width:12px;height:12px;color:var(--muted);flex:0 0 auto}
.brUrl input{flex:1;background:none;border:none;font-size:12.5px;min-width:0;user-select:text}
.brView{flex:1;overflow:auto;background:#f7f9fc;color:#141b2b;user-select:text}
.page{min-height:100%;padding:0;font-family:var(--font)}
.hero{padding:70px 40px;text-align:center;background:linear-gradient(140deg,#0a1024,#1b1040 60%,#3a1040);color:#fff;position:relative;overflow:hidden}
.hero h1{font-size:44px;font-weight:200;letter-spacing:.16em;margin-bottom:12px;
  background:linear-gradient(90deg,#37e0ff,#b06bff,#ff4d9d);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{font-size:14px;color:#9fb3d0;max-width:520px;margin:0 auto;line-height:1.7}
.hero .btnG{display:inline-flex;margin-top:26px;padding:11px 26px;border-radius:30px;background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#00121a;font-weight:700;font-size:13px;text-decoration:none;box-shadow:0 8px 30px rgba(55,224,255,.35)}
.wrap{max-width:1000px;margin:0 auto;padding:34px 30px}
.wrap h2{font-size:22px;font-weight:600;margin-bottom:14px;color:#0f1729}
.wrap h3{font-size:15px;font-weight:600;margin:22px 0 9px;color:#1e293b}
.wrap p{font-size:14px;line-height:1.75;color:#46536b;margin-bottom:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:15px;margin:20px 0}
.card{background:#fff;border:1px solid #e3e9f2;border-radius:14px;padding:18px;transition:.2s;cursor:pointer;text-align:left;width:100%}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(20,30,60,.12);border-color:var(--accent)}
.card .ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;margin-bottom:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));padding:5px}
.card .ic svg{width:100%;height:100%}
.card b{font-size:14px;display:block;margin-bottom:5px;color:#0f1729}
.card span{font-size:12.5px;color:#5b6880;line-height:1.55}
table.tbl{width:100%;border-collapse:collapse;margin:14px 0;font-size:13px}
table.tbl th{background:#eef2f8;text-align:left;padding:9px 11px;font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:#5b6880}
table.tbl td{padding:9px 11px;border-bottom:1px solid #e8edf5;color:#33405a}
.bar2{height:8px;background:#e6ebf3;border-radius:5px;overflow:hidden;margin:5px 0 12px}
.bar2 i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .8s}
.kbd{display:inline-block;padding:2px 7px;border-radius:5px;background:#eef2f8;border:1px solid #d3dbe8;
  border-bottom-width:2px;font-family:var(--mono);font-size:11.5px;color:#33405a}
.brFind{position:absolute;top:0;right:0;padding:7px 10px;background:#fff;border-left:1px solid #e3e9f2;border-bottom:1px solid #e3e9f2;
  display:none;gap:6px;align-items:center;z-index:5}
.brFind.on{display:flex}
.brFind input{width:170px;padding:5px 9px;border:1px solid #d3dbe8;border-radius:6px;font-size:12.5px}


/* ==================================================================
   KERNEL/09-PAINT-MEDIA
   src/kernel/09-paint-media.css
   ================================================================== */

/* ---------- PAINT ---------- */
.pt{display:flex;flex:1;min-height:0}
.ptTools{width:46px;flex:0 0 auto;background:rgba(0,0,0,.26);border-right:1px solid rgba(255,255,255,.08);padding:7px 5px;
  display:flex;flex-direction:column;gap:4px;align-items:center;overflow-y:auto}
.ptTool{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#c8d6ee;transition:.13s;flex:0 0 auto}
.ptTool:hover{background:rgba(255,255,255,.13)}
.ptTool.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#00121a;box-shadow:0 0 14px rgba(55,224,255,.4)}
.ptTool svg{width:16px;height:16px}
.ptSide{width:150px;flex:0 0 auto;padding:10px;border-right:1px solid rgba(255,255,255,.08);background:rgba(0,0,0,.14);overflow-y:auto}
.ptColors{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-bottom:12px}
.sw{aspect-ratio:1;border-radius:6px;transition:.13s;border:1px solid rgba(255,255,255,.14);cursor:pointer}
.sw:hover{transform:scale(1.14)}
.sw.on{box-shadow:0 0 0 2px var(--accent);transform:scale(1.1)}
.ptSide label{display:block;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin:11px 0 6px}
.ptSide input[type=range]{width:100%;accent-color:var(--accent)}
.ptCanvasWrap{flex:1;overflow:auto;display:grid;place-items:center;padding:16px;background:
  repeating-conic-gradient(rgba(255,255,255,.03) 0% 25%,transparent 0% 50%) 50%/18px 18px}
#ptCanvas{background:#fff;box-shadow:0 10px 40px rgba(0,0,0,.5);cursor:crosshair;border-radius:4px;max-width:100%;image-rendering:pixelated}

/* ---------- SHARED PLAYER CHROME ----------
   Music and Video are apps now and each carries its own exclusive rules in its
   own folder. What is left here is the transport they BOTH use — the round
   buttons and the scrub bar. A rule with two owners has no single owning
   folder, so it stays in the kernel and is named here rather than left as an
   unexplained leftover. Everything else under MEDIA moved:
     .md .mdMain .mdStage .mdCtrl .mdTime .mdList .mdItem -> apps/music
     .vd* and the fullscreen rules                    -> apps/video */
.mbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.12);transition:.14s}
.mbtn:hover{background:rgba(255,255,255,.18);transform:scale(1.06)}
.mbtn.play{width:48px;height:48px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#00121a;border-color:transparent;
  box-shadow:0 6px 22px rgba(55,224,255,.4)}
.mbtn svg{width:17px;height:17px}
.mbtn.play svg{width:20px;height:20px}
.mdSeek{flex:1;height:6px;border-radius:4px;background:rgba(255,255,255,.13);position:relative;cursor:pointer}
.mdSeek i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:4px}
.mdSeek b{position:absolute;top:50%;width:13px;height:13px;margin:-6.5px 0 0 -6.5px;border-radius:50%;background:#fff;
  box-shadow:0 0 10px var(--accent);opacity:0;transition:opacity .13s}
.mdSeek:hover b{opacity:1}


/* ==================================================================
   KERNEL/10-GAMES
   src/kernel/10-games.css
   ================================================================== */

/* ---------- GAMES ---------- */
.gm{display:flex;flex:1;min-height:0;position:relative;background:#04060c}
.gmCanvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.gmOverlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;
  background:rgba(4,6,12,.82);backdrop-filter:blur(7px);text-align:center;padding:24px;z-index:4}
.gmOverlay.hide{display:none}
.gmOverlay h2{font-size:30px;font-weight:200;letter-spacing:.2em;background:linear-gradient(90deg,#37e0ff,#b06bff,#ff4d9d);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.gmOverlay p{font-size:12.5px;color:var(--muted);line-height:1.7;max-width:420px}
.gmHud{position:absolute;top:0;left:0;right:0;padding:11px 16px;display:flex;gap:20px;align-items:center;z-index:3;pointer-events:none;
  font-family:var(--mono);text-shadow:0 2px 8px #000}
.gmHud .s{display:flex;flex-direction:column}
.gmHud .s span{font-size:9px;letter-spacing:.18em;color:var(--muted)}
.gmHud .s b{font-size:17px;font-weight:600;color:var(--accent);text-shadow:0 0 12px var(--accent)}
.gmKeys{position:absolute;bottom:10px;left:14px;font-size:10.5px;color:var(--muted);font-family:var(--mono);z-index:3;
  line-height:1.6;pointer-events:none;text-shadow:0 1px 4px #000}
.arcadeHome{flex:1;overflow-y:auto;padding:26px;background:linear-gradient(160deg,#080c1a,#12082a 55%,#1a0630)}
.arcadeHome h1{font-size:32px;font-weight:200;letter-spacing:.24em;text-align:center;margin-bottom:6px;
  background:linear-gradient(90deg,#37e0ff,#ff4d9d);-webkit-background-clip:text;background-clip:text;color:transparent}
.arcadeHome .sub{text-align:center;color:var(--muted);font-size:12px;letter-spacing:.2em;margin-bottom:26px}
.gcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;max-width:760px;margin:0 auto}
.gcard{border-radius:15px;overflow:hidden;border:1px solid rgba(255,255,255,.11);background:rgba(255,255,255,.045);
  transition:.2s;cursor:pointer;text-align:left;padding:0}
.gcard:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:0 14px 40px rgba(55,224,255,.2)}
.gthumb{height:118px;position:relative;overflow:hidden;background:#05070d}
.gthumb canvas{width:100%;height:100%;display:block}
.gcard .info{padding:13px 15px}
.gcard b{font-size:14.5px;display:block;margin-bottom:4px;letter-spacing:.05em}
.gcard span{font-size:11.5px;color:var(--muted);line-height:1.5}
.gcard .hs{position:absolute;top:8px;right:8px;padding:3px 8px;border-radius:20px;background:rgba(0,0,0,.6);

.diffbar{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}


/* ==================================================================
   KERNEL/11-SETTINGS-AI
   src/kernel/11-settings-ai.css
   ================================================================== */

/* ---------- SETTINGS ---------- */
.st{display:flex;flex:1;min-height:0}
.stSide{width:186px;flex:0 0 auto;padding:9px;border-right:1px solid rgba(255,255,255,.08);overflow-y:auto;background:rgba(0,0,0,.18)}
.stMain{flex:1;overflow-y:auto;padding:20px 24px;min-width:0}
.stMain h2{font-size:19px;font-weight:500;margin-bottom:4px}
.stMain .dsc{font-size:12px;color:var(--muted);margin-bottom:18px}
.row{display:flex;align-items:center;gap:16px;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.row:last-child{border-bottom:none}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-size:13px;font-weight:500;margin-bottom:3px}
.row .tx span{font-size:11.5px;color:var(--muted);line-height:1.5}
.row select.inp{min-width:150px;cursor:pointer}
.row input[type=range]{width:150px;accent-color:var(--accent);cursor:pointer}
.sw2{width:42px;height:23px;border-radius:20px;background:rgba(255,255,255,.16);position:relative;transition:background .2s;flex:0 0 auto;cursor:pointer}
.sw2::after{content:'';position:absolute;top:2.5px;left:2.5px;width:18px;height:18px;border-radius:50%;background:#fff;
  transition:transform .2s cubic-bezier(.2,1.2,.3,1);box-shadow:0 2px 6px rgba(0,0,0,.4)}
.sw2.on{background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 0 14px rgba(55,224,255,.4)}
.sw2.on::after{transform:translateX(19px)}
.wpgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:8px}
.wpc{border-radius:11px;overflow:hidden;border:2px solid transparent;transition:.18s;cursor:pointer;position:relative;background:#05070d}
.wpc:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(0,0,0,.5)}
.wpc.on{border-color:var(--accent);box-shadow:0 0 18px rgba(55,224,255,.35)}
.wpc canvas,.wpc .css{width:100%;height:82px;display:block}
.wpc span{display:block;padding:6px 9px;font-size:11.5px;background:rgba(0,0,0,.5);text-align:left}
.accents{display:flex;gap:9px;flex-wrap:wrap;margin-top:8px}
.acc{width:34px;height:34px;border-radius:50%;transition:.15s;position:relative;border:2px solid transparent}
.acc:hover{transform:scale(1.12)}
.acc.on{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.2)}

/* ---------- NEXUS AI ---------- */
.nx{display:flex;flex:1;min-height:0;position:relative;background:radial-gradient(ellipse at 50% 0%,rgba(55,224,255,.1),transparent 60%),rgba(2,4,10,.6)}
.nxCore{flex:0 0 190px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;border-right:1px solid rgba(255,255,255,.07);position:relative}
#nxOrb{width:118px;height:118px;cursor:pointer}
.nxCore .st{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--ok);text-align:center}
.nxCore .st.warn{color:var(--warn)}
.nxChat{flex:1;display:flex;flex-direction:column;min-width:0}
.nxLog{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:11px}
.msg{max-width:80%;padding:10px 13px;border-radius:14px;font-size:12.8px;line-height:1.6;animation:msgIn .28s cubic-bezier(.2,1.1,.3,1);white-space:pre-wrap;word-break:break-word}
@keyframes msgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.msg.u{align-self:flex-end;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#00121a;border-bottom-right-radius:4px;font-weight:500}
.msg.a{align-self:flex-start;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.11);border-bottom-left-radius:4px}
.msg.a .who{font-size:9px;letter-spacing:.2em;color:var(--accent);margin-bottom:4px;display:block}
.msg.sys{align-self:center;background:rgba(255,200,87,.12);border:1px solid rgba(255,200,87,.3);color:var(--warn);font-family:var(--mono);font-size:11px;text-align:center}
.nxIn{flex:0 0 auto;padding:11px 13px;border-top:1px solid rgba(255,255,255,.09);display:flex;gap:8px;background:rgba(0,0,0,.28)}
.nxChips{flex:0 0 auto;display:flex;gap:6px;padding:8px 13px;overflow-x:auto;border-top:1px solid rgba(255,255,255,.07);scrollbar-width:none}
.nxChips::-webkit-scrollbar{display:none}
.chip{padding:5px 11px;border-radius:20px;font-size:11px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);
  white-space:nowrap;transition:.14s;flex:0 0 auto}
.chip:hover{background:rgba(55,224,255,.24);border-color:var(--accent)}
.typing span{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--accent);margin-right:3px;animation:tdot 1.1s infinite}
.typing span:nth-child(2){animation-delay:.16s}.typing span:nth-child(3){animation-delay:.32s}
@keyframes tdot{0%,60%,100%{opacity:.28;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}


/* ==================================================================
   KERNEL/12-ACHV-DIAG
   src/kernel/12-achv-diag.css
   ================================================================== */

/* ---------- ACHIEVEMENTS ---------- */
.achv{flex:1;overflow-y:auto;padding:18px}
.achvHead{text-align:center;margin-bottom:20px}
.achvHead h2{font-size:22px;font-weight:300;letter-spacing:.18em;
  background:linear-gradient(90deg,#ffc857,#ff7a45);-webkit-background-clip:text;background-clip:text;color:transparent}
.achvHead p{font-size:12px;color:var(--muted);margin-top:5px}
.achvBar{height:8px;background:rgba(255,255,255,.08);border-radius:5px;overflow:hidden;max-width:340px;margin:13px auto 0}
.achvBar i{display:block;height:100%;background:linear-gradient(90deg,#ffc857,#ff7a45);transition:width .9s;box-shadow:0 0 12px rgba(255,200,87,.5)}
.achGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.achCard{border-radius:13px;padding:15px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
  display:flex;gap:12px;transition:.2s;opacity:.42;filter:grayscale(1)}
.achCard.got{opacity:1;filter:none;background:linear-gradient(135deg,rgba(255,200,87,.14),rgba(255,122,69,.07));
  border-color:rgba(255,200,87,.35)}
.achCard.got:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(255,200,87,.18)}
.achCard .md{flex:0 0 auto;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:rgba(255,255,255,.08);padding:8px}
.achCard.got .md{background:linear-gradient(135deg,#ffc857,#ff7a45);color:#241000;box-shadow:0 0 16px rgba(255,200,87,.4)}
.achCard .md svg{width:100%;height:100%}
.achCard b{display:block;font-size:12.5px;margin-bottom:4px;letter-spacing:.05em}
.achCard span{font-size:11px;color:var(--muted);line-height:1.5;display:block}
.achCard .dt{font-size:9.5px;color:var(--warn);margin-top:6px;display:block;font-family:var(--mono)}

/* ---------- DIAGNOSTICS ---------- */
.dg{flex:1;display:flex;flex-direction:column;background:rgba(2,6,10,.9);font-family:var(--mono);font-size:12px;color:#3ddc84;min-height:0}
.dgTop{flex:0 0 auto;padding:12px 16px;border-bottom:1px solid rgba(55,224,255,.18);display:flex;justify-content:space-between;align-items:center;
  background:rgba(55,224,255,.05)}
.dgTop b{color:#37e0ff;letter-spacing:.2em}
.dgGrid{flex:1;overflow-y:auto;padding:14px 16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;align-content:start}
.dgBox{border:1px solid rgba(55,224,255,.28);border-radius:9px;padding:11px 13px;background:rgba(55,224,255,.04)}
.dgBox h4{margin:0 0 9px;font-size:10px;letter-spacing:.2em;color:#37e0ff;font-weight:600;text-transform:uppercase}
.dgRow{display:flex;justify-content:space-between;padding:3px 0;font-size:11.5px;color:#8ea0bd}
.dgRow b{color:#3ddc84;font-weight:500}
.dgBar{height:14px;background:rgba(55,224,255,.09);border-radius:3px;overflow:hidden;margin:3px 0 8px;position:relative}
.dgBar i{display:block;height:100%;transition:width .4s;background:repeating-linear-gradient(90deg,#37e0ff 0 6px,rgba(0,0,0,.25) 6px 8px)}
.dgBar.warn i{background:repeating-linear-gradient(90deg,#ffc857 0 6px,rgba(0,0,0,.25) 6px 8px)}
#dgSpark{width:100%;height:56px;display:block;border:1px solid rgba(55,224,255,.28);border-radius:9px;background:rgba(55,224,255,.04)}
#dgFull{position:fixed;inset:0;z-index:7000;background:rgba(0,0,0,.9);display:none;flex-direction:column;padding:12px}
#dgFull.on{display:flex}
#dgFull .bar{flex:1;min-height:0;display:flex;flex-direction:column;border:1px solid rgba(55,224,255,.3);border-radius:12px;overflow:hidden;background:rgba(2,6,10,.95)}
#dgFull .hint{font-size:10px;color:#4a7f9e;text-align:center;padding-top:8px;letter-spacing:.1em}


/* ==================================================================
   APPS/MUSIC/MUSIC
   src/apps/music/music.css
   ================================================================== */

/* ============================================================
   MUSIC — the player layout and the now-playing overlay
   ============================================================
   Moved here from 09-paint-media.css and 14-music-video.css when the app
   left the kernel. The two rules that describe the same box — the inherited
   fixed-height slice and the override that gives it the leftover height —
   travel together on purpose: an override separated from the declaration it
   corrects is a rule with nothing to say, and .mdStage is the one place in
   this stylesheet where the second rule must beat the first. */

.md{display:flex;flex:1;min-height:0}
.mdMain{flex:1;display:flex;flex-direction:column;min-width:0;padding:14px;gap:12px;background:rgba(0,0,0,.24)}
/* The stage is a black box that fills the window and letterboxes its content.
   This is the inherited rule: a fixed 34% slice, sized for the old
   video-in-a-box media player. */
.mdStage{flex:0 0 auto;height:34%;min-height:110px;border-radius:13px;background:#000;display:grid;place-items:center;overflow:hidden;position:relative}
.mdStage video,.mdStage audio{width:100%;height:100%;object-fit:contain;background:#000}
/* …and this is the override, immediately after it. The visualiser is the
   point of this app, so the stage takes the leftover height instead and the
   transport keeps its intrinsic size. It must load after the rule above. */
.mdStage{flex:1 1 auto;height:auto;min-height:180px}
#mdViz{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.85}
.mdCtrl{flex:0 0 auto;display:flex;align-items:center;gap:11px}
.mdTime{font-size:11px;font-family:var(--mono);color:var(--muted);min-width:82px;text-align:right}
.mdList{width:210px;flex:0 0 auto;border-left:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;background:rgba(0,0,0,.18)}
.mdItem{display:flex;align-items:center;gap:9px;padding:8px 11px;font-size:11.5px;transition:.13s;cursor:default;width:100%;text-align:left}
.mdItem:hover{background:rgba(255,255,255,.08)}
.mdItem.on{background:linear-gradient(90deg,rgba(55,224,255,.24),transparent);box-shadow:inset 2px 0 0 var(--accent)}
.mdItem .ic{width:22px;height:22px;flex:0 0 auto;display:grid;place-items:center;color:var(--accent)}
.mdItem .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mdItem .x{opacity:.4}.mdItem .x:hover{opacity:1;color:var(--err)}

/* ---------- now-playing panel over the visualiser ---------- */
.muNow{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:5px;text-align:center;padding:18px;
  background:rgba(4,7,16,.55);backdrop-filter:blur(3px);pointer-events:none;
  transition:opacity .3s;
}
.muNow.live{opacity:0}
.muNow.live:hover{opacity:1}
.muNow b{font-size:15px;letter-spacing:.01em}
.muNow span{font-size:11px;color:var(--muted);max-width:340px;line-height:1.5}
.muArt{
  position:absolute;inset:0;overflow:hidden;pointer-events:none;
  filter:blur(26px) saturate(1.5);opacity:.5;
}
.muNow.live .muArt{opacity:.28}
#muViz{position:absolute;inset:0;width:100%;height:100%;display:block}

/* toolbar buttons latch visibly when a mode is on */
.toolbar .btn[data-on="1"]{background:rgba(55,224,255,.2);color:var(--accent);border-color:rgba(55,224,255,.5)}
.toolbar .btn[data-on="0"]{opacity:.6}


/* ==================================================================
   APPS/VIDEO/VIDEO
   src/apps/video/video.css
   ================================================================== */

/* ============================================================
   VIDEO — the player chrome around the reel or a real file
   ============================================================
   Moved here from 14-music-video.css when the app left the kernel.

   The shared transport widgets (.mbtn, .mdSeek) stay in the kernel's
   09-paint-media.css: the Music app uses them too, and a rule that belongs to
   two apps does not belong to either of their folders. Only what is exclusive
   to this player lives here.

   The stage fills its container exactly and is the surface that goes full
   screen, so it does not inherit the smaller fixed height the music
   visualiser uses. */

.vd{display:flex;flex-direction:column;flex:1;min-height:0;gap:10px;padding:12px;background:rgba(0,0,0,.24)}
.vdStage{
  flex:1;min-height:0;border-radius:13px;background:#000;overflow:hidden;
  position:relative;display:grid;place-items:center;cursor:pointer;
}
.vdStage video,.vdStage canvas{width:100%;height:100%;object-fit:contain;display:block;background:#000}
.vdEmpty{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:6px;text-align:center;color:var(--muted);padding:20px;
}
.vdEmpty b{font-size:15px;color:#c8d6ee}
.vdEmpty span{font-size:11.5px;max-width:320px;line-height:1.5}
.vdBig{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:66px;height:66px;border-radius:50%;display:grid;place-items:center;
  background:rgba(6,12,24,.62);border:1px solid rgba(255,255,255,.18);
  color:#fff;pointer-events:none;transition:.16s;backdrop-filter:blur(4px);
}
.vdBig svg{width:26px;height:26px;margin-left:3px}
.vdStage:hover .vdBig{background:rgba(6,12,24,.8)}
/* chapter / timecode burn-in from the generated reel */
.vdBadge{
  position:absolute;left:14px;top:12px;font-family:var(--mono);font-size:10px;
  letter-spacing:.1em;color:rgba(255,255,255,.62);background:rgba(0,0,0,.42);
  padding:4px 9px;border-radius:6px;pointer-events:none;display:none;
}
.vdBadge:empty{display:none}
.vdSubs{
  position:absolute;left:0;right:0;bottom:22px;text-align:center;
  font-size:17px;line-height:1.45;color:#fff;font-weight:600;
  text-shadow:0 2px 5px #000,0 0 12px rgba(0,0,0,.9);
  padding:0 8%;pointer-events:none;white-space:pre-line;
}
.vdBar{flex:0 0 auto;display:flex;align-items:center;gap:9px}
.vdTime{font-size:11px;font-family:var(--mono);color:var(--muted);min-width:82px;text-align:center}
.vdSeek{position:relative}
.vdSeek u{
  position:absolute;top:-3px;width:2px;height:12px;background:rgba(255,255,255,.5);
  border-radius:1px;cursor:pointer;
}
.vdSeek u:hover{background:var(--accent2);height:16px;top:-5px}
.vdRate{
  font-family:var(--mono);font-size:10.5px;color:var(--muted);cursor:pointer;
  padding:4px 7px;border-radius:6px;border:1px solid rgba(255,255,255,.13);
  min-width:38px;text-align:center;transition:.13s;
}
.vdRate:hover{background:rgba(255,255,255,.1);color:#c8d6ee}
.vdRate.on{color:var(--accent);border-color:var(--accent);background:rgba(55,224,255,.12)}
.vdBar .mbtn{font-size:9.5px;font-weight:700;letter-spacing:.04em;width:36px;height:36px}
.vdBar .mbtn svg{width:15px;height:15px}
.vdBar .mbtn.on{background:rgba(55,224,255,.2);color:var(--accent)}
.vdRecent{flex:0 0 auto;display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-height:0}
.vdChip{
  font-size:10.5px;padding:4px 9px;border-radius:20px;color:#c8d6ee;
  border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);
  max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:.13s;
}
.vdChip:hover{background:rgba(255,255,255,.13);color:#fff}

/* Fullscreen drops the window furniture entirely: the stage becomes the
   screen, so its rounded corners and the app padding have to go. */
.vdStage:fullscreen{border-radius:0}
.vdStage:fullscreen .vdSubs{bottom:42px;font-size:26px}
.vdStage:-webkit-full-screen{border-radius:0}

   KERNEL/13-RESPONSIVE
   src/kernel/13-responsive.css

/* ---------- RESPONSIVE ---------- */
@media (max-width:900px){
  .fmSide,.stSide{width:132px}
  .nxCore{flex-basis:130px}
  #nxOrb{width:92px;height:92px}

}

  .titem{min-width:38px;padding:0 8px}
  .fmSide,.stSide,.mdList,.ptSide{display:none}

  .dicon .ico{width:34px;height:34px}
  .msg{max-width:92%}
  #notifWrap{width:calc(100vw - 24px)}
  .calcVal{font-size:27px}
}
@media (max-height:560px){
  #icons{gap:2px}
  .dicon{padding:6px 3px 4px}
}

/* ============================================================
   KERNEL REGISTRY — the three names every module may reach for
   ============================================================
   APPS is the app table the whole desktop is built from. It lived at the
   top of 11-files.js, which made it look like the Files app owned it —
   it did not: fourteen modules fill it and nothing reads it there. The
   application registry is kernel infrastructure, so it is declared here,
   at the top of the shared scope, where the file name says what it is.

   formatLap renders a lap time. It is a kernel service for the same
   reason: two game modules format laps with it, so it is a shared name
   rather than one app's private helper.

   applySettings pushes S into every service that renders from it. It was
   declared by the settings app and CALLED BY THE BOOT SEQUENCE, which
   meant the boot path depended on a name an app happened to declare.
   It dispatches only to kernel services, so the ownership is the
   kernel's and the settings app is one consumer among others.

   Ordering is load-bearing. This file sorts AFTER 01-core.js, which is
   where `function register(ctx) {` opens, and BEFORE every file that
   uses these names. A `00-` prefix would put it before that brace and
   leave it in the wrapper's own scope, where it cannot reach Wall, WM,
   Diag, Audio2 or applyTheme — they are declared inside register()'s
   body, so applySettings would throw ReferenceError the first time
   settings were applied. The prefix is 01 for that reason and no other.
   ============================================================ */
const APPS={};

/* Elapsed millis as M:SS.mmm — the lap-time readout for both games. Pure,
   so it belongs to the kernel rather than to whichever game calls it. */
function formatLap(ms){const s=ms/1000;return Math.floor(s/60)+':'+(s%60).toFixed(3).padStart(6,'0')}

/* Push the settings object S into every service that renders from it:
   CSS custom properties, the taskbar, the window manager, audio volume
   and the clock. Called by the settings app on every change AND by the
   boot sequence before the first frame. */
function applySettings(){
  const r=document.documentElement.style;
  r.setProperty('--accent',S.accent);
  r.setProperty('--accent2',S.accent2);
  r.setProperty('--opacity',(S.transparency/100).toFixed(2));
  r.setProperty('--blur',Math.round(10+(S.transparency/100)*14));
  r.setProperty('--icon-size',({small:'64px',medium:'88px',large:'112px'}[S.iconSize]||'88px'));
  r.setProperty('--taskbar-pos',S.taskbarPos);
  const tb=$('#taskbar');
  const moved=S.taskbarPos==='top';
  if(moved){tb.style.top='0px';tb.style.bottom='auto';tb.style.flexDirection='row-reverse'}
  else{tb.style.top='auto';tb.style.bottom='0px';tb.style.flexDirection='row'}
  if(document.body.dataset.tbpos!==S.taskbarPos){document.body.dataset.tbpos=S.taskbarPos;WM.reflow()}
  document.body.classList.toggle('no-anim',!S.animations);
  Audio2.setVol(S.volume);
  startClock();
  if(document.body.dataset.theme!==S.theme){document.body.dataset.theme=S.theme;applyTheme(S.theme)}
}

   ================================================================== */

/* Sound routing.
   Every sound belongs to exactly one category, and the Settings toggles switch
   them independently:

     'ui'    system chrome, apps, terminal, assistant
     'game'  the arcade
     'media' music and video playback

   The volume slider is the master fader. Sounds are suppressed at the source,
   so a muted category never even builds an oscillator.

   Graph — one AudioContext for the whole system:

     voices / <audio> / <video>  ->  bus  ->  analyser  ->  master  ->  out

   Everything connects to `bus`, never to the destination. Connecting straight
   to the destination is what makes the volume slider appear to do nothing, and
   a second AudioContext per subsystem is what exhausts Chrome's context limit.
   The analyser sits on the bus so a visualiser can read the mix without
   tapping a private node. */
const Audio2={
  ctx:null, master:null, bus:null, _ana:null,
  init(){
    if(this.ctx)return;
    try{
      const AC=window.AudioContext||window.webkitAudioContext;
      this.ctx=new AC();
      this.bus=this.ctx.createGain();
      this.ana=this.ctx.createAnalyser();
      this.ana.fftSize=256;
      this.ana.smoothingTimeConstant=.75;
      this.master=this.ctx.createGain();
      this.master.gain.value=this._vol();
      this.bus.connect(this.ana);
      this.ana.connect(this.master);
      this.master.connect(this.ctx.destination);
    }catch(e){}
  },
  _vol(){return Math.max(0,Math.min(100,+S.volume||0))/100},
  resume(){this.init();if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume()},
  setVol(v){this.init();if(this.master)this.master.gain.value=Math.max(0,Math.min(100,+v||0))/100},
  /* Shared spectrum tap for visualisers. fftSize/2 bins, 0..255. */
  analyser(){this.init();return this.ana},
  spectrum(out){if(!this.ana)return null;this.ana.getByteFrequencyData(out);return out},
  /* The single input every producer must connect to. Null if audio is
     unavailable, so callers degrade instead of throwing. */
  input(){this.init();return this.bus},
  /* Is a sound in this category currently allowed to play? */
  on(cat){
    if(S.volume<=0)return false;
    return cat==='game'?!!S.gameSounds:cat==='media'?!!S.mediaSounds:!!S.uiSounds;
  },
  tone(freq,dur,type,vol,slideTo,delay,cat){
    if(!this.on(cat))return;
    this.init();
    if(!this.ctx||this.ctx.state==='closed')return;
    const t0=this.ctx.currentTime+(delay||0);
    const o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(freq,t0);
    if(slideTo)o.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo),t0+dur);
    const peak=(vol==null?.16:vol);
    g.gain.setValueAtTime(.0001,t0);
    g.gain.exponentialRampToValueAtTime(peak,t0+Math.min(.02,dur/3));
    g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    o.connect(g);g.connect(this.bus);
    o.start(t0);o.stop(t0+dur+.02);
  },
  noise(dur,vol,hp,cat){
    if(!this.on(cat))return;
    this.init();
    if(!this.ctx||this.ctx.state==='closed')return;
    const t0=this.ctx.currentTime;
    const n=Math.floor(this.ctx.sampleRate*dur);
    const buf=this.ctx.createBuffer(1,n,this.ctx.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
    const s=this.ctx.createBufferSource();s.buffer=buf;
    const f=this.ctx.createBiquadFilter();f.type=hp?'highpass':'lowpass';f.frequency.value=hp||900;
    const g=this.ctx.createGain();g.gain.value=vol||.1;
    s.connect(f);f.connect(g);g.connect(this.bus);s.start();
  },
  click(){this.tone(880,.05,'triangle',.07,660,undefined,'ui')},
  hover(){this.tone(1400,.02,'sine',.02,undefined,undefined,'ui')},
  open(){this.tone(520,.12,'sine',.10,880,undefined,'ui');this.tone(1040,.09,'sine',.04,1320,.04,'ui')},
  close(){this.tone(700,.10,'sine',.07,380,undefined,'ui')},
  notify(){this.tone(880,.09,'sine',.10,undefined,undefined,'ui');this.tone(1320,.12,'sine',.08,undefined,.08,'ui')},
  error(){this.tone(220,.18,'square',.08,150,undefined,'ui')},
  key(){this.tone(1500,.014,'square',.016,undefined,undefined,'ui')},
  achv(){[523,659,784,1046,1318].forEach((f,i)=>this.tone(f,.16,'triangle',.09,undefined,i*.075,'ui'));},
  eat(){this.tone(660,.07,'square',.08,1180,undefined,'game');this.tone(1320,.06,'sine',.05,1760,.05,'game')},
  die(){this.tone(340,.5,'sawtooth',.12,80,undefined,'game')},
  crash(){this.noise(.28,.18,600,'game');this.tone(120,.3,'sawtooth',.12,50,undefined,'game')},
  win(){[659,784,988,1318].forEach((f,i)=>this.tone(f,.2,'sine',.09,undefined,i*.09,'game'));},
  boot(){[110,165,220,330,440,660].forEach((f,i)=>this.tone(f,.5,'sine',.07,undefined,i*.11,'ui'));}
};

const VFS={
  tree:null,
  uid(){return 'n'+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4)},
  default(){
    const D=(n)=>({id:this.uid(),name:n,type:'dir',children:[],mtime:Date.now(),ctime:Date.now()});
    const F=(n,c)=>({id:this.uid(),name:n,type:'file',content:c||'',mtime:Date.now(),ctime:Date.now(),size:0});
    const mk=(n,ch)=>{const d=D(n);d.children=ch;return d};
    const root=D('/');
    root.children=[
      mk('Desktop',[
        F('Welcome.txt',WELCOME_TEXT),
        D('Screenshots')
      ]),
      mk('Documents',[
        F('Welcome.txt',WELCOME_TEXT),
        F('Ideas.txt',IDEAS_TEXT),
        D('Reports',[F('quarterly.txt','Q3 revenue: +12%\nUser growth: +8%\nChurn: -3%\n\nNotes: everything is going well.')])
      ]),
      mk('Downloads',[
        F('readme.md','# Downloads\n\nDrop files here.\nUse the Terminal to create files: `touch notes.txt`')
      ]),
      mk('Pictures',[]),
      mk('Music',[]),
      mk('Videos',[]),
      mk('Games',[]),
      mk('Home',[D('Projects'),D('Notes')]),
      mk('.config',[F('secret',SECRET_TEXT)])
    ];
    return root;
  },
  load(){
    const raw=LS.get('fs',null);
    this.tree=raw?this.rehydrate(raw):this.default();
    if(!this.tree)this.tree=this.default();
    this.recalc(this.tree);
  },
  rehydrate(n){
    if(!n||typeof n!=='object')return n;
    if(!n.id)n.id=this.uid();
    n.mtime=n.mtime||Date.now(); n.ctime=n.ctime||n.mtime;
    if(n.type==='dir'){n.children=n.children||[];n.children.forEach(c=>this.rehydrate(c))}
    else {n.content=n.content||''}
    return n;
  },
  recalc(n){
    if(!n)return 0;
    if(n.type!=='dir'){n.size=n.dataUrl||n.blobUrl?Math.round(((n.dataUrl||n.blobUrl).length)*0.75):(n.content?n.content.length*2:0);return n.size}
    let s=0;(n.children||[]).forEach(c=>{s+=this.recalc(c)});
    n.size=s;return s;
  },
  save(){
    this.recalc(this.tree);
    LS.set('fs',this.tree);
    trackStorage();
    Bus.emit('fs');
  },
  norm(p,cwd){
    if(!p)p='/';
    let a=(p.startsWith('/')?p:(cwd||'/')+'/'+p).split('/');
    const st=[];
    for(const s of a){ if(!s||s==='.')continue; if(s==='..')st.pop(); else st.push(s); }
    return '/'+st.join('/');
  },
  node(p,cwd){
    const f=this.norm(p,cwd);
    if(f==='/')return this.tree;
    let cur=this.tree;
    for(const seg of f.slice(1).split('/')){
      if(cur.type!=='dir')return null;
      const nx=(cur.children||[]).find(c=>c.name.toLowerCase()===seg.toLowerCase());
      if(!nx)return null;
      cur=nx;
    }
    return cur;
  },
  parent(p,cwd){
    const f=this.norm(p,cwd);
    if(f==='/')return null;
    const i=f.lastIndexOf('/');
    const pp=i<=0?'/':f.slice(0,i);
    return {dir:this.node(pp),path:pp};
  },
  exists(p,cwd){return !!this.node(p,cwd)},
  uniqName(dir,name){
    let n=name, i=1;
    const has=x=>(dir.children||[]).some(c=>c.name.toLowerCase()===x.toLowerCase());
    if(!has(name))return name;
    const dot=name.lastIndexOf('.');
    const base=dot>0?name.slice(0,dot):name, ext=dot>0?name.slice(dot):'';
    do{n=base+' ('+(++i)+')'+ext}while(has(n));
    return n;
  },
  mkdir(p,cwd){

    if(!par.dir)return {err:'parent not found'};
    if(par.dir.type!=='dir')return {err:'not a directory'};
    const seg=p.replace(/\/+$/,'').split('/').pop();
    if(par.dir.children.some(c=>c.name.toLowerCase()===seg.toLowerCase()))return {err:'already exists'};
    const nd={id:this.uid(),name:seg,type:'dir',children:[],mtime:Date.now(),ctime:Date.now(),size:0};
    par.dir.children.push(nd); this.save();
    return {node:nd,path:this.norm(p,cwd)};
  },
  write(p,content,cwd){
    const par=this.parent(p,cwd); if(!par)return {err:'invalid path'};
    if(!par.dir||par.dir.type!=='dir')return {err:'directory not found'};
    const seg=p.replace(/\/+$/,'').split('/').pop();
    let f=par.dir.children.find(c=>c.name.toLowerCase()===seg.toLowerCase());
    if(f&&f.type==='dir')return {err:'is a directory'};
    if(!f){f={id:this.uid(),name:seg,type:'file',content:'',mtime:Date.now(),ctime:Date.now(),size:0};par.dir.children.push(f)}
    f.content=content;f.mtime=Date.now();
    this.save();return {node:f,path:this.norm(p,cwd)};
  },
  rm(p,cwd,force){
    const par=this.parent(p,cwd); if(!par)return {err:'cannot remove root'};
    const nm=p.replace(/\/+$/,'').split('/').pop();
    const i=par.dir.children.findIndex(c=>c.name.toLowerCase()===nm.toLowerCase());
    if(i<0)return {err:'not found'};
    if(!force&&par.dir.children[i].type==='dir'&&par.dir.children[i].children.length)
      return {err:'directory not empty',node:par.dir.children[i]};
    const [nd]=par.dir.children.splice(i,1);
    if(nd.blobUrl)URL.revokeObjectURL(nd.blobUrl);
    this.save();return {node:nd,path:this.norm(p,cwd)};
  },
  rename(p,newName,cwd){
    const par=this.parent(p,cwd); if(!par)return {err:'invalid'};
    const nm=p.replace(/\/+$/,'').split('/').pop();
    const f=par.dir.children.find(c=>c.name.toLowerCase()===nm.toLowerCase());
    if(!f)return {err:'not found'};
    newName=String(newName).replace(/[\/\\]/g,'').trim();
    if(!newName)return {err:'invalid name'};
    if(newName.toLowerCase()!==nm.toLowerCase()&&par.dir.children.some(c=>c.name.toLowerCase()===newName.toLowerCase()))
      return {err:'name already used'};
    f.name=newName;f.mtime=Date.now();this.save();
    return {node:f,path:this.norm(p,cwd)};
  },
  move(src,dstDir,cwd){
    const sp=this.norm(src,cwd), dp=this.norm(dstDir,cwd);
    if(sp===dp)return {err:'same location'};
    if(dp.startsWith(sp+'/'))return {err:'cannot move into itself'};
    const s=this.node(sp); const d=this.node(dp);
    if(!s)return {err:'source not found'};
    if(!d||d.type!=='dir')return {err:'target not a directory'};
    const par=this.parent(sp);
    const i=par.dir.children.findIndex(c=>c.id===s.id);
    par.dir.children.splice(i,1);
    s.name=this.uniqName(d,s.name);
    s.mtime=Date.now();
    d.children.push(s);
    this.save();
    return {node:s,path:dp+'/'+s.name};
  },
  copy(src,dstDir,cwd){
    const sp=this.norm(src,cwd), dp=this.norm(dstDir,cwd);
    if(sp===dp)return {err:'same location'};
    if(dp.startsWith(sp+'/'))return {err:'cannot copy into itself'};
    const s=this.node(sp), d=this.node(dp);
    if(!s)return {err:'source not found'};
    if(!d||d.type!=='dir')return {err:'target not a directory'};
    const clone=JSON.parse(JSON.stringify(s));
    const reid=n=>{n.id=this.uid();if(n.children)n.children.forEach(reid)};
    reid(clone);
    clone.name=this.uniqName(d,clone.name);
    clone.mtime=Date.now();clone.ctime=Date.now();
    d.children.push(clone);
    this.save();

  },
  search(q){
    q=String(q).toLowerCase();const out=[];
    const walk=(n,path)=>{
      const p=path+(path.endsWith('/')?'':'/')+n.name;
      if(n.name.toLowerCase().includes(q))out.push({node:n,path:p});
      if(n.children)n.children.forEach(c=>walk(c,p));
    };
    (this.tree.children||[]).forEach(c=>walk(c,'/'));
    return out;
  },
  stats(){
    let files=0,dirs=0,bytes=0,deepest=0;
    const walk=(n,d)=>{
      if(n.type==='dir'){dirs++;deepest=Math.max(deepest,d);(n.children||[]).forEach(c=>walk(c,d+1))}
      else{files++;bytes+=n.size||0}
    };
    walk(this.tree,0);
    return {files,dirs,bytes,deepest};
  },
  treeText(path,cwd,depth,prefix,out){
    depth=depth||0;prefix=prefix||'';out=out||'';
    const d=(path&&typeof path==='object')?path:this.node(path,cwd);
    if(!d||d.type!=='dir')return out;
    const ch=[...(d.children||[])].sort((a,b)=>
      (a.type===b.type)?a.name.localeCompare(b.name):(a.type==='dir'?-1:1));
    ch.forEach((c,i)=>{
      const last=i===ch.length-1;
      out+=prefix+(last?'└── ':'├── ')+(c.type==='dir'?'\x1b[36m'+c.name+'\x1b[0m':c.name);
      if(c.type==='dir'&&depth<6)out+='\n'+this.treeText(c,'',depth+1,prefix+(last?'    ':'│   '),'');
    });
    return out;
  }
};

function ago(t){
  const s=(Date.now()-t)/1000;
  if(s<60)return Math.max(1,Math.floor(s))+'s ago';
  if(s<3600)return Math.floor(s/60)+'m ago';
  if(s<86400)return Math.floor(s/3600)+'h ago';
  return Math.floor(s/86400)+'d ago';
}

const Wall={
  cur:null, cv:null, ctx:null, raf:0, t:0, parts:[], stars:[], running:false,
  init(){
    const w=$('#wall'); w.innerHTML='';
    this.cv=el('canvas','',w); this.cv.id='wpCanvas';
    this.ctx=this.cv.getContext('2d');
    this.resize();
    addEventListener('resize',()=>this.resize());
    this.apply(S.wallpaper,true);
  },
  resize(){
    if(!this.cv)return;
    const d=Math.min(devicePixelRatio||1,2);
    this.cv.width=innerWidth*d; this.cv.height=innerHeight*d;
    this.ctx.setTransform(d,0,0,d,0,0);
    this.W=innerWidth;this.H=innerHeight;
    this.seed();
  },
  seed(){
    this.stars=[];for(let i=0;i<170;i++)this.stars.push({x:Math.random()*this.W,y:Math.random()*this.H,
      r:Math.random()*1.4+.2,s:Math.random()*.9+.15,tw:Math.random()*6.28});
  },
  /* NULLSPACE is hidden until its easter egg is found, so that Shuffle cannot
     hand it out by accident and the Settings grid cannot spoil it. */
  shufflable(){return WALLPAPERS.filter(w=>!w.secret||Eggs.found['wp-zero'])},
  apply(id,silent){
    const wp=WALLPAPERS.find(w=>w.id===id)||WALLPAPERS[0];
    this.cur=wp.id;
    if(!silent){S.wallpaper=wp.id;LS.set('settings',S)}
    document.body.style.setProperty('--wp-id',wp.id);
    this.t=0;this.seed();
    if(!this.running){this.running=true;this.loop()}
    if(wp.secret)Eggs.mark('wp-zero');
  },
  loop(){
    this.raf=requestAnimationFrame(()=>this.loop());
    if(!S.animations){this.drawStatic();return}
    this.t+=0.016;
    this.draw(this.t);
  },
  drawStatic(){this.draw(0)},
  draw(t){
    const c=this.ctx,W=this.W,H=this.H,k=this.cur;
    c.clearRect(0,0,W,H);
    const A=S.accent,A2=S.accent2;
    const grad=(x0,y0,x1,y1,stops)=>{const g=c.createLinearGradient(x0,y0,x1,y1);stops.forEach(s=>g.addColorStop(s[0],s[1]));return g};

    if(k==='city'){
      c.fillStyle=grad(0,0,0,H,[[0,'#05070f'],[.45,'#0b1226'],[1,'#1a0f2e']]);c.fillRect(0,0,W,H);
      // sun
      const sy=H*.42,sr=Math.min(W,H)*.20;
      const sg=c.createRadialGradient(W*.5,sy,0,W*.5,sy,sr*1.6);
      sg.addColorStop(0,'rgba(255,110,180,.55)');sg.addColorStop(.4,'rgba(255,60,140,.22)');sg.addColorStop(1,'rgba(255,60,140,0)');
      c.fillStyle=sg;c.fillRect(0,0,W,H);
      c.save();c.beginPath();c.arc(W*.5,sy,sr,0,7);c.clip();
      c.fillStyle=grad(0,sy-sr,0,sy+sr,[[0,'#ffd76b'],[.5,'#ff6bb0'],[1,'#a05cff']]);c.fillRect(W*.5-sr,sy-sr,sr*2,sr*2);
      c.fillStyle='rgba(10,6,25,.85)';
      for(let i=0;i<9;i++){const y=sy+sr*0.12*i;c.fillRect(W*.5-sr,y,sr*2,Math.max(1,sr*0.028*(1+i*.16)))}
      c.restore();
      // grid
      const hy=H*.62;
      c.strokeStyle='rgba(80,220,255,.30)';c.lineWidth=1;
      for(let i=0;i<=26;i++){const x=(i/26)*W;c.beginPath();c.moveTo(x,hy);c.lineTo(W/2+(x-W/2)*2.6,H);c.stroke()}
      for(let i=0;i<20;i++){const p=((i/20+t*.28)%1);const y=hy+p*p*(H-hy);

    }
    Audio2.close();
    this.renderTaskbar();
  },
  restore(id){
    const w=this.wins.find(x=>x.id===id);if(!w)return;
    w.min=false;w.el.style.display='';w.el.classList.remove('min');
    this.focus(id);
  },
  toggleMax(id){
    const w=this.wins.find(x=>x.id===id);if(!w||!w.resizable)return;
    if(w.max){w.max=false;w.el.classList.remove('max');
      Object.assign(w,w.pre);
    }else{
      w.pre={x:w.x,y:w.y,w:w.w,h:w.h};
      w.max=true;w.el.classList.add('max');
    }
    w.el.classList.add('snapping');
    this.applyGeo(w);
    Audio2.click();
  },
  close(id){
    const i=this.wins.findIndex(x=>x.id===id);if(i<0)return;
    const w=this.wins[i];
    if(w.api&&w.api.destroy){try{w.api.destroy()}catch(e){}}
    w.el.classList.add('closing');
    Audio2.close();
    setTimeout(()=>w.el.remove(),160);
    this.wins.splice(i,1);
    if(this.focused===id){
      this.focused=null;
      const nxt=this.wins.filter(x=>!x.min).sort((a,b)=>(+b.el.style.zIndex)-(+a.el.style.zIndex))[0];
      if(nxt)this.focus(nxt.id);
    }
    this.renderTaskbar();
  },
  get(id){return this.wins.find(x=>x.id===id)},
  cycle(){
    const list=this.wins.filter(w=>!w.min);
    if(!list.length)return;
    const sorted=list.sort((a,b)=>(+b.el.style.zIndex)-(+a.el.style.zIndex));
    const nxt=sorted[1]||sorted[0];
    this.focus(nxt.id);
    if(sorted.length>1)toast(sorted.length>2?'Cycle window: '+nxt.title:'Cycle window: '+nxt.title);
  },
  minimizeAll(){this.wins.filter(w=>!w.min).forEach(w=>this.minimize(w.id))},
  closeAll(){[...this.wins].forEach(w=>this.close(w.id))},
  renderTaskbar(){
    const t=$('#taskItems');t.innerHTML='';
    this.wins.forEach(w=>{
      const b=el('button','titem'+(this.focused===w.id?' active':''),t);
      b.innerHTML=`<span class="ic">${w.icon}</span><span class="tt">${esc(w.title)}</span><span class="und"></span>`;
      b.title=w.title;
      b.onclick=()=>{
        Audio2.click();
        if(this.focused===w.id&&!w.min)this.minimize(w.id);
        else if(w.min)this.restore(w.id);
        else this.focus(w.id);
      };
      b.oncontextmenu=e=>{
        e.preventDefault();
        ctxMenu(e.clientX,e.clientY,[
          {label:w.min?'Restore':'Minimize',icon:ICONS.min,act:()=>w.min?this.restore(w.id):this.minimize(w.id)},
          {label:w.max?'Restore Down':'Maximize',icon:ICONS.max,act:()=>this.toggleMax(w.id),dis:w.resizable===false},
          {sep:1},
          {label:'Close',icon:ICONS.x,act:()=>this.close(w.id)}
        ],'Window: '+w.title);
      };
    });
  },
  reflow(){
    const A=this.workArea();
    this.wins.forEach(w=>{
      if(w.max){this.applyGeo(w);return}
      if(w.x>A.w-90)w.x=Math.max(A.x,A.w-w.w-10);
      if(w.y>A.y+A.h-60)w.y=Math.max(A.y,A.y+A.h-70);
      w.w=Math.min(w.w,A.w-16);
      w.h=Math.min(w.h,A.h-80);
      this.applyGeo(w);
    });
  }
};

let openCtx=null;
function ctxMenu(x,y,items,title){
  closeCtx();
  const m=el('div','ctx');document.body.appendChild(m);
  if(title)m.appendChild(Object.assign(el('div','title'),{textContent:title}));
  items.forEach(it=>{
    if(it.sep){el('hr','',m);return}
    const b=el('button','',m);
    b.innerHTML=(it.icon||'')+`<span>${esc(it.label)}</span>`+(it.key?`<span class="k">${esc(it.key)}</span>`:'');
    if(it.dis)b.style.opacity=.35;
    b.onclick=e=>{e.stopPropagation();closeCtx();Audio2.click();it.act&&it.act()};
    m.appendChild(b);
  });
  m.style.left='0px';m.style.top='0px';
  const r=m.getBoundingClientRect();
  m.style.left=Math.min(x,innerWidth-r.width-8)+'px';
  m.style.top=Math.min(y,innerHeight-r.height-8)+'px';
  openCtx=m;
  setTimeout(()=>document.addEventListener('pointerdown',ctxOutside),true);
  return m;
}
function ctxOutside(e){if(openCtx&&!openCtx.contains(e.target))closeCtx()}

const Clipboard={items:[],mode:'copy',
  copy(paths){this.items=paths.map(p=>({src:VFS.norm(p)}));this.mode='copy';Bus.emit('fs')},
  cut(paths){this.items=paths.map(p=>({src:VFS.norm(p)}));this.mode='cut';Bus.emit('fs')},
  pasteInto(dir){
    let n=0;
    this.items.forEach(it=>{
      const r=this.mode==='cut'?VFS.move(it.src,dir):VFS.copy(it.src,dir);
      if(!r.err)n++;
    });
    if(this.mode==='cut')this.items=[];
    if(n)toast(`${n} item${n>1?'s':''} pasted`);
    return n;
  }
};

function cascade(){
  WM.wins.forEach((w,i)=>{
    if(w.max){w.max=false;w.el.classList.remove('max')}
    w.min=false;w.el.style.display='';w.el.classList.remove('min');
    w.x=40+i*30;w.y=30+i*28;w.w=Math.min(880,innerWidth-80-i*30);w.h=Math.min(600,innerHeight-130-i*28);
    w.el.classList.add('snapping');WM.applyGeo(w);
  });
  WM.renderTaskbar();
}
function tile(){
  const l=WM.wins.filter(w=>!w.min);
  if(!l.length)return;
  const cols=Math.ceil(Math.sqrt(l.length)),rows=Math.ceil(l.length/cols);
  l.forEach((w,i)=>{
    if(w.max){w.max=false;w.el.classList.remove('max')}
    const cx=i%cols, cy=(i/cols)|0;
    w.x=Math.round(cx*innerWidth/cols);w.y=Math.round(cy*innerHeight/rows);
    w.w=Math.round(innerWidth/cols)-4;w.h=Math.round(innerHeight/rows)-4;
    w.el.classList.add('snapping');WM.applyGeo(w);
  });
}

/* ---------- LOCK SCREEN ---------- */
function lockScreen(){
  const w=el('div','');
  w.style.cssText='position:fixed;inset:0;z-index:98000;background:radial-gradient(circle at 50% 40%,#0b1430,#03050c 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;backdrop-filter:blur(10px)';
  const t=new Date();
  w.innerHTML=`<div style="font-size:80px;font-weight:100;letter-spacing:.06em;color:#e8f1ff;line-height:1">${S.clock24?pad(t.getHours())+':'+pad(t.getMinutes()):((t.getHours()%12)||12)+':'+pad(t.getMinutes())+' '+(t.getHours()<12?'AM':'PM')}</div>
    <div style="color:#8ea0bd;letter-spacing:.24em;font-size:12px">${fmtDayLong(t)}</div>
    <div style="width:76px;height:76px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-size:30px;font-weight:700;color:#001018;box-shadow:0 0 40px rgba(55,224,255,.4)">U</div>
    <div style="color:#8ea0bd;font-size:13px">Click anywhere or press any key to unlock</div>`;
  document.body.appendChild(w);
  Audio2.toneless;
  const un=()=>{w.remove();document.removeEventListener('keydown',un);Audio2.resume()};
  w.onclick=un;document.addEventListener('keydown',un);
  setTimeout(()=>Audio2.tone(440,.3,'sine',.08),50);
}
